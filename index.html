<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>UZMAP</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

<script src="./district-names-ru.js"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family:
        Arial,
        sans-serif;
}

#map {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;
}


/* =====================================================
   LOGO
===================================================== */

.logo {

    position: absolute;

    z-index: 100;

    top: 18px;
    left: 18px;

    background: white;

    padding: 13px 18px;

    border-radius: 15px;

    font-size: 22px;

    font-weight: 700;

    box-shadow:
        0 3px 15px rgba(0,0,0,.18);
}


/* =====================================================
   SEARCH
===================================================== */

.search-box {

    position: absolute;

    z-index: 100;

    top: 75px;

    left: 18px;
    right: 18px;

    max-width: 600px;

    margin: auto;

    display: flex;

    align-items: center;

    background: white;

    border-radius: 15px;

    box-shadow:
        0 3px 15px rgba(0,0,0,.18);
}

.search-icon {

    padding-left: 15px;

    font-size: 22px;
}

#searchInput {

    flex: 1;

    border: none;

    outline: none;

    background: transparent;

    font-size: 17px;

    padding: 15px 10px;
}

#searchButton {

    border: none;

    background: transparent;

    font-size: 21px;

    padding: 12px 15px;

    cursor: pointer;
}


/* =====================================================
   SEARCH RESULTS
===================================================== */

#searchResults {

    position: absolute;

    z-index: 200;

    top: calc(100% + 7px);

    left: 0;
    right: 0;

    background: white;

    border-radius: 13px;

    overflow: hidden;

    box-shadow:
        0 4px 20px rgba(0,0,0,.2);

    display: none;

    max-height: 300px;

    overflow-y: auto;
}

.search-result {

    padding: 13px 16px;

    border-bottom:
        1px solid #eee;

    cursor: pointer;

    font-size: 16px;
}

.search-result:hover {

    background: #f2f2f2;
}


/* =====================================================
   INFO PANEL
===================================================== */

#infoPanel {

    position: absolute;

    z-index: 150;

    left: 15px;
    right: 15px;

    bottom: 15px;

    max-width: 420px;

    margin: auto;

    background: white;

    border-radius: 18px;

    box-shadow:
        0 4px 25px rgba(0,0,0,.25);

    padding: 18px;

    display: none;
}

.info-title {

    font-size: 20px;

    font-weight: 700;

    margin-bottom: 10px;
}

.info-row {

    font-size: 15px;

    margin-top: 7px;
}

.info-close {

    position: absolute;

    right: 10px;
    top: 8px;

    border: none;

    background: transparent;

    font-size: 24px;

    color: #1677ff;

    cursor: pointer;
}


/* =====================================================
   LOADING
===================================================== */

#loading {

    position: absolute;

    z-index: 500;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%);

    background: white;

    padding: 15px 20px;

    border-radius: 13px;

    box-shadow:
        0 4px 20px rgba(0,0,0,.2);
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .logo {

        top: 12px;
        left: 12px;

        font-size: 20px;

        padding: 11px 15px;
    }

    .search-box {

        top: 65px;

        left: 12px;
        right: 12px;
    }

}

</style>

</head>


<body>


<div id="map"></div>


<div class="logo">

    🇺🇿 UZMAP

</div>


<div class="search-box">

    <div class="search-icon">
        🔎
    </div>

    <input
        id="searchInput"
        type="text"
        placeholder="Найти улицу, район..."
        autocomplete="off"
    >

    <button
        id="searchButton"
        type="button"
    >
        🔍
    </button>

    <div id="searchResults"></div>

</div>


<div id="loading">
    Загрузка карты...
</div>


<div id="infoPanel">

    <button
        class="info-close"
        onclick="closeInfo()"
    >
        ×
    </button>

    <div
        id="infoTitle"
        class="info-title"
    ></div>

    <div
        id="infoBody"
    ></div>

</div>


<script>


/* =====================================================
   НАСТРОЙКИ
===================================================== */

const MAP_CENTER = [
    64.5853,
    41.3775
];

const START_ZOOM = 5;


/* =====================================================
   СОЗДАЁМ MAPLIBRE
===================================================== */

const map = new maplibregl.Map({

    container: "map",

    /*
     * OpenFreeMap Liberty
     *
     * Векторная карта:
     * дороги
     * улицы
     * здания
     * POI
     * города
     */

    style:
        "https://tiles.openfreemap.org/styles/liberty",

    center:
        MAP_CENTER,

    zoom:
        START_ZOOM,

    minZoom:
        4,

    maxZoom:
        19

});


/* =====================================================
   НАВИГАЦИЯ
===================================================== */

map.addControl(

    new maplibregl.NavigationControl(),

    "top-right"

);


/* =====================================================
   ГЛОБАЛЬНЫЕ ДАННЫЕ
===================================================== */

let districtsData = null;

let regionsData = null;

let citiesData = null;

let selectedDistrict = null;


/* =====================================================
   ЗАГРУЗКА JSON
===================================================== */

async function loadJSON(file) {

    const response =
        await fetch(
            "./" + file
        );

    if (!response.ok) {

        throw new Error(
            file + " не найден"
        );

    }

    return await response.json();

}


/* =====================================================
   НАЗВАНИЕ РАЙОНА
===================================================== */

function getDistrictName(properties) {

    if (!properties) {

        return "Район";

    }


    const original = String(

        properties.shapeName ||

        properties.NAME_2 ||

        properties.name ||

        properties.NAME ||

        properties.Name ||

        ""

    ).trim();


    if (!original) {

        return "Район";

    }


    const clean =
        original
            .replace(
                /\s+District$/i,
                ""
            )
            .trim();


    if (
        typeof DISTRICT_NAMES_RU !==
        "undefined"
    ) {

        if (
            DISTRICT_NAMES_RU[original]
        ) {

            return DISTRICT_NAMES_RU[
                original
            ];

        }


        if (
            DISTRICT_NAMES_RU[clean]
        ) {

            return DISTRICT_NAMES_RU[
                clean
            ];

        }


        const key =

            Object.keys(
                DISTRICT_NAMES_RU
            ).find(

                item =>

                    item.toLowerCase() ===
                    clean.toLowerCase()

            );


        if (key) {

            return DISTRICT_NAMES_RU[
                key
            ];

        }

    }


    return original;

}


/* =====================================================
   НАЗВАНИЕ ОБЛАСТИ
===================================================== */

function getRegionName(properties) {

    if (!properties) {

        return "Узбекистан";

    }


    return (

        properties.region ||

        properties.REGION ||

        properties.NAME_1 ||

        properties.name_1 ||

        properties.parent ||

        "Узбекистан"

    );

}


/* =====================================================
   HTML SECURITY
===================================================== */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   MAP LOAD
===================================================== */

map.on(

    "load",

    async function() {

        try {

            console.log(
                "UZMAP: загрузка..."
            );


            /* =========================================
               ЗАГРУЖАЕМ НАШИ GEOJSON
            ========================================= */

            const [

                districts,

                regions,

                cities

            ] = await Promise.all([

                loadJSON(
                    "uzbekistan-districts.geojson"
                ),

                loadJSON(
                    "uzbekistan-regions.geojson"
                ),

                loadJSON(
                    "uzbekistan-cities.geojson"
                )

            ]);


            districtsData =
                districts;

            regionsData =
                regions;

            citiesData =
                cities;


            console.log(
                "Районы:",
                districts.features.length
            );


            console.log(
                "Области:",
                regions.features.length
            );


            console.log(
                "Города:",
                cities.features.length
            );


            /* =========================================
               НАШИ ОБЛАСТИ
            ========================================= */

            map.addSource(

                "uzmap-regions",

                {

                    type: "geojson",

                    data: regions

                }

            );


            /* =========================================
               ГРАНИЦЫ ОБЛАСТЕЙ
            ========================================= */

            map.addLayer({

                id:
                    "uzmap-region-borders",

                type:
                    "line",

                source:
                    "uzmap-regions",

                paint: {

                    "line-color":
                        "#555555",

                    "line-width": [

                        "interpolate",

                        ["linear"],

                        ["zoom"],

                        4,
                        1,

                        7,
                        1.3,

                        12,
                        2

                    ],

                    "line-opacity":
                        0.75

                }

            });


            /* =========================================
               НАШИ РАЙОНЫ
            ========================================= */

            map.addSource(

                "uzmap-districts",

                {

                    type:
                        "geojson",

                    data:
                        districts,

                    promoteId:
                        "id"

                }

            );


            /* =========================================
               ГРАНИЦЫ РАЙОНОВ
            ========================================= */

            map.addLayer({

                id:
                    "uzmap-district-borders",

                type:
                    "line",

                source:
                    "uzmap-districts",

                minzoom:
                    6,

                paint: {

                    "line-color":
                        "#666666",

                    "line-width": [

                        "interpolate",

                        ["linear"],

                        ["zoom"],

                        6,
                        0.7,

                        9,
                        1.2,

                        13,
                        2

                    ],

                    "line-opacity":
                        0.8

                }

            });


            /* =========================================
               ЗЕЛЁНЫЙ ВЫБРАННЫЙ РАЙОН
               
               Изначально НЕ ВИДЕН.
            ========================================= */

            map.addLayer({

                id:
                    "uzmap-district-selected",

                type:
                    "fill",

                source:
                    "uzmap-districts",

                minzoom:
                    6,

                paint: {

                    "fill-color":
                        "#18a84a",

                    "fill-opacity":
                        0.45

                },

                filter: [

                    "==",

                    ["id"],

                    ""

                ]

            });


            /* =========================================
               ГОРОДА
            ========================================= */

            map.addSource(

                "uzmap-cities",

                {

                    type:
                        "geojson",

                    data:
                        cities

                }

            );


            map.addLayer({

                id:
                    "uzmap-city-points",

                type:
                    "circle",

                source:
                    "uzmap-cities",

                minzoom:
                    6,

                paint: {

                    "circle-radius": [

                        "interpolate",

                        ["linear"],

                        ["zoom"],

                        6,
                        3,

                        10,
                        6,

                        15,
                        9

                    ],

                    "circle-color":
                        "#ffffff",

                    "circle-stroke-color":
                        "#333333",

                    "circle-stroke-width":
                        1.5

                }

            });


            /* =========================================
               КЛИК ПО РАЙОНУ
            ========================================= */

            map.on(

                "click",

                "uzmap-district-borders",

                function(event) {

                    if (
                        !event.features ||
                        !event.features.length
                    ) {

                        return;

                    }


                    const feature =
                        event.features[0];


                    selectDistrict(
                        feature,
                        event.lngLat
                    );

                }

            );


            /* =========================================
               CURSOR РАЙОНОВ
            ========================================= */

            map.on(

                "mouseenter",

                "uzmap-district-borders",

                function() {

                    map.getCanvas()
                        .style
                        .cursor =
                        "pointer";

                }

            );


            map.on(

                "mouseleave",

                "uzmap-district-borders",

                function() {

                    map.getCanvas()
                        .style
                        .cursor =
                        "";

                }

            );


            /* =========================================
               ГОРОД
            ========================================= */

            map.on(

                "click",

                "uzmap-city-points",

                function(event) {

                    if (
                        !event.features ||
                        !event.features.length
                    ) {

                        return;

                    }


                    const feature =
                        event.features[0];


                    const properties =
                        feature.properties || {};


                    const name =

                        properties.name ||

                        properties.NAME ||

                        properties.Name ||

                        "Город";


                    showInfo(

                        "🏙️ " +
                        name,

                        "Город Узбекистана"

                    );

                }

            );


            /* =========================================
               НАСТРОЙКА КЛИКОВ ПО УЛИЦАМ
            ========================================= */

            setupStreetInteraction();


            /* =========================================
               НАСТРОЙКА КЛИКОВ ПО ЗДАНИЯМ
            ========================================= */

            setupBuildingInteraction();


            document
                .getElementById("loading")
                .style.display =
                "none";


            console.log(
                "🇺🇿 UZMAP готов!"
            );

        }

        catch(error) {

            console.error(
                error
            );


            document
                .getElementById("loading")
                .textContent =
                "Ошибка загрузки карты";

        }

    }

);


/* =====================================================
   ВЫБОР РАЙОНА
===================================================== */

function selectDistrict(
    feature,
    lngLat
) {

    selectedDistrict =
        feature;


    /*
     * Берём ID.
     */

    const id =
        feature.id;


    if (
        id === undefined ||
        id === null
    ) {

        console.warn(
            "У района нет ID"
        );

        return;

    }


    /*
     * Подсвечиваем
     * ТОЛЬКО этот район.
     */

    map.setFilter(

        "uzmap-district-selected",

        [

            "==",

            ["id"],

            id

        ]

    );


    const districtName =
        getDistrictName(
            feature.properties
        );


    const regionName =
        getRegionName(
            feature.properties
        );


    showInfo(

        "📍 " +
        districtName,

        "Область: " +
        regionName

    );


    map.flyTo({

        center: [

            lngLat.lng,
            lngLat.lat

        ],

        zoom:

            Math.max(
                map.getZoom(),
                8.5
            ),

        speed:
            0.8

    });

}


/* =====================================================
   ИНФО ПАНЕЛЬ
===================================================== */

function showInfo(
    title,
    body
) {

    document
        .getElementById(
            "infoTitle"
        )
        .textContent =
        title;


    document
        .getElementById(
            "infoBody"
        )
        .textContent =
        body;


    document
        .getElementById(
            "infoPanel"
        )
        .style.display =
        "block";

}


/* =====================================================
   ЗАКРЫТЬ ИНФО
===================================================== */

function closeInfo() {

    document
        .getElementById(
            "infoPanel"
        )
        .style.display =
        "none";

}


/* =====================================================
   ПОЛУЧИТЬ СЛОИ УЛИЦ
===================================================== */

function getStreetLayerIds() {

    const layers =
        map.getStyle().layers || [];


    return layers

        .filter(layer =>

            layer.source ===
                "openmaptiles"

            &&

            (

                layer["source-layer"] ===
                    "transportation"

                ||

                layer["source-layer"] ===
                    "transportation_name"

            )

        )

        .map(
            layer =>
                layer.id
        );

}


/* =====================================================
   НАСТРОЙКА УЛИЦ
===================================================== */

function setupStreetInteraction() {

    const layers =
        getStreetLayerIds();


    console.log(
        "Слои улиц:",
        layers
    );


    if (!layers.length) {

        console.warn(
            "Слои улиц не найдены."
        );

        return;

    }


    /*
     * Наведение.
     */

    layers.forEach(

        layerId => {


            map.on(

                "mouseenter",

                layerId,

                function() {

                    map.getCanvas()
                        .style
                        .cursor =
                        "pointer";

                }

            );


            map.on(

                "mouseleave",

                layerId,

                function() {

                    map.getCanvas()
                        .style
                        .cursor =
                        "";

                }

            );


            /*
             * Клик.
             */

            map.on(

                "click",

                layerId,

                function(event) {

                    if (
                        !event.features ||
                        !event.features.length
                    ) {

                        return;

                    }


                    const feature =
                        event.features[0];


                    showStreetInfo(
                        feature,
                        event.lngLat
                    );

                }

            );

        }

    );

}


/* =====================================================
   ИНФОРМАЦИЯ ОБ УЛИЦЕ
===================================================== */

function showStreetInfo(
    feature,
    lngLat
) {

    const properties =
        feature.properties || {};


    const name =

        properties.name ||

        properties["name:ru"] ||

        properties["name:latin"] ||

        properties.name_en ||

        properties.ref ||

        "Улица без названия";


    let type =

        properties.class ||

        properties.subclass ||

        "улица";


    const typeNames = {

        motorway:
            "Автомагистраль",

        trunk:
            "Главная дорога",

        primary:
            "Главная улица",

        secondary:
            "Улица",

        tertiary:
            "Улица",

        residential:
            "Жилая улица",

        service:
            "Проезд",

        pedestrian:
            "Пешеходная улица",

        track:
            "Дорога",

        path:
            "Тропа"

    };


    if (
        typeNames[type]
    ) {

        type =
            typeNames[type];

    }


    showInfo(

        "🛣️ " +
        name,

        "Тип: " +
        type

    );


    console.log(
        "Улица:",
        properties
    );

}


/* =====================================================
   ПОЛУЧИТЬ СЛОИ ЗДАНИЙ
===================================================== */

function getBuildingLayerIds() {

    const layers =
        map.getStyle().layers || [];


    return layers

        .filter(layer =>

            layer.source ===
                "openmaptiles"

            &&

            layer["source-layer"] ===
                "building"

        )

        .map(
            layer =>
                layer.id
        );

}


/* =====================================================
   ЗДАНИЯ
===================================================== */

function setupBuildingInteraction() {

    const layers =
        getBuildingLayerIds();


    console.log(
        "Слои зданий:",
        layers
    );


    if (!layers.length) {

        console.warn(
            "Слои зданий не найдены."
        );

        return;

    }


    layers.forEach(

        layerId => {


            map.on(

                "click",

                layerId,

                function(event) {

                    if (
                        !event.features ||
                        !event.features.length
                    ) {

                        return;

                    }


                    const feature =
                        event.features[0];


                    showBuildingInfo(
                        feature
                    );

                }

            );


            map.on(

                "mouseenter",

                layerId,

                function() {

                    map.getCanvas()
                        .style
                        .cursor =
                        "pointer";

                }

            );


            map.on(

                "mouseleave",

                layerId,

                function() {

                    map.getCanvas()
                        .style
                        .cursor =
                        "";

                }

            );

        }

    );

}


/* =====================================================
   ИНФОРМАЦИЯ О ЗДАНИИ
===================================================== */

function showBuildingInfo(
    feature
) {

    const properties =
        feature.properties || {};


    const address =

        properties["addr:street"] ||

        properties.street ||

        properties["name:ru"] ||

        properties.name ||

        properties.address ||

        null;


    const houseNumber =

        properties["addr:housenumber"] ||

        properties.housenumber ||

        properties.house_number ||

        null;


    let html = "";


    if (address) {

        html +=
            "Улица: " +
            escapeHTML(address);

    }


    if (houseNumber) {

        if (html) {
            html += "<br>";
        }

        html +=
            "Дом: " +
            escapeHTML(houseNumber);

    }


    if (!html) {

        html =
            "Информация об адресе пока отсутствует.";

    }


    document
        .getElementById(
            "infoTitle"
        )
        .textContent =
        "🏠 Здание";


    document
        .getElementById(
            "infoBody"
        )
        .innerHTML =
        html;


    document
        .getElementById(
            "infoPanel"
        )
        .style.display =
        "block";


    console.log(
        "Здание:",
        properties
    );

}


/* =====================================================
   ПОИСК УЛИЦ
===================================================== */

const searchInput =
    document.getElementById(
        "searchInput"
    );


const searchButton =
    document.getElementById(
        "searchButton"
    );


const searchResults =
    document.getElementById(
        "searchResults"
    );


searchInput.addEventListener(

    "input",

    function() {

        showSearchResults(
            searchInput.value
        );

    }

);


searchInput.addEventListener(

    "keydown",

    function(event) {

        if (
            event.key ===
            "Enter"
        ) {

            searchLocation();

        }

    }

);


searchButton.addEventListener(

    "click",

    searchLocation

);


/* =====================================================
   ПОИСК ПО GEOJSON + NOMINATIM
===================================================== */

async function searchLocation() {

    const query =
        searchInput.value.trim();


    if (!query) {
        return;
    }


    /*
     * Сначала ищем среди
     * наших районов.
     */

    if (
        districtsData &&
        districtsData.features
    ) {

        const district =
            districtsData.features.find(

                feature => {

                    const name =
                        getDistrictName(
                            feature.properties
                        )
                        .toLowerCase();


                    return (
                        name ===
                        query.toLowerCase()
                    );

                }

            );


        if (district) {

            const center =
                getFeatureCenter(
                    district
                );


            if (center) {

                map.flyTo({

                    center:
                        center,

                    zoom:
                        9,

                    speed:
                        0.8

                });

            }

            return;

        }

    }


    /*
     * Затем ищем улицу
     * через Nominatim.
     */

    try {

        const url =

            "https://nominatim.openstreetmap.org/search"

            +

            "?format=jsonv2"

            +

            "&limit=5"

            +

            "&countrycodes=uz"

            +

            "&accept-language=ru"

            +

            "&q=" +

            encodeURIComponent(
                query
            );


        const response =
            await fetch(url);


        const results =
            await response.json();


        if (!results.length) {

            showInfo(

                "🔎 Ничего не найдено",

                "Попробуйте изменить запрос."

            );

            return;

        }


        const result =
            results[0];


        const lat =
            Number(result.lat);


        const lon =
            Number(result.lon);


        map.flyTo({

            center: [

                lon,
                lat

            ],

            zoom:
                16,

            speed:
                1

        });


        setTimeout(

            function() {

                showInfo(

                    "📍 " +
                    (
                        result.name ||
                        query
                    ),

                    result.display_name ||
                    "Адрес найден"

                );

            },

            1000

        );

    }

    catch(error) {

        console.error(
            error
        );

        showInfo(

            "Ошибка поиска",

            "Не удалось выполнить поиск."

        );

    }

}


/* =====================================================
   ЦЕНТР GEOJSON
===================================================== */

function getFeatureCenter(
    feature
) {

    if (
        !feature ||
        !feature.geometry
    ) {

        return null;

    }


    const coordinates =
        [];


    function collect(
        value
    ) {

        if (
            typeof value[0] ===
                "number"
        ) {

            coordinates.push(
                value
            );

            return;

        }


        value.forEach(
            collect
        );

    }


    collect(
        feature.geometry.coordinates
    );


    if (!coordinates.length) {

        return null;

    }


    let lng = 0;

    let lat = 0;


    coordinates.forEach(
        point => {

            lng +=
                point[0];

            lat +=
                point[1];

        }
    );


    return [

        lng /
            coordinates.length,

        lat /
            coordinates.length

    ];

}


/* =====================================================
   ПОИСКОВЫЕ ПОДСКАЗКИ
===================================================== */

function showSearchResults(
    text
) {

    searchResults.innerHTML = "";


    if (
        !text.trim()
    ) {

        searchResults.style.display =
            "none";

        return;

    }


    if (
        !districtsData ||
        !districtsData.features
    ) {

        return;

    }


    const query =
        text.toLowerCase();


    const results =

        districtsData.features

            .filter(

                feature => {

                    const name =
                        getDistrictName(
                            feature.properties
                        );


                    return name
                        .toLowerCase()
                        .includes(query);

                }

            )

            .slice(0, 8);


    if (!results.length) {

        searchResults.style.display =
            "none";

        return;

    }


    results.forEach(

        feature => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "search-result";


            item.textContent =
                "📍 " +
                getDistrictName(
                    feature.properties
                );


            item.addEventListener(

                "click",

                function() {

                    searchInput.value =
                        item.textContent
                            .replace(
                                "📍 ",
                                ""
                            );


                    searchResults.style.display =
                        "none";


                    const center =
                        getFeatureCenter(
                            feature
                        );


                    if (center) {

                        map.flyTo({

                            center:
                                center,

                            zoom:
                                9,

                            speed:
                                0.8

                        });

                    }

                }

            );


            searchResults.appendChild(
                item
            );

        }

    );


    searchResults.style.display =
        "block";

}


/* =====================================================
   ЗАКРЫТИЕ ПОИСКА
===================================================== */

document.addEventListener(

    "click",

    function(event) {

        if (
            !event.target.closest(
                ".search-box"
            )
        ) {

            searchResults.style.display =
                "none";

        }

    }

);


</script>
