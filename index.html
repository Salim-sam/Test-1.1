<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>UZMAP</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

<script src="./district-names-ru.js"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

#map {

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;
}


/* =====================================================
   LOGO
===================================================== */

.logo {

    position: absolute;

    z-index: 100;

    top: 18px;
    left: 18px;

    background: rgba(255,255,255,.97);

    padding: 14px 20px;

    border-radius: 16px;

    font-size: 23px;

    font-weight: 700;

    box-shadow:
        0 3px 18px rgba(0,0,0,.18);

    user-select: none;
}


/* =====================================================
   ПОИСК
===================================================== */

.search-box {

    position: absolute;

    z-index: 100;

    top: 76px;

    left: 18px;
    right: 18px;

    max-width: 680px;

    margin: 0 auto;

    display: flex;

    align-items: center;

    background: white;

    border-radius: 16px;

    box-shadow:
        0 3px 18px rgba(0,0,0,.18);

}

.search-icon {

    padding-left: 16px;

    font-size: 22px;
}

#searchInput {

    flex: 1;

    width: 100%;

    border: none;

    outline: none;

    background: transparent;

    font-size: 17px;

    padding: 16px 9px;
}

#searchButton {

    border: none;

    background: transparent;

    font-size: 22px;

    padding: 13px 16px;

    cursor: pointer;
}


/* =====================================================
   РЕЗУЛЬТАТЫ ПОИСКА
===================================================== */

#searchResults {

    position: absolute;

    z-index: 300;

    top: calc(100% + 7px);

    left: 0;
    right: 0;

    background: white;

    border-radius: 14px;

    overflow: hidden;

    box-shadow:
        0 5px 22px rgba(0,0,0,.2);

    display: none;

    max-height: 320px;

    overflow-y: auto;
}

.search-result {

    padding: 14px 16px;

    border-bottom:
        1px solid #eeeeee;

    cursor: pointer;

    font-size: 16px;
}

.search-result:last-child {

    border-bottom: none;
}

.search-result:active {

    background: #eeeeee;
}


/* =====================================================
   ИНФОРМАЦИОННАЯ КАРТОЧКА
===================================================== */

#infoPanel {

    position: absolute;

    z-index: 200;

    left: 15px;
    right: 15px;

    bottom: 18px;

    max-width: 440px;

    margin: auto;

    background: rgba(255,255,255,.98);

    border-radius: 18px;

    box-shadow:
        0 5px 28px rgba(0,0,0,.25);

    padding: 20px;

    display: none;
}

.info-close {

    position: absolute;

    right: 10px;
    top: 7px;

    width: 35px;
    height: 35px;

    border: none;

    background: transparent;

    color: #1677ff;

    font-size: 27px;

    cursor: pointer;
}

.info-title {

    padding-right: 30px;

    font-size: 21px;

    font-weight: 700;

    line-height: 1.3;

    margin-bottom: 12px;
}

.info-body {

    font-size: 16px;

    line-height: 1.5;
}


/* =====================================================
   ЗАГРУЗКА
===================================================== */

#loading {

    position: absolute;

    z-index: 500;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    background: white;

    padding: 15px 20px;

    border-radius: 14px;

    box-shadow:
        0 4px 20px rgba(0,0,0,.2);

    font-size: 16px;
}


/* =====================================================
   МОБИЛЬНЫЙ
===================================================== */

@media (max-width: 600px) {

    .logo {

        top: 12px;
        left: 12px;

        padding: 12px 16px;

        font-size: 21px;

        border-radius: 15px;
    }

    .search-box {

        top: 66px;

        left: 12px;
        right: 12px;
    }

    #searchInput {

        font-size: 17px;
    }

}

</style>

</head>


<body>


<div id="map"></div>


<div class="logo">

    🇺🇿 UZMAP

</div>


<div class="search-box">

    <div class="search-icon">
        🔎
    </div>

    <input
        id="searchInput"
        type="text"
        placeholder="Найти улицу, район..."
        autocomplete="off"
    >

    <button
        id="searchButton"
        type="button"
    >
        🔍
    </button>

    <div id="searchResults"></div>

</div>


<div id="loading">
    Загрузка карты...
</div>


<div id="infoPanel">

    <button
        class="info-close"
        onclick="closeInfo()"
    >
        ×
    </button>

    <div
        id="infoTitle"
        class="info-title"
    ></div>

    <div
        id="infoBody"
        class="info-body"
    ></div>

</div>


<script>

/* =====================================================
   НАСТРОЙКИ
===================================================== */

const MAP_CENTER = [
    64.5853,
    41.3775
];

const START_ZOOM = 5;


/* =====================================================
   MAPLIBRE
===================================================== */

const map = new maplibregl.Map({

    container: "map",

    style:
        "https://tiles.openfreemap.org/styles/liberty",

    center:
        MAP_CENTER,

    zoom:
        START_ZOOM,

    minZoom:
        4,

    maxZoom:
        19,

    attributionControl:
        true

});


/* =====================================================
   НАВИГАЦИЯ
===================================================== */

map.addControl(

    new maplibregl.NavigationControl(),

    "top-right"

);


/* =====================================================
   ДАННЫЕ
===================================================== */

let districtsData = null;

let regionsData = null;

let citiesData = null;

let selectedDistrict = null;


/* =====================================================
   ЗАГРУЗКА JSON
===================================================== */

async function loadJSON(file) {

    const response =
        await fetch("./" + file);

    if (!response.ok) {

        throw new Error(
            "Не удалось загрузить: " +
            file
        );

    }

    return await response.json();

}


/* =====================================================
   НАЗВАНИЕ РАЙОНА
===================================================== */

function getDistrictName(properties) {

    if (!properties) {

        return "Район";

    }


    const original = String(

        properties.shapeName ||

        properties.NAME_2 ||

        properties.name ||

        properties.NAME ||

        properties.Name ||

        ""

    ).trim();


    if (!original) {

        return "Район";

    }


    const clean =
        original
            .replace(
                /\s+District$/i,
                ""
            )
            .trim();


    if (
        typeof DISTRICT_NAMES_RU !==
        "undefined"
    ) {

        if (
            DISTRICT_NAMES_RU[original]
        ) {

            return DISTRICT_NAMES_RU[
                original
            ];

        }


        if (
            DISTRICT_NAMES_RU[clean]
        ) {

            return DISTRICT_NAMES_RU[
                clean
            ];

        }


        const key =

            Object.keys(
                DISTRICT_NAMES_RU
            ).find(

                item =>

                    item.toLowerCase() ===
                    clean.toLowerCase()

            );


        if (key) {

            return DISTRICT_NAMES_RU[
                key
            ];

        }

    }


    return original;

}


/* =====================================================
   НАЗВАНИЕ ОБЛАСТИ
===================================================== */

function getRegionName(properties) {

    if (!properties) {

        return "Узбекистан";

    }


    return (

        properties.region ||

        properties.REGION ||

        properties.NAME_1 ||

        properties.name_1 ||

        properties.parent ||

        "Узбекистан"

    );

}


/* =====================================================
   БЕЗОПАСНЫЙ HTML
===================================================== */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   MAP LOAD
===================================================== */

map.on(
    "load",
    async function() {

        try {

            console.log(
                "🇺🇿 UZMAP: загрузка данных..."
            );


            const [

                districts,

                regions,

                cities

            ] = await Promise.all([

                loadJSON(
                    "uzbekistan-districts.geojson"
                ),

                loadJSON(
                    "uzbekistan-regions.geojson"
                ),

                loadJSON(
                    "uzbekistan-cities.geojson"
                )

            ]);


            districtsData =
                districts;

            regionsData =
                regions;

            citiesData =
                cities;


            console.log(
                "Районы:",
                districts.features.length
            );

            console.log(
                "Области:",
                regions.features.length
            );

            console.log(
                "Города:",
                cities.features.length
            );


            /* =================================================
               СОЗДАЁМ СТАБИЛЬНЫЙ ID ДЛЯ КАЖДОГО РАЙОНА
            ================================================= */

            districts.features.forEach(

                function(feature, index) {

                    if (
                        !feature.properties
                    ) {

                        feature.properties = {};

                    }


                    feature.properties._uzmap_id =
                        index;

                }

            );


            /* =================================================
               ОБЛАСТИ
            ================================================= */

            map.addSource(

                "uzmap-regions",

                {

                    type:
                        "geojson",

                    data:
                        regions

                }

            );


            map.addLayer({

                id:
                    "uzmap-region-borders",

                type:
                    "line",

                source:
                    "uzmap-regions",

                paint: {

                    "line-color":
                        "#555555",

                    "line-width": [

                        "interpolate",

                        ["linear"],

                        ["zoom"],

                        4,
                        1,

                        7,
                        1.3,

                        12,
                        2

                    ],

                    "line-opacity":
                        0.75

                }

            });


            /* =================================================
               РАЙОНЫ
            ================================================= */

            map.addSource(

                "uzmap-districts",

                {

                    type:
                        "geojson",

                    data:
                        districts

                }

            );


            /* =================================================
               ЗЕЛЁНЫЙ ВЫБРАННЫЙ РАЙОН
               
               ДОБАВЛЯЕМ ДО КЛИКАБЕЛЬНОГО СЛОЯ.
               
               Поэтому прозрачный слой сверху будет
               принимать события.
            ================================================= */

            map.addLayer({

                id:
                    "uzmap-district-selected",

                type:
                    "fill",

                source:
                    "uzmap-districts",

                minzoom:
                    6,

                maxzoom:
                    10,

                paint: {

                    "fill-color":
                        "#18a84a",

                    "fill-opacity":
                        0.45

                },

                filter: [

                    "==",

                    [
                        "get",
                        "_uzmap_id"
                    ],

                    -1

                ]

            });


            /* =================================================
               КЛИКАБЕЛЬНАЯ ОБЛАСТЬ РАЙОНА
               
               ВАЖНО:
               fill-opacity 0.001 означает практически
               невидимый слой, который всё равно принимает
               pointer/click.
            ================================================= */

            map.addLayer({

                id:
                    "uzmap-district-click",

                type:
                    "fill",

                source:
                    "uzmap-districts",

                minzoom:
                    6,

                maxzoom:
                    10,

                paint: {

                    "fill-color":
                        "#ffffff",

                    "fill-opacity":
                        0.001

                }

            });


            /* =================================================
               ГРАНИЦЫ РАЙОНОВ
            ================================================= */

            map.addLayer({

                id:
                    "uzmap-district-borders",

                type:
                    "line",

                source:
                    "uzmap-districts",

                minzoom:
                    6,

                paint: {

                    "line-color":
                        "#555555",

                    "line-width": [

                        "interpolate",

                        ["linear"],

                        ["zoom"],

                        6,
                        0.7,

                        9,
                        1.2,

                        13,
                        2

                    ],

                    "line-opacity":
                        0.8

                }

            });


            /* =================================================
               КЛИК ПО РАЙОНУ
            ================================================= */

            map.on(

                "click",

                "uzmap-district-click",

                function(event) {

                    if (
                        !event.features ||
                        !event.features.length
                    ) {

                        return;

                    }


                    const feature =
                        event.features[0];


                    selectDistrict(

                        feature,

                        event.lngLat

                    );

                }

            );


            /* =================================================
               CURSOR РАЙОНА
            ================================================= */

            map.on(

                "mouseenter",

                "uzmap-district-click",

                function() {

                    map.getCanvas()
                        .style
                        .cursor =
                        "pointer";

                }

            );


            map.on(

                "mouseleave",

                "uzmap-district-click",

                function() {

                    map.getCanvas()
                        .style
                        .cursor =
                        "";

                }

            );


            /* =================================================
               ГОРОДА
            ================================================= */

            map.addSource(

                "uzmap-cities",

                {

                    type:
                        "geojson",

                    data:
                        cities

                }

            );


            map.addLayer({

                id:
                    "uzmap-city-points",

                type:
                    "circle",

                source:
                    "uzmap-cities",

                minzoom:
                    6,

                paint: {

                    "circle-radius": [

                        "interpolate",

                        ["linear"],

                        ["zoom"],

                        6,
                        3,

                        10,
                        6,

                        15,
                        9

                    ],

                    "circle-color":
                        "#ffffff",

                    "circle-stroke-color":
                        "#222222",

                    "circle-stroke-width":
                        1.5

                }

            });


            /* =================================================
               КЛИК ПО ГОРОДУ
            ================================================= */

            map.on(

                "click",

                "uzmap-city-points",

                function(event) {

                    if (
                        !event.features ||
                        !event.features.length
                    ) {

                        return;

                    }


                    const feature =
                        event.features[0];


                    const properties =
                        feature.properties || {};


                    const name =

                        properties.name ||

                        properties.NAME ||

                        properties.Name ||

                        properties.name_ru ||

                        "Город";


                    showInfo(

                        "🏙️ " +
                        name,

                        "Город Узбекистана"

                    );

                }

            );


            map.on(

                "mouseenter",

                "uzmap-city-points",

                function() {

                    map.getCanvas()
                        .style
                        .cursor =
                        "pointer";

                }

            );


            map.on(

                "mouseleave",

                "uzmap-city-points",

                function() {

                    map.getCanvas()
                        .style
                        .cursor =
                        "";

                }

            );


            /* =================================================
               УЛИЦЫ
            ================================================= */

            setupStreetInteraction();


            /* =================================================
               ЗДАНИЯ
            ================================================= */

            setupBuildingInteraction();


            /* =================================================
               ГОТОВО
            ================================================= */

            document
                .getElementById(
                    "loading"
                )
                .style.display =
                "none";


            console.log(
                "✅ UZMAP готов!"
            );

        }

        catch(error) {

            console.error(
                "UZMAP ERROR:",
                error
            );


            document
                .getElementById(
                    "loading"
                )
                .textContent =
                "Ошибка загрузки карты";

        }

    }
);


/* =====================================================
   ВЫБОР РАЙОНА
===================================================== */

function selectDistrict(
    feature,
    lngLat
) {

    selectedDistrict =
        feature;


    const districtId =
        feature.properties._uzmap_id;


    /* =================================================
       ТОЛЬКО ВЫБРАННЫЙ РАЙОН ЗЕЛЁНЫЙ
    ================================================= */

    map.setFilter(

        "uzmap-district-selected",

        [

            "==",

            [
                "get",
                "_uzmap_id"
            ],

            districtId

        ]

    );


    const districtName =
        getDistrictName(
            feature.properties
        );


    const regionName =
        getRegionName(
            feature.properties
        );


    showInfo(

        "📍 " +
        districtName,

        "Область: " +
        regionName

    );


    /*
     * Немного приближаем.
     */

    map.flyTo({

        center: [

            lngLat.lng,
            lngLat.lat

        ],

        zoom:

            Math.max(
                map.getZoom(),
                8
            ),

        speed:
            0.8

    });

}


/* =====================================================
   ИНФОРМАЦИОННАЯ КАРТОЧКА
===================================================== */

function showInfo(
    title,
    body
) {

    document
        .getElementById(
            "infoTitle"
        )
        .textContent =
        title;


    document
        .getElementById(
            "infoBody"
        )
        .innerHTML =
        escapeHTML(body);


    document
        .getElementById(
            "infoPanel"
        )
        .style.display =
        "block";

}


/* =====================================================
   ЗАКРЫТЬ КАРТОЧКУ
===================================================== */

function closeInfo() {

    document
        .getElementById(
            "infoPanel"
        )
        .style.display =
        "none";

}


/* =====================================================
   STREET LAYERS
===================================================== */

function getStreetLayerIds() {

    const layers =
        map.getStyle().layers || [];


    return layers

        .filter(

            function(layer) {

                return (

                    layer.source ===
                        "openmaptiles"

                    &&

                    (

                        layer[
                            "source-layer"
                        ] ===
                            "transportation"

                        ||

                        layer[
                            "source-layer"
                        ] ===
                            "transportation_name"

                    )

                );

            }

        )

        .map(

            function(layer) {

                return layer.id;

            }

        );

}


/* =====================================================
   STREET INTERACTION
===================================================== */

function setupStreetInteraction() {

    const layers =
        getStreetLayerIds();


    console.log(
        "🛣️ Слои улиц:",
        layers
    );


    if (!layers.length) {

        console.warn(
            "Слои улиц OpenFreeMap не найдены."
        );

        return;

    }


    layers.forEach(

        function(layerId) {

            map.on(

                "mouseenter",

                layerId,

                function() {

                    /*
                     * При большом приближении
                     * показываем pointer.
                     */

                    if (
                        map.getZoom() >=
                        10
                    ) {

                        map.getCanvas()
                            .style
                            .cursor =
                            "pointer";

                    }

                }

            );


            map.on(

                "mouseleave",

                layerId,

                function() {

                    map.getCanvas()
                        .style
                        .cursor =
                        "";

                }

            );


            map.on(

                "click",

                layerId,

                function(event) {

                    /*
                     * Районы здесь уже не должны
                     * блокировать улицу.
                     */

                    if (
                        map.getZoom() < 10
                    ) {

                        return;

                    }


                    if (
                        !event.features ||
                        !event.features.length
                    ) {

                        return;

                    }


                    const feature =
                        event.features[0];


                    showStreetInfo(
                        feature
                    );

                }

            );

        }

    );

}


/* =====================================================
   STREET INFO
===================================================== */

function showStreetInfo(
    feature
) {

    const properties =
        feature.properties || {};


    const name =

        properties.name ||

        properties["name:ru"] ||

        properties["name:latin"] ||

        properties.name_en ||

        properties.ref ||

        "Улица без названия";


    let type =

        properties.class ||

        properties.subclass ||

        "улица";


    const typeNames = {

        motorway:
            "Автомагистраль",

        trunk:
            "Главная дорога",

        primary:
            "Главная улица",

        secondary:
            "Улица",

        tertiary:
            "Улица",

        residential:
            "Жилая улица",

        service:
            "Проезд",

        pedestrian:
            "Пешеходная улица",

        track:
            "Дорога",

        path:
            "Тропа"

    };


    if (
        typeNames[type]
    ) {

        type =
            typeNames[type];

    }


    showInfo(

        "🛣️ " +
        name,

        "Тип: " +
        type

    );


    console.log(
        "Улица:",
        properties
    );

}


/* =====================================================
   BUILDING LAYERS
===================================================== */

function getBuildingLayerIds() {

    const layers =
        map.getStyle().layers || [];


    return layers

        .filter(

            function(layer) {

                return (

                    layer.source ===
                        "openmaptiles"

                    &&

                    layer[
                        "source-layer"
                    ] ===
                        "building"

                );

            }

        )

        .map(

            function(layer) {

                return layer.id;

            }

        );

}


/* =====================================================
   BUILDING INTERACTION
===================================================== */

function setupBuildingInteraction() {

    const layers =
        getBuildingLayerIds();


    console.log(
        "🏠 Слои зданий:",
        layers
    );


    if (!layers.length) {

        console.warn(
            "Слои зданий OpenFreeMap не найдены."
        );

        return;

    }


    layers.forEach(

        function(layerId) {

            map.on(

                "mouseenter",

                layerId,

                function() {

                    if (
                        map.getZoom() >=
                        13
                    ) {

                        map.getCanvas()
                            .style
                            .cursor =
                            "pointer";

                    }

                }

            );


            map.on(

                "mouseleave",

                layerId,

                function() {

                    map.getCanvas()
                        .style
                        .cursor =
                        "";

                }

            );


            map.on(

                "click",

                layerId,

                function(event) {

                    if (
                        map.getZoom() < 13
                    ) {

                        return;

                    }


                    if (
                        !event.features ||
                        !event.features.length
                    ) {

                        return;

                    }


                    const feature =
                        event.features[0];


                    showBuildingInfo(
                        feature
                    );

                }

            );

        }

    );

}


/* =====================================================
   BUILDING INFO
===================================================== */

function showBuildingInfo(
    feature
) {

    const properties =
        feature.properties || {};


    const street =

        properties["addr:street"] ||

        properties.street ||

        properties["name:ru"] ||

        properties.name ||

        null;


    const houseNumber =

        properties["addr:housenumber"] ||

        properties.housenumber ||

        properties.house_number ||

        null;


    let html = "";


    if (street) {

        html +=
            "Улица: " +
            escapeHTML(street);

    }


    if (houseNumber) {

        if (html) {

            html += "<br>";

        }


        html +=
            "Дом: " +
            escapeHTML(
                houseNumber
            );

    }


    if (!html) {

        html =
            "Информация об адресе пока отсутствует.";

    }


    document
        .getElementById(
            "infoTitle"
        )
        .textContent =
        "🏠 Здание";


    document
        .getElementById(
            "infoBody"
        )
        .innerHTML =
        html;


    document
        .getElementById(
            "infoPanel"
        )
        .style.display =
        "block";


    console.log(
        "🏠 Здание:",
        properties
    );

}


/* =====================================================
   ПОИСК
===================================================== */

const searchInput =
    document.getElementById(
        "searchInput"
    );


const searchButton =
    document.getElementById(
        "searchButton"
    );


const searchResults =
    document.getElementById(
        "searchResults"
    );


searchInput.addEventListener(

    "input",

    function() {

        showSearchResults(
            searchInput.value
        );

    }

);


searchInput.addEventListener(

    "keydown",

    function(event) {

        if (
            event.key ===
            "Enter"
        ) {

            searchLocation();

        }

    }

);


searchButton.addEventListener(

    "click",

    searchLocation

);


/* =====================================================
   ПОИСК
===================================================== */

async function searchLocation() {

    const query =
        searchInput.value.trim();


    if (!query) {

        return;

    }


    /* =================================================
       СНАЧАЛА РАЙОНЫ
    ================================================= */

    if (
        districtsData &&
        districtsData.features
    ) {

        const district =

            districtsData.features.find(

                function(feature) {

                    const name =
                        getDistrictName(
                            feature.properties
                        );


                    return (

                        name.toLowerCase() ===
                        query.toLowerCase()

                    );

                }

            );


        if (district) {

            const center =
                getFeatureCenter(
                    district
                );


            if (center) {

                map.flyTo({

                    center:
                        center,

                    zoom:
                        9,

                    speed:
                        0.8

                });

            }


            return;

        }

    }


    /* =================================================
       NOMINATIM
    ================================================= */

    try {

        const url =

            "https://nominatim.openstreetmap.org/search"

            +

            "?format=jsonv2"

            +

            "&limit=5"

            +

            "&countrycodes=uz"

            +

            "&accept-language=ru"

            +

            "&q=" +

            encodeURIComponent(
                query
            );


        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                "Ошибка Nominatim"
            );

        }


        const results =
            await response.json();


        if (!results.length) {

            showInfo(

                "🔎 Ничего не найдено",

                "Попробуйте изменить запрос."

            );

            return;

        }


        const result =
            results[0];


        const lat =
            Number(result.lat);


        const lon =
            Number(result.lon);


        map.flyTo({

            center: [

                lon,
                lat

            ],

            zoom:
                16,

            speed:
                1

        });


        setTimeout(

            function() {

                showInfo(

                    "📍 " +
                    (
                        result.name ||
                        query
                    ),

                    result.display_name ||
                    "Адрес найден"

                );

            },

            700

        );

    }

    catch(error) {

        console.error(
            "SEARCH ERROR:",
            error
        );


        showInfo(

            "Ошибка поиска",

            "Не удалось выполнить поиск."

        );

    }

}


/* =====================================================
   ЦЕНТР GEOJSON
===================================================== */

function getFeatureCenter(
    feature
) {

    if (
        !feature ||
        !feature.geometry
    ) {

        return null;

    }


    const coordinates = [];


    function collect(value) {

        if (
            !Array.isArray(value)
        ) {

            return;

        }


        if (
            typeof value[0] ===
            "number"
        ) {

            coordinates.push(
                value
            );

            return;

        }


        value.forEach(
            collect
        );

    }


    collect(
        feature.geometry.coordinates
    );


    if (!coordinates.length) {

        return null;

    }


    let lng = 0;

    let lat = 0;


    coordinates.forEach(

        function(point) {

            lng +=
                Number(point[0]);

            lat +=
                Number(point[1]);

        }

    );


    return [

        lng /
            coordinates.length,

        lat /
            coordinates.length

    ];

}


/* =====================================================
   ПОДСКАЗКИ ПО РАЙОНАМ
===================================================== */

function showSearchResults(
    text
) {

    searchResults.innerHTML = "";


    if (
        !text.trim()
    ) {

        searchResults.style.display =
            "none";

        return;

    }


    if (
        !districtsData ||
        !districtsData.features
    ) {

        return;

    }


    const query =
        text.toLowerCase();


    const results =

        districtsData.features

            .filter(

                function(feature) {

                    const name =
                        getDistrictName(
                            feature.properties
                        );


                    return name
                        .toLowerCase()
                        .includes(query);

                }

            )

            .slice(
                0,
                8
            );


    if (!results.length) {

        searchResults.style.display =
            "none";

        return;

    }


    results.forEach(

        function(feature) {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "search-result";


            item.textContent =
                "📍 " +
                getDistrictName(
                    feature.properties
                );


            item.addEventListener(

                "click",

                function() {

                    searchInput.value =
                        getDistrictName(
                            feature.properties
                        );


                    searchResults.style.display =
                        "none";


                    const center =
                        getFeatureCenter(
                            feature
                        );


                    if (center) {

                        map.flyTo({

                            center:
                                center,

                            zoom:
                                9,

                            speed:
                                0.8

                        });

                    }

                }

            );


            searchResults.appendChild(
                item
            );

        }

    );


    searchResults.style.display =
        "block";

}

   ЗАКРЫТИЕ ПОИСКА
===================================================== */

        if (
            !event.target.closest(

            )
        ) {

            searchResults.style.display =

);
