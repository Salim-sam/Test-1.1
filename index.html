/* =====================================================
   SUPABASE RPC
===================================================== */

async function supabaseRPC(
    functionName
) {

    console.log(
        "Supabase RPC:",
        functionName
    );


    const response = await fetch(

        SUPABASE_URL +
        "/rest/v1/rpc/" +
        functionName,

        {

            method: "POST",

            headers: {

                "apikey":
                    SUPABASE_KEY,

                "Authorization":
                    "Bearer " +
                    SUPABASE_KEY,

                "Content-Type":
                    "application/json",

                "Accept":
                    "application/json"

            },

            body: "{}"

        }

    );


    if (!response.ok) {

        const errorText =
            await response.text();

        console.error(
            "Supabase RPC error:",
            functionName,
            response.status,
            errorText
        );

        throw new Error(
            "Supabase RPC " +
            functionName +
            " → HTTP " +
            response.status
        );

    }


    return await response.json();

}

/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHTML(
    value
) {

    return String(value || "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   GEOJSON CENTER
===================================================== */

function getFeatureCenter(
    feature
) {

    if (
        !feature ||
        !feature.geometry ||
        !feature.geometry.coordinates
    ) {

        return null;

    }


    const coordinates = [];


    function collect(
        value
    ) {

        if (
            !Array.isArray(value)
        ) {

            return;

        }


        if (

            value.length >= 2 &&

            typeof value[0] ===
                "number" &&

            typeof value[1] ===
                "number"

        ) {

            coordinates.push(
                value
            );

            return;

        }


        value.forEach(
            collect
        );

    }


    collect(
        feature.geometry.coordinates
    );


    if (
        !coordinates.length
    ) {

        return null;

    }


    let lng = 0;

    let lat = 0;

    let count = 0;


    coordinates.forEach(

        function(point) {

            const pointLng =
                Number(
                    point[0]
                );

            const pointLat =
                Number(
                    point[1]
                );


            if (

                Number.isFinite(
                    pointLng
                )

                &&

                Number.isFinite(
                    pointLat
                )

            ) {

                lng +=
                    pointLng;

                lat +=
                    pointLat;

                count++;

            }

        }

    );


    if (
        count === 0
    ) {

        return null;

    }


    return [

        lng / count,

        lat / count

    ];

}


/* =====================================================
   LOAD ALL DATA
===================================================== */

async function loadNaqshaData() {

    console.log(
        "🇺🇿 Naqsha: подключение к Supabase..."
    );


    const [

        regions,

        districts,

        cities

    ] = await Promise.all([

            "get_regions_geojson"
        ),

        supabaseRPC(
            "get_districts_geojson"
        ),

        supabaseRPC(
            "get_cities_geojson"
        )

    ]);


    regionsData =
        regions;

    districtsData =
        districts;

    citiesData =
        cities;


    /* =================================================
       CHECK REGIONS
    ================================================= */

    if (

        !regionsData ||

        regionsData.type !==
            "FeatureCollection"

        throw new Error(
            "get_regions_geojson вернул неправильный формат."
        );

    }


    /* =================================================
       CHECK DISTRICTS
    ================================================= */

    if (

        !districtsData ||

        districtsData.type !==
            "FeatureCollection"

    ) {

        throw new Error(
            "get_districts_geojson вернул неправильный формат."
        );

    /* =================================================
       CHECK CITIES
    ================================================= */

    if (

        !citiesData ||

        citiesData.type !==
            "FeatureCollection"

    ) {

        throw new Error(
            "get_cities_geojson вернул неправильный формат."

       REMOVE BAD FEATURES

        districtsData.features.filter(

        citiesData.features.filter(

/* =====================================================
   ADMIN UPLOADED MAP LAYERS
===================================================== */

/*
   Все клики по административным GeoJSON проходят через
   единый обработчик. Это важно: верхний слой страны не
   должен блокировать области, районы и другие вложенные
   объекты.
*/
const adminInteractiveLayers = [];

function adminLayerPriority(layer) {
    const type = String(layer && (layer.layer_type || layer.type || "")).toLowerCase();

    if (type.includes("building") || type.includes("здан")) return 60;
    if (type.includes("street") || type.includes("улиц")) return 50;
    if (type.includes("city") || type.includes("город")) return 40;
    if (type.includes("district") || type.includes("район")) return 30;
    if (type.includes("region") || type.includes("област")) return 20;
    if (type.includes("country") || type.includes("стра")) return 10;

    return 5;
}

async function getPublicAdminLayers() {
    const rpcUrl = SUPABASE_URL + "/rest/v1/rpc/get_public_map_layers";
    const rpcResponse = await fetch(rpcUrl, {
        method: "POST",
        headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY,
            "Content-Type": "application/json",
            "Accept": "application/json"
        },
        body: "{}"
    });

    if (rpcResponse.ok) {
        const rows = await rpcResponse.json();
        return Array.isArray(rows) ? rows : [];
    }

    // Fallback для старой схемы, если RPC ещё не установлен.
    const restUrl = SUPABASE_URL +
        "/rest/v1/map_layers?select=*&is_active=eq.true&order=id.asc";

    const restResponse = await fetch(restUrl, {
        method: "GET",
        headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY,
            "Accept": "application/json"
        }
    });

    if (!restResponse.ok) {
        const text = await restResponse.text();
        throw new Error(
            "map_layers → HTTP " +
            restResponse.status + ": " + text
        );
    }

    const rows = await restResponse.json();
    return Array.isArray(rows) ? rows : [];
}

async function loadActiveAdminLayers() {
    const status = document.getElementById("layerStatus");
    if (status) {
        status.className = "layer-status";
        status.textContent = "Загрузка слоёв…";
    }

    try {
        const layers = await getPublicAdminLayers();
        let loadedCount = 0;
        const errors = [];

        const orderedLayers = [...layers].sort((a,b) => {
            return adminLayerPriority(a) - adminLayerPriority(b)
                || Number(a.id || 0) - Number(b.id || 0);
        });

        for (const layer of orderedLayers) {
            try {
                await addAdminLayerToMap(layer);
                loadedCount++;
            } catch (error) {
                console.warn("⚠️ Не удалось загрузить слой:", layer.name, error);
                errors.push(layer.name + ": " + error.message);
            }
        }

        console.log("🧩 Активных слоёв из админки:", layers.length);
        console.log("🗺️ Отрисовано слоёв:", loadedCount);

        if (status) {
            if (loadedCount) {
                status.className = "layer-status ok";
                status.textContent =
                    "🧩 Загружено слоёв: " + loadedCount;
            } else if (!layers.length) {
                status.className = "layer-status";
                status.textContent =
                    "Подключение работает, слоёв пока нет.";
            } else {
                status.className = "layer-status err";
                status.textContent =
                    "⚠️ Слои найдены, но GeoJSON не удалось загрузить.";
            }
        }

        if (errors.length) {
            console.warn("Ошибки слоёв:", errors);
        }
    } catch (error) {
        console.error("❌ Слои из админки не загружены:", error);
        if (status) {
            status.className = "layer-status err";
            status.textContent =
                "❌ Слои не загружены: " + error.message;
        }
    }
}

async function addAdminLayerToMap(layer) {
    const sourceId = "naqsha-admin-layer-source-" + layer.id;
    const prefix = "naqsha-admin-layer-" + layer.id;

    if (map.getSource(sourceId)) {
        return;
    }

    if (!layer.file_path) {
        throw new Error("у слоя отсутствует file_path");
    }

    const fileUrl =
        SUPABASE_URL +
        "/storage/v1/object/public/map-layers/" +
        layer.file_path
            .split("/")
            .map(encodeURIComponent)
            .join("/");

    const response = await fetch(fileUrl);

    if (!response.ok) {
        throw new Error(
            layer.name +
            " → файл недоступен: HTTP " +
            response.status
        );
    }

    const geojson = await response.json();

    if (
        !geojson ||
        geojson.type !== "FeatureCollection" ||
        !Array.isArray(geojson.features)
    ) {
        throw new Error(
            layer.name +
            " → файл не является GeoJSON FeatureCollection"
        );
    }

    map.addSource(sourceId, {
        type: "geojson",
        data: geojson
    });

    const geometryTypes = new Set();

    geojson.features.forEach(function(feature) {
        if (feature && feature.geometry) {
            const type = feature.geometry.type;
            if (type === "Polygon" || type === "MultiPolygon") {
                geometryTypes.add("polygon");
            } else if (type === "LineString" || type === "MultiLineString") {
                geometryTypes.add("line");
            } else if (type === "Point" || type === "MultiPoint") {
                geometryTypes.add("point");
            }
        }
    });

    if (geometryTypes.has("polygon")) {
        map.addLayer({
            id: prefix + "-fill",
            type: "fill",
            source: sourceId,
            paint: {
                "fill-color": "#1677ff",
                "fill-opacity": 0.12
            }
        });

        map.addLayer({
            id: prefix + "-line",
            type: "line",
            source: sourceId,
            paint: {
                "line-color": "#1677ff",
                "line-width": [
                    "interpolate", ["linear"], ["zoom"],
                    4, 1, 8, 1.5, 12, 2
                ],
                "line-opacity": 0.8
            }
        });

        adminInteractiveLayers.push({
            id: prefix + "-fill",
            layer: layer,
            priority: adminLayerPriority(layer)
        });
    }

    if (geometryTypes.has("line")) {
        map.addLayer({
            id: prefix + "-lines",
            type: "line",
            source: sourceId,
            paint: {
                "line-color": "#1677ff",
                "line-width": 2,
                "line-opacity": 0.85
            }
        });
    }

    if (geometryTypes.has("point")) {
        map.addLayer({
            id: prefix + "-points",
            type: "circle",
            source: sourceId,
            paint: {
                "circle-radius": 5,
                "circle-color": "#1677ff",
                "circle-stroke-color": "#ffffff",
                "circle-stroke-width": 1.5
            }
        });

        adminInteractiveLayers.push({
            id: prefix + "-points",
            layer: layer,
            priority: adminLayerPriority(layer)
        });
    }
}


function getAdminFeatureName(feature, layer) {
    const p = feature && feature.properties ? feature.properties : {};
    return (p.name_ru || p.name || p.name_uz || p.name_uz_cy || p.name_en || layer.name || "Объект");
}

function getAdminFeatureType(layer) {
    const type = String(layer && layer.layer_type || "").toLowerCase();
    if (type.includes("стра") || type.includes("country")) return "Страна";
    if (type.includes("област") || type.includes("region")) return "Область";
    if (type.includes("район") || type.includes("district")) return "Район";
    if (type.includes("город") || type.includes("city")) return "Город";
    if (type.includes("улиц") || type.includes("street")) return "Улица";
    if (type.includes("здан") || type.includes("building")) return "Здание";
    return "";
}

function showAdminLayerPopup(layer, feature, lngLat) {
    const name = getAdminFeatureName(feature, layer);
    const type = getAdminFeatureType(layer);
    const title = type ? "🧩 " + escapeHTML(type) : "🧩 " + escapeHTML(layer.name || "Слой");
    showInfo(title, "<strong>" + escapeHTML(name) + "</strong>");

    if (lngLat) {
        map.flyTo({
            center: [Number(lngLat.lng), Number(lngLat.lat)],
            zoom: Math.max(map.getZoom(), 7),
            speed: 0.8
        });
    }
}

/* =====================================================
   MAP LOAD
===================================================== */

map.on(

    "load",

    async function() {

        try {

            await loadNaqshaData();


            /* =================================================
               REGIONS SOURCE
            ================================================= */

            map.addSource(

                "naqsha-regions",

                {

                    type:
                        "geojson",

                    data:
                        regionsData

                }

            );


            /* =================================================
               REGIONS CLICK AREA
            ================================================= */

            map.addLayer({
                id: "naqsha-region-click",
                type: "fill",
                source: "naqsha-regions",
                minzoom: 4,
                paint: {
                    "fill-color": "#ffffff",
                    "fill-opacity": 0.001
                }
            });

            // Встроенный слой областей тоже участвует в общем
            // обработчике кликов, но имеет меньший приоритет,
            // чем загруженный пользователем слой областей.
            adminInteractiveLayers.push({
                id: "naqsha-region-click",
                layer: {
                    name: "Области",
                    layer_type: "regions"
                },
                priority: 15,

               BUILDING INTERACTION
            ================================================= */

            setupBuildingInteraction();


            /* =================================================
               ADMIN UPLOADED MAP LAYERS
            ================================================= */

            await loadActiveAdminLayers();

            /*
               ЕДИНЫЙ ОБРАБОТЧИК АДМИНИСТРАТИВНЫХ КЛИКОВ.
               queryRenderedFeatures получает ВСЕ совпадающие
               слои под пальцем, поэтому страна больше не
               перекрывает область.
            */
            map.on("click", function(event) {
                const queryLayers = adminInteractiveLayers.map(x => x.id);
                if (!queryLayers.length) return;

                const features = map.queryRenderedFeatures(
                    event.point,
                    { layers: queryLayers }
                );

                if (!features.length) return;

                const candidates = features.map(feature => {
                    const entry = adminInteractiveLayers.find(
                        x => x.id === feature.layer.id
                    );
                    return {
                        feature: feature,
                        layer: entry ? entry.layer : null,
                        priority: entry ? entry.priority : 0,
                        builtin: entry ? !!entry.builtin : false
                    };
                }).filter(x => x.layer);

                if (!candidates.length) return;

                // Берём наиболее конкретный объект.
                candidates.sort((a, b) => b.priority - a.priority);

                const selected = candidates[0];

                if (selected.builtin) {
                    const p = selected.feature.properties || {};
                    const name =
                        p.name_ru ||
                        p.name ||
                        p.name_uz ||
                        p.name_uz_cy ||
                        p.name_en ||
                        "Область";

                    showInfo(
                        "🗺️ Область",
                        "<strong>" + escapeHTML(name) + "</strong>"
                    );
                    return;
                }

                showAdminLayerPopup(
                    selected.layer,
                    selected.feature,
                    event.lngLat
                );
            });

            map.on("mousemove", function(event) {
                const queryLayers = adminInteractiveLayers.map(x => x.id);
                if (!queryLayers.length) return;

                const features = map.queryRenderedFeatures(
                    event.point,
                    { layers: queryLayers }
                );

                map.getCanvas().style.cursor =
                    features.length ? "pointer" : "";
            });


            /* =================================================
               READY
            ================================================= */

            document
                .getElementById(
                    "loading"
                )
                .style.display =
                "none";


            console.log(
                "=============================="
            );

            console.log(
                "✅ NAQSHA ГОТОВ"
            );

            console.log(
                "Regions:",
                regionsData.features.length
            );

            console.log(
                "Districts:",
                districtsData.features.length
            );

            console.log(
                "Cities:",
                citiesData.features.length
            );

            console.log(
                "=============================="
            );

        }

        catch(error) {

            console.error(
                "❌ NAQSHA ERROR:",
                error
            );


            document
                .getElementById(
                    "loading"
                )
                .textContent =
                "Ошибка подключения к Naqsha";


            showInfo(

                "❌ Ошибка Naqsha",

                error.message

            );

        }

    }

);


/* =====================================================
   SELECT CITY
===================================================== */

function selectCity(
    feature
) {

    if (!feature) {
        return;
    }


    selectedCity =
        feature;


    const properties =
        feature.properties || {};


    const cityName =
        properties.name_ru ||
        properties.name ||
        properties.name_uz ||
        "Город";


    const cityNameUz =
        properties.name_uz ||
        "";


    const population =
        properties.population;


    console.log(
        "🏙️ Выбран город:",
        cityName
    );


    console.log(
        "ID:",
        properties.id
    );


    let body =
        "Узбекистан";


    if (cityNameUz) {

        body +=
            "<br>Название: " +
            escapeHTML(
                cityNameUz
            );

    }


    if (
        population !== null &&
        population !== undefined &&
        population !== ""
    ) {

        body +=
            "<br>Население: " +
            Number(
                population
            ).toLocaleString(
                "ru-RU"
            );

    }


    showInfo(

        "🏙️ " +
        cityName,

        body

    );


    const center =
        getFeatureCenter(
            feature
        );


    if (center) {

        map.flyTo({

            center:
                center,

            zoom:
                Math.max(
                    map.getZoom(),
                    11
                ),

            speed:
                0.8

        });

    }

}


/* =====================================================
   SELECT DISTRICT
===================================================== */

function selectDistrict(
    feature,
    lngLat
) {

    if (!feature) {
        return;
    }


    selectedDistrict =
        feature;


    const properties =
        feature.properties || {};


    const districtId =
        properties.id != null
            ? String(properties.id)
            : null;


    const districtName =
        properties.name ||
        "Район";


    const regionName =
        properties.region_name ||
        "Узбекистан";


    console.log(
        "📍 Выбран район:",
        districtName
    );


    console.log(
        "ID:",
        districtId
    );


    if (

        districtId !== null &&

        map.getLayer(
            "naqsha-district-selected"
        )

    ) {

        map.setFilter(

            "naqsha-district-selected",

            [

                "==",

                [

                    "to-string",

                    [
                        "get",
                        "id"
                    ]

                ],

                districtId

            ]

        );

    }


    showInfo(

        "📍 " +
        districtName,

        "Область: " +
        escapeHTML(
            regionName
        )

    );


    if (lngLat) {

        map.flyTo({

            center: [

                Number(
                    lngLat.lng
                ),

                Number(
                    lngLat.lat
                )

            ],

            zoom:
                Math.max(
                    map.getZoom(),
                    8
                ),

            speed:
                0.8

        });

        return;

    }


    const center =
        getFeatureCenter(
            feature
        );


    if (center) {

        map.flyTo({

            center:
                center,

            zoom:
                9,

            speed:
                0.8

        });

    }

}

/* =====================================================
   FIND CITY
===================================================== */

function findCity(
    query
) {

    if (
        !citiesData ||
        !citiesData.features
    ) {

        return null;

    }


    const normalizedQuery =
        normalizeSearchText(
            query
        );


    const alias =
        SEARCH_ALIASES[
            normalizedQuery
        ] || null;


    /* =================================================
       EXACT
    ================================================= */

    let city =
        citiesData.features.find(

            function(feature) {

                const properties =
                    feature.properties || {};


                const names = [

                    properties.name,

                    properties.name_ru,

                    properties.name_uz

                ];


                return names.some(

                    function(name) {

                        return (

                            normalizeSearchText(
                                name
                            ) ===
                            normalizedQuery

                        );

                    }

                );

            }

        );


    if (city) {
        return city;
    }


    /* =================================================
       ALIAS
    ================================================= */

    if (alias) {

        city =
            citiesData.features.find(

                function(feature) {

                    const properties =
                        feature.properties || {};


                    const names = [

                        properties.name,

                        properties.name_ru,

                        properties.name_uz

                    ];


                    return names.some(

                        function(name) {

                            return (

                                normalizeSearchText(
                                    name
                                ) ===
                                alias

                            );

                        }

                    );

                }

            );


        if (city) {
            return city;
        }

    }


    /* =================================================
       PARTIAL
    ================================================= */

    city =
        citiesData.features.find(

            function(feature) {

                const properties =
                    feature.properties || {};


                const names = [

                    properties.name,

                    properties.name_ru,

                    properties.name_uz

                ];


                return names.some(

                    function(name) {

                        const normalizedName =
                            normalizeSearchText(
                                name
                            );


                        return (

                            normalizedName.includes(
                                normalizedQuery
                            )

                            ||

                            (
                                alias &&
                                normalizedName.includes(
                                    alias
                                )
                            )

                        );

                    }

                );

            }

        );


    return city || null;

}

                    normalizeSearchText(
                        properties.name
                    );


                return (
                    name ===
                    normalizedQuery
                );

            }

        );


    if (district) {
        return district;
    }


    /* =================================================
       ALIAS
    ================================================= */

    if (alias) {

        district =
            districtsData.features.find(

                function(feature) {

                    const properties =
                        feature.properties || {};


                    const name =
                        normalizeSearchText(
                            properties.name
                        );


                    return (
                        name.includes(
                            alias
                        )
                    );

                }

            );


        if (district) {
            return district;
        }

    }


    /* =================================================
       PARTIAL
    ================================================= */

    district =
        districtsData.features.find(

            function(feature) {

                const properties =
                    feature.properties || {};


                const name =
                    normalizeSearchText(
                        properties.name
                    );


                return (

                    name.includes(
                        normalizedQuery
                    )

                    ||

                    normalizedQuery.includes(
                        name
                    )

                );

            }

        );


    return district || null;

}


/* =====================================================
   MAIN SEARCH
===================================================== */

async function searchLocation() {

    if (!query) {

    }

    );

       CITY
    ================================================= */

        );

    }


    /* =================================================

    ================================================= */

/* =====================================================
   NOMINATIM
===================================================== */

async function searchNominatim(
    query
) {

    console.log(
        "🌍 Используем Nominatim..."
    );


    try {

        const url =

            "https://nominatim.openstreetmap.org/search" +

            "?format=jsonv2" +

            "&limit=5" +

            "&countrycodes=uz" +

            "&accept-language=ru" +

            "&q=" +

            encodeURIComponent(
                query
            );


        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                "Nominatim HTTP " +
                response.status
            );

        }


        const results =
            await response.json();


        if (
            !results ||
            !results.length
        ) {

            showInfo(

                "🔎 Ничего не найдено",

                "Naqsha и OpenStreetMap ничего не нашли."

            );

            return;

        }


        const result =
            results[0];


        const lat =
            Number(
                result.lat
            );


        const lon =
            Number(
                result.lon
            );


        if (

            !Number.isFinite(lat) ||

            !Number.isFinite(lon)

        ) {

            throw new Error(
                "Nominatim вернул неправильные координаты."
            );

        }


        map.flyTo({

            center: [

                lon,
                lat

            ],

            zoom:
                14,

            speed:
                1

        });


        setTimeout(

            function() {

                showInfo(

                    "📍 " +
                    (
                        result.name ||
                        query
                    ),

                    escapeHTML(
                        result.display_name ||
                        "Адрес найден"
                    )

                );

            },

            700

        );

    }

    catch(error) {

        console.error(
            "❌ SEARCH ERROR:",
            error
        );


        showInfo(

            "❌ Ошибка поиска",

            "Не удалось выполнить поиск."

        );

    }

}


/* =====================================================
   SEARCH SUGGESTIONS
===================================================== */

function showSearchResults(
    text
) {

    searchResults.innerHTML = "";


    if (
        !text.trim()
    ) {

        searchResults.style.display =
            "none";

        return;

    }


    if (
        !districtsData ||
        !citiesData
    ) {

        return;

    }


    const query =
        normalizeSearchText(
            text
        );


    const alias =
        SEARCH_ALIASES[
            query
        ] || null;


    const items = [];


    /* =================================================
       CITIES
    ================================================= */

    citiesData.features.forEach(

        function(feature) {

            const properties =
                feature.properties || {};


            const names = [

                properties.name,

                properties.name_ru,

                properties.name_uz

            ];


            const match =
                names.some(

                    function(name) {

                        const normalized =
                            normalizeSearchText(
                                name
                            );


                        return (

                            normalized.includes(
                                query
                            )

                            ||

                            (
                                alias &&
                                normalized.includes(
                                    alias
                                )
                            )

                        );

                    }

                );


            if (match) {

                items.push({

                    type:
                        "city",

                    feature:
                        feature,

                    name:
                        properties.name_ru ||
                        properties.name ||
                        properties.name_uz ||
                        "Город"

                });

            }

        }

    );


    /* =================================================
       DISTRICTS
    ================================================= */

    districtsData.features.forEach(

        function(feature) {

            const properties =
                feature.properties || {};


            const normalizedName =
                normalizeSearchText(
                    properties.name
                );


            const match =

                normalizedName.includes(
                    query
                )

                ||

                query.includes(
                    normalizedName
                )

                ||

                (
                    alias &&
                    normalizedName.includes(
                        alias
                    )
                );


            if (match) {

                items.push({

                    type:
                        "district",

                    feature:
                        feature,

                    name:
                        properties.name ||
                        "Район"

                });

            }

        }

    );


    const results =
        items.slice(
            0,
            12
        );


    if (
        !results.length
    ) {

        searchResults.style.display =
            "none";

        return;

    }


    results.forEach(

        function(item) {

            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "search-result";


            const icon =
                item.type === "city"
                    ? "🏙️"
                    : "📍";


            const type =
                item.type === "city"
                    ? "Город"
                    : "Район";


            element.innerHTML =

                icon +
                " " +
                escapeHTML(
                    item.name
                ) +

                '<span class="search-result-type">' +
                type +
                "</span>";


            element.addEventListener(

                "click",

                function() {

                    searchInput.value =
                        item.name;


                    searchResults.style.display =
                        "none";


                    if (
                        item.type ===
                        "city"
                    ) {

                        selectCity(
                            item.feature
                        );

                    }

                    else {

                        selectDistrictFromSearch(
                            item.feature
                        );

                    }

                }

            );


            searchResults.appendChild(
                element
            );

        }

    );


    searchResults.style.display =
        "block";

}


/* =====================================================
   CLOSE SEARCH WHEN CLICK OUTSIDE
===================================================== */

document.addEventListener(

    "click",

    function(event) {

        if (
            !event.target.closest(
                ".search-box"
            )
        ) {

            searchResults.style.display =
                "none";

        }

    }

);


/* =====================================================
   ESC
===================================================== */

document.addEventListener(

    "keydown",

    function(event) {

        if (
            event.key ===
            "Escape"
        ) {

            closeInfo();

            searchResults.style.display =
                "none";

        }

    }

);
