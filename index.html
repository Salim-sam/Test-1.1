/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://vhrhtykcrjqqiwwggomi.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_N9MAdF7_GW-IUFOXxY2MHQ_MG1ep1vg";


/* =====================================================
   MAP
===================================================== */

const MAP_CENTER = [

];

const START_ZOOM = 5;


/* =====================================================
   DATA
===================================================== */

let regionsData = null;

let districtsData = null;

let citiesData = null;

// Данные, загружаемые из активных GeoJSON-слоёв админки.
// Важно объявлять их заранее: иначе JavaScript останавливается на streetsData/activeMapLayers.
let streetsData = {
    type: "FeatureCollection",
    features: []
};

let activeMapLayers = [];

let selectedDistrict = null;

let selectedCity = null;


/* =====================================================
   SUPABASE RPC
===================================================== */

async function supabaseRPC(
    functionName
) {

    console.log(
        "Supabase RPC:",
        functionName
    );


    const response = await fetch(

        SUPABASE_URL +
        "/rest/v1/rpc/" +
        functionName,

        {

            method: "POST",

            headers: {

                "apikey":
                    SUPABASE_KEY,

                "Authorization":
                    "Bearer " +
                    SUPABASE_KEY,

                "Content-Type":
                    "application/json",

                "Accept":
                    "application/json"

            },

            body: "{}"

        }

    );


    if (!response.ok) {

        const errorText =
            await response.text();

        console.error(
            "Supabase RPC error:",
            functionName,
            response.status,
            errorText
        );

        throw new Error(
            "Supabase RPC " +
            functionName +
            " → HTTP " +
            response.status
        );

    }


    return await response.json();

}


/* =====================================================
   NORMALIZE
===================================================== */

function normalizeSearchText(
    text
) {

    return String(text || "")

        .toLowerCase()

        .trim()

        .replace(
            /district/g,
            ""
        )

        .replace(
            /район/g,
            ""
        )

        .replace(
            /область/g,
            ""
        )

        .replace(
            /город/g,
            ""
        )

        .replace(
            /['’`]/g,
            ""
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();

}

===================================================== */

    /* Samarkand */

    /* Jizzakh */

    jizzakh:

    /* Kashkadarya */

/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHTML(
    value
) {

    return String(value || "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   GEOJSON CENTER
===================================================== */

function getFeatureCenter(
    feature
) {

    if (
        !feature ||
        !feature.geometry ||
        !feature.geometry.coordinates
    ) {

        return null;

    }


    const coordinates = [];


    function collect(
        value
    ) {

        if (
            !Array.isArray(value)
        ) {

            return;

        }


        if (

            value.length >= 2 &&

            typeof value[0] ===
                "number" &&

            typeof value[1] ===
                "number"

        ) {

            coordinates.push(
                value
            );

            return;

        }


        value.forEach(
            collect
        );

    }


    collect(
        feature.geometry.coordinates
    );


    if (
        !coordinates.length
    ) {

        return null;

    }


    let lng = 0;

    let lat = 0;

    let count = 0;


    coordinates.forEach(

        function(point) {

            const pointLng =
                Number(
                    point[0]
                );

            const pointLat =
                Number(
                    point[1]
                );


            if (

                Number.isFinite(
                    pointLng
                )

                &&

                Number.isFinite(
                    pointLat
                )

            ) {

                lng +=
                    pointLng;

                lat +=
                    pointLat;

                count++;

            }

        }

    );


    if (
        count === 0
    ) {

        return null;

    }


    return [

        lng / count,

        lat / count

    ];

}


/* =====================================================
   LOAD ALL DATA
===================================================== */

async function loadNaqshaData() {

    console.log(
        "🇺🇿 Naqsha: подключение к Supabase..."
    );


    const [

        regions,

        districts,

        cities

    ] = await Promise.all([

        supabaseRPC(
            "get_regions_geojson"
        ),

        supabaseRPC(
            "get_districts_geojson"
        ),

        supabaseRPC(
            "get_cities_geojson"
        )

    ]);


    regionsData =
        regions;

    districtsData =
        districts;

    citiesData =
        cities;


    /* =================================================
       CHECK REGIONS
    ================================================= */

    if (

        !regionsData ||

        regionsData.type !==
            "FeatureCollection"

    ) {

        throw new Error(
            "get_regions_geojson вернул неправильный формат."
        );

    }


    /* =================================================
       CHECK DISTRICTS
    ================================================= */

    if (

        !districtsData ||

        districtsData.type !==
            "FeatureCollection"

    ) {

        throw new Error(
            "get_districts_geojson вернул неправильный формат."
        );

    }


    /* =================================================
       CHECK CITIES
    ================================================= */

    if (

        !citiesData ||

        citiesData.type !==
            "FeatureCollection"

    ) {

        throw new Error(
            "get_cities_geojson вернул неправильный формат."
        );

    }


    console.log(
        "Областей:",
        regionsData.features.length
    );


    console.log(
        "Районов:",
        districtsData.features.length
    );


    console.log(
        "Городов:",
        citiesData.features.length
    );


    /* =================================================
       REMOVE BAD FEATURES
    ================================================= */

    regionsData.features =
        regionsData.features.filter(

            function(feature) {

                return (

                    feature &&

                    feature.geometry &&

                    feature.geometry.coordinates

                );

            }

        );


    districtsData.features =
        districtsData.features.filter(

            function(feature) {

                return (

                    feature &&

                    feature.geometry &&

                    feature.geometry.coordinates

                );

            }

        );


    citiesData.features =
        citiesData.features.filter(

            function(feature) {

                return (

                    feature &&

                    feature.geometry &&

                    feature.geometry.coordinates

                );

            }

        );


    console.log(
        "После проверки:"
    );


    console.log(
        "Regions:",
        regionsData.features.length
    );


    console.log(
        "Districts:",
        districtsData.features.length
    );


    console.log(
        "Cities:",
        citiesData.features.length
    );

}


/* =====================================================
   ACTIVE NAQSHA LAYERS — SYNC DB + GEOJSON
===================================================== */

async function loadActiveNaqshaLayers() {
    try {
        const response = await fetch(
            SUPABASE_URL +
            "/rest/v1/map_layers?select=*&is_active=eq.true&order=id.asc",
            {
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": "Bearer " + SUPABASE_KEY,
                    "Accept": "application/json"
                }
            }
        );

        if (!response.ok) throw new Error("map_layers HTTP " + response.status);
        activeMapLayers = await response.json();
    } catch (error) {
        console.warn("⚠️ Не удалось получить активные слои:", error);
        activeMapLayers = [];
    }
}

function publicLayerUrl(filePath) {
    return SUPABASE_URL +
        "/storage/v1/object/public/map-layers/" +
        encodeURIComponent(String(filePath || "")).replace(/%2F/g, "/");
}

async function loadLayerGeoJSON(layer) {
    const url = publicLayerUrl(layer.file_path);
    const response = await fetch(url, {cache: "no-store"});
    if (!response.ok) throw new Error("GeoJSON HTTP " + response.status);
    const data = await response.json();
    if (!data || data.type !== "FeatureCollection" || !Array.isArray(data.features)) {
        throw new Error("Слой " + layer.name + " не является FeatureCollection");
    }
    return data;
}

function normLayerValue(v) {
    return String(v ?? "").toLowerCase().trim()
        .replace(/[ʻʼ’`']/g, "")
        .replace(/\s+/g, " ");
}

function mergeFeatureWithDB(feature, dbRows, type) {
    const p = feature.properties || {};
    const pid = String(p.id ?? feature.id ?? "").trim();
    let row = null;

    if (pid) row = dbRows.find(x => String(x.id) === pid);

    if (!row && type === "districts") {
        const rn = normLayerValue(p.name_ru || p.name || p.name_uz);
        row = dbRows.find(x =>
            String(x.region_id || "") === String(p.region_id || "") &&
            [x.name_ru, x.name, x.name_uz, x.name_uz_cy, x.name_en]
                .some(n => normLayerValue(n) === rn)
        );
    }

    if (!row && type === "streets") {
        const n = normLayerValue(p.name_ru || p.name || p.name_uz);
        row = dbRows.find(x =>
            normLayerValue(x.name_ru || x.name || x.name_uz) === n &&
            String(x.city_id || "") === String(p.city_id || "") &&
            String(x.district_id || "") === String(p.district_id || "")
        );
    }

    if (!row) return feature;

    return {
        ...feature,
        id: row.id,
        properties: {
            ...p,
            ...row,
            id: row.id
        }
    };
}

async function buildSynchronizedMapLayers() {
    // Всегда начинаем с валидного FeatureCollection.
    // Если слой улиц/районов не загружен, карта всё равно должна запускаться.
    streetsData = {type: "FeatureCollection", features: []};
    await loadActiveNaqshaLayers();

    // Districts: geometry comes from the active GeoJSON layer, attributes from DB.
    const districtLayer = activeMapLayers.find(x =>
        String(x.layer_type || "").toLowerCase() === "districts"
    );

    if (districtLayer) {
        try {
            const geo = await loadLayerGeoJSON(districtLayer);
            districtsData = {
                type: "FeatureCollection",
                features: geo.features
                    .map(f => mergeFeatureWithDB(f, districtsData.features, "districts"))
                    .filter(f => f.geometry && f.geometry.coordinates)
            };
            console.log("🗺️ Районы: активный слой синхронизирован с БД", districtsData.features.length);
        } catch (e) {
            console.warn("⚠️ Слой районов не загрузился, используем геометрию БД:", e);
        }
    }

    // Streets: geometry comes from active GeoJSON layer, attributes from streets table.
    const streetLayer = activeMapLayers.find(x =>
        String(x.layer_type || "").toLowerCase() === "streets"
    );

    if (streetLayer) {
        try {
            const streetRowsResponse = await fetch(
                SUPABASE_URL + "/rest/v1/streets?select=*&order=id.asc",
                {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": "Bearer " + SUPABASE_KEY,
                        "Accept": "application/json"
                    }
                }
            );
            const streetRows = streetRowsResponse.ok ? await streetRowsResponse.json() : [];
            const geo = await loadLayerGeoJSON(streetLayer);
            streetsData = {
                type: "FeatureCollection",
                features: geo.features
                    .map(f => mergeFeatureWithDB(f, streetRows, "streets"))
                    .filter(f => f.geometry && f.geometry.coordinates)
            };
            console.log("🛣️ Улицы: активный слой синхронизирован с БД", streetsData.features.length);
        } catch (e) {
            console.warn("⚠️ Слой улиц не загрузился:", e);
            streetsData = {type:"FeatureCollection",features:[]};
        }
    }
}

/* =====================================================
   MAP INITIALIZATION
===================================================== */

map.addControl(

   MAP LOAD
===================================================== */

        try {

            await loadNaqshaData();
            await buildSynchronizedMapLayers();

            /* =================================================

            ================================================= */

            map.addLayer({

                id:

                source:

                minzoom:

                        6,

                        9,
                        1.2,

                        13,
                        2

                    ],

                    "line-opacity":

                }

            });


            /* =================================================
               STREETS SOURCE — ACTIVE ADMIN LAYER
            ================================================= */

            map.addSource(
                "naqsha-streets",
                {
                    type: "geojson",
                    data: streetsData
                }
            );

            map.addLayer({
                id: "naqsha-street-lines",
                type: "line",
                source: "naqsha-streets",
                minzoom: 11,
                paint: {
                    "line-color": "#1677ff",
                    "line-width": [
                        "interpolate", ["linear"], ["zoom"],
                        11, 0.7,
                        14, 1.3,
                        17, 2.2
                    ],
                    "line-opacity": 0.72
                }
            });

            map.on("click", "naqsha-street-lines", function(event) {
                if (!event.features || !event.features.length) return;
                const feature = event.features[0];
                const p = feature.properties || {};
                const name = p.name_ru || p.name || p.name_uz || "Улица";
                const city = p.city_name || "";
                const district = p.district_name || "";
                let body = "Узбекистан";
                if (city) body += "<br>Город: " + escapeHTML(city);
                if (district) body += "<br>Район: " + escapeHTML(district);
                showInfo("🛣️ " + name, body);
            });

            map.on("mouseenter", "naqsha-street-lines", function() {
                map.getCanvas().style.cursor = "pointer";
            });
            map.on("mouseleave", "naqsha-street-lines", function() {
                map.getCanvas().style.cursor = "";
            });


            /* =================================================
               CITY SOURCE
            ================================================= */

            map.addSource(

                "naqsha-cities",

                {

                    type:
                        "geojson",

                    data:
                        citiesData

                }

            );


            /* =================================================
               CITY POLYGONS
            ================================================= */

            map.addLayer({

                id:
                    "naqsha-city-fill",

                type:
                    "fill",

/* =====================================================
   SELECT CITY
===================================================== */

function selectCity(
    feature
) {

    if (!feature) {
        return;
    }


    selectedCity =
        feature;


    const properties =
        feature.properties || {};


    const cityName =
        properties.name_ru ||
        properties.name ||
        properties.name_uz ||
        "Город";


    const cityNameUz =
        properties.name_uz ||
        "";


    const population =
        properties.population;


    console.log(
        "🏙️ Выбран город:",
        cityName
    );


    console.log(
        "ID:",
        properties.id
    );


    let body =
        "Узбекистан";


    if (cityNameUz) {

        body +=
            "<br>Название: " +
            escapeHTML(
                cityNameUz
            );

    }


    if (
        population !== null &&
        population !== undefined &&
        population !== ""
    ) {

        body +=
            "<br>Население: " +
            Number(
                population
            ).toLocaleString(
                "ru-RU"
            );

    }


    showInfo(

        "🏙️ " +
        cityName,

        body

    );


    const center =
        getFeatureCenter(
            feature
        );


    if (center) {

        map.flyTo({

            center:
                center,

            zoom:
                Math.max(
                    map.getZoom(),
                    11
                ),

            speed:
                0.8

        });

    }

}


/* =====================================================
   SELECT DISTRICT
===================================================== */

function selectDistrict(
    feature,
    lngLat
) {

    if (!feature) {
        return;
    }


    selectedDistrict =
        feature;


    const properties =
        feature.properties || {};


    const districtId =
        properties.id != null
            ? String(properties.id)
            : null;


    const districtName =
        properties.name ||
        "Район";


    const regionName =
        properties.region_name ||
        "Узбекистан";


    console.log(
        "📍 Выбран район:",
        districtName
    );


    console.log(
        "ID:",
        districtId
    );


    if (

        districtId !== null &&

        map.getLayer(
            "naqsha-district-selected"
        )

    ) {

        map.setFilter(

            "naqsha-district-selected",

            [

                "==",

                [

                    "to-string",

                    [
                        "get",
                        "id"
                    ]

                ],

                districtId

            ]

        );

    }


    showInfo(

        "📍 " +
        districtName,

        "Область: " +
        escapeHTML(
            regionName
        )

    );


    if (lngLat) {

        map.flyTo({

            center: [

                Number(
                    lngLat.lng
                ),

                Number(
                    lngLat.lat
                )

            ],

            zoom:
                Math.max(
                    map.getZoom(),
                    8
                ),

            speed:
                0.8

        });

        return;

    }


    const center =
        getFeatureCenter(
            feature
        );


    if (center) {

        map.flyTo({

            center:
                center,

            zoom:
                9,

            speed:
                0.8

        });

    }

}

                    &&

/* =====================================================
   FIND CITY
===================================================== */

function findCity(
    query
) {

    if (
        !citiesData ||
        !citiesData.features
    ) {

        return null;

    }


    const normalizedQuery =
        normalizeSearchText(
            query
        );


    const alias =
        SEARCH_ALIASES[
            normalizedQuery
        ] || null;


    /* =================================================
       EXACT
    ================================================= */

    let city =
        citiesData.features.find(

            function(feature) {

                const properties =
                    feature.properties || {};


                const names = [

                    properties.name,

                    properties.name_ru,

                    properties.name_uz

                ];


                return names.some(

                    function(name) {

                        return (

                            normalizeSearchText(
                                name
                            ) ===
                            normalizedQuery

                        );

                    }

                );

            }

        );


    if (city) {
        return city;
    }


    /* =================================================
       ALIAS
    ================================================= */

    if (alias) {

        city =
            citiesData.features.find(

                function(feature) {

                    const properties =
                        feature.properties || {};


                    const names = [

                        properties.name,

                        properties.name_ru,

                        properties.name_uz

                    ];


                    return names.some(

                        function(name) {

                            return (

                                normalizeSearchText(
                                    name
                                ) ===
                                alias

                            );

                        }

                    );

                }

            );


        if (city) {
            return city;
        }

    }


    /* =================================================
       PARTIAL
    ================================================= */

    city =
        citiesData.features.find(

            function(feature) {

                const properties =
                    feature.properties || {};


                const names = [

                    properties.name,

                    properties.name_ru,

                    properties.name_uz

                ];


                return names.some(

                    function(name) {

                        const normalizedName =
                            normalizeSearchText(
                                name
                            );


                        return (

                            normalizedName.includes(
                                normalizedQuery
                            )

                            ||

                            (
                                alias &&
                                normalizedName.includes(
                                    alias
                                )
                            )

                        );

                    }

                );

            }

        );


    return city || null;

}


/* =====================================================
   FIND DISTRICT
===================================================== */

function findDistrict(
    query
) {

    if (
        !districtsData ||
        !districtsData.features
    ) {

        return null;

    }


    const normalizedQuery =
        normalizeSearchText(
            query
        );


    const alias =
        SEARCH_ALIASES[
            normalizedQuery
        ] || null;


    /* =================================================
       EXACT
    ================================================= */

    let district =
        districtsData.features.find(

            function(feature) {

                const properties =
                    feature.properties || {};


                const name =
                    normalizeSearchText(
                        properties.name
                    );


                return (
                    name ===
                    normalizedQuery
                );

            }

        );


    if (district) {
        return district;
    }


    /* =================================================
       ALIAS
    ================================================= */

    if (alias) {

        district =
            districtsData.features.find(

                function(feature) {

                    const properties =
                        feature.properties || {};


                    const name =
                        normalizeSearchText(
                            properties.name
                        );


                    return (
                        name.includes(
                            alias
                        )
                    );

                }

            );


        if (district) {
            return district;
        }

    }


    /* =================================================
       PARTIAL
    ================================================= */

    district =
        districtsData.features.find(

            function(feature) {

                const properties =
                    feature.properties || {};


                const name =
                    normalizeSearchText(
                        properties.name
                    );


                return (

                    name.includes(
                        normalizedQuery
                    )

                    ||

                    normalizedQuery.includes(
                        name
                    )

                );

            }

        );


    return district || null;

}

/* =====================================================
   NOMINATIM
===================================================== */

async function searchNominatim(
    query
) {

    console.log(
        "🌍 Используем Nominatim..."
    );


    try {

        const url =

            "https://nominatim.openstreetmap.org/search" +

            "?format=jsonv2" +

            "&limit=5" +

            "&countrycodes=uz" +

            "&accept-language=ru" +

            "&q=" +

            encodeURIComponent(
                query
            );


        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                "Nominatim HTTP " +
                response.status
            );

        }


        const results =
            await response.json();


        if (
            !results ||
            !results.length
        ) {

            showInfo(

                "🔎 Ничего не найдено",

                "Naqsha и OpenStreetMap ничего не нашли."

            );

            return;

        }


        const result =
            results[0];


        const lat =
            Number(
                result.lat
            );


        const lon =
            Number(
                result.lon
            );


        if (

            !Number.isFinite(lat) ||

            !Number.isFinite(lon)

        ) {

            throw new Error(
                "Nominatim вернул неправильные координаты."
            );

        }


        map.flyTo({

            center: [

                lon,
                lat

            ],

            zoom:
                14,

            speed:
                1

        });


        setTimeout(

            function() {

                showInfo(

                    "📍 " +
                    (
                        result.name ||
                        query
                    ),

                    escapeHTML(
                        result.display_name ||
                        "Адрес найден"
                    )

                );

            },

            700

        );

    }

    catch(error) {

        console.error(
            "❌ SEARCH ERROR:",
            error
        );


        showInfo(

            "❌ Ошибка поиска",

            "Не удалось выполнить поиск."

        );

    }

}

        );


    const alias =
        SEARCH_ALIASES[
            query
        ] || null;


    const items = [];


    /* =================================================
       CITIES
    ================================================= */

    citiesData.features.forEach(

        function(feature) {

            const properties =
                feature.properties || {};


            const names = [

                properties.name,

                properties.name_ru,

                properties.name_uz

            ];


            const match =
                names.some(

                    function(name) {

                        const normalized =
                            normalizeSearchText(
                                name
                            );


                        return (

                            normalized.includes(
                                query
                            )

                            ||

                            (
                                alias &&
                                normalized.includes(
                                    alias
                                )
                            )

                        );

                    }

                );


            if (match) {

                items.push({

                    type:
                        "city",

                    feature:
                        feature,

                    name:
                        properties.name_ru ||
                        properties.name ||
                        properties.name_uz ||
                        "Город"

                });

            }

        }

    );


    /* =================================================
       DISTRICTS
    ================================================= */

    districtsData.features.forEach(

        function(feature) {

            const properties =
                feature.properties || {};


            const normalizedName =
                normalizeSearchText(
                    properties.name
                );


            const match =

                normalizedName.includes(
                    query
                )

                ||

                query.includes(
                    normalizedName
                )

                ||

                (
                    alias &&
                    normalizedName.includes(
                        alias
                    )
                );


            if (match) {

                items.push({

                    type:
                        "district",

                    feature:
                        feature,

                    name:
                        properties.name ||
                        "Район"

                });

            }

        }

    );


    /* =================================================
       STREETS
    ================================================= */

    if (streetsData && Array.isArray(streetsData.features)) {
        streetsData.features.forEach(function(feature) {
            const properties = feature.properties || {};
            const names = [
                properties.name,
                properties.name_ru,
                properties.name_uz,
                properties.name_uz_cy
            ];

            const match = names.some(function(name) {
                const normalized = normalizeSearchText(name);
                return normalized.includes(query) || (alias && normalized.includes(alias));
            });

            if (match) {
                items.push({
                    type: "street",
                    feature: feature,
                    name: properties.name_ru || properties.name || properties.name_uz || "Улица"
                });
            }
        });
    }

    const results =
        items.slice(
            0,
            12
        );


    if (
        !results.length
    ) {

        searchResults.style.display =
            "none";

        return;

    }


    results.forEach(

        function(item) {

            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "search-result";


            const icon =
                item.type === "city"
                    ? "🏙️"
                    : item.type === "street"
                        ? "🛣️"
                        : "📍";


            const type =
                item.type === "city"
                    ? "Город"
                    : item.type === "street"
                        ? "Улица"
                        : "Район";


            element.innerHTML =

                icon +
                " " +
                escapeHTML(
                    item.name
                ) +

                '<span class="search-result-type">' +
                type +
                "</span>";


            element.addEventListener(

                "click",

                function() {

                    searchInput.value =
                        item.name;


                    searchResults.style.display =
                        "none";


                    if (item.type === "city") {
                        selectCity(item.feature);
                    } else if (item.type === "street") {
                        const center = getFeatureCenter(item.feature);
                        if (center) {
                            map.flyTo({center:center, zoom:Math.max(map.getZoom(), 14), speed:0.8});
                        }
                        const p = item.feature.properties || {};
                        let body = "Узбекистан";
                        if (p.city_name) body += "<br>Город: " + escapeHTML(p.city_name);
                        if (p.district_name) body += "<br>Район: " + escapeHTML(p.district_name);
                        showInfo("🛣️ " + (p.name_ru || p.name || "Улица"), body);
                    } else {
                        selectDistrictFromSearch(item.feature);
                    }

                }

            );


            searchResults.appendChild(
                element
            );

        }

    );


    searchResults.style.display =
        "block";

}


/* =====================================================
   CLOSE SEARCH WHEN CLICK OUTSIDE
===================================================== */

document.addEventListener(

    "click",

    function(event) {

        if (
            !event.target.closest(
                ".search-box"
            )
        ) {

            searchResults.style.display =
                "none";

        }

    }

);


/* =====================================================
   ESC
===================================================== */

document.addEventListener(

    "keydown",

    function(event) {

        if (
            event.key ===
            "Escape"
        ) {

            closeInfo();

            searchResults.style.display =
                "none";

        }

    }

);

</script>

</body>

</html>
