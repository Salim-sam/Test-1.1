<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Naqsha — Карта Узбекистана</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
html,body,#map{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow:hidden}
#map{background:#e9eef3}
.top{
 position:absolute;z-index:1000;top:18px;left:18px;right:18px;
 display:flex;gap:10px;align-items:center;pointer-events:none
}
.brand{
 pointer-events:auto;background:rgba(255,255,255,.96);border-radius:18px;
 padding:12px 17px;font-size:20px;font-weight:750;
 box-shadow:0 6px 25px rgba(0,0,0,.12)
}
.search{
 pointer-events:auto;flex:1;max-width:520px;background:rgba(255,255,255,.96);
 border:0;border-radius:18px;padding:13px 16px;font-size:16px;
 box-shadow:0 6px 25px rgba(0,0,0,.12);outline:none
}
.panel{
 position:absolute;z-index:1000;right:18px;top:82px;width:min(330px,calc(100% - 36px));
 background:rgba(255,255,255,.96);border-radius:16px;padding:14px;
 box-shadow:0 8px 30px rgba(0,0,0,.13)
}
.status{font-size:13px;color:#667085;margin-bottom:9px}
.status.ok{color:#027a48}.status.err{color:#b42318}
.layers{max-height:45vh;overflow:auto;display:flex;flex-direction:column;gap:7px}
.layer{
 display:flex;gap:9px;align-items:center;padding:9px 10px;border:1px solid #e4e7ec;
 border-radius:10px;background:#fff;font-size:14px
}
.layer input{width:17px;height:17px}
.reload{
 width:100%;margin-top:10px;border:0;border-radius:10px;padding:10px;
 background:#111827;color:#fff;font-weight:650
}
.empty{font-size:13px;color:#667085;padding:4px}
@media(max-width:600px){
 .top{top:12px;left:12px;right:12px;flex-wrap:wrap}
 .brand{font-size:18px;padding:10px 14px}
 .search{order:2;flex-basis:100%;max-width:none}
 .panel{top:125px;right:12px;width:calc(100% - 24px)}
}
</style>
</head>
<body>

<div id="map"></div>

<div class="top">
  <div class="brand">🇺🇿 Naqsha</div>
  <input id="search" class="search" placeholder="Найти город, район, улицу..." autocomplete="off">
</div>

<div class="panel">
  <div id="status" class="status">Подключение…</div>
  <div id="layers" class="layers"><div class="empty">Загрузка слоёв…</div></div>
  <button id="reload" class="reload">↻ Обновить</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/*
  NAQSHA — MAIN MAP
  Этот файл заменяет только index.html.
  admin.html НЕ затрагивается.

  ВСТАВЬ СЮДА ТОЧНО ТЕ ЖЕ ДАННЫЕ SUPABASE,
  которые используются в admin.html.
*/
const SUPABASE_URL = 'https://vhrhtykcrjqqiwwggomi.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_N9MAdF7_GW-IUFOXxY2MHQ_MG1ep1vg';

const map=L.map('map',{zoomControl:true}).setView([41.31,69.28],6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
 maxZoom:20,
 attribution:'&copy; OpenStreetMap contributors'
}).addTo(map);

const statusEl=document.getElementById('status');
const layersEl=document.getElementById('layers');
const reload=document.getElementById('reload');
const search=document.getElementById('search');

let loaded={};
let records=[];

function status(text,type=''){
 statusEl.textContent=text;
 statusEl.className='status '+type;
}

function esc(v){
 return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

function parseJSON(value){
 if(typeof value!=='string')return value;
 try{return JSON.parse(value)}catch{return null}
}

function getGeoJSON(row){
 const candidates=[
   row.geojson,row.geo_json,row.data,row.geometry_data,
   row.layer_data,row.content,row.source_data
 ];
 for(const value of candidates){
   const parsed=parseJSON(value);
   if(parsed && ['FeatureCollection','Feature','GeometryCollection'].includes(parsed.type))
     return parsed;
 }
 return null;
}

function layerName(row){
 return row.name_ru || row.name || row.title || row.layer_name ||
        row.name_uz || row.name_en || ('Слой '+row.id);
}

function popup(feature,layer){
 const p=feature?.properties||{};
 const keys=Object.keys(p).filter(k=>p[k]!==null&&p[k]!==undefined&&p[k]!=='');
 if(!keys.length)return;
 layer.bindPopup(keys.map(k=>
   '<div style="margin:3px 0"><b>'+esc(k)+':</b> '+esc(p[k])+'</div>'
 ).join(''));
}

async function getLayers(){
 const endpoint=SUPABASE_URL.replace(/\/$/,'')+
   '/rest/v1/map_layers?select=*';

 const response=await fetch(endpoint,{
   headers:{
     apikey:SUPABASE_ANON_KEY,
     Authorization:'Bearer '+SUPABASE_ANON_KEY
   }
 });

 if(!response.ok){
   const text=await response.text();
   throw new Error('HTTP '+response.status+' '+text);
 }
 return response.json();
}

function clearLayers(){
 Object.values(loaded).forEach(l=>{
   try{map.removeLayer(l)}catch{}
 });
 loaded={};
}

function render(rows){
 clearLayers();
 layersEl.innerHTML='';

 const usable=rows.map((row,i)=>({
   row,
   geo:getGeoJSON(row),
   name:layerName(row),
   key:'l_'+(row.id??i)
 })).filter(x=>x.geo);

 records=usable;

 if(!usable.length){
   layersEl.innerHTML='<div class="empty">GeoJSON-слоёв пока нет.</div>';
   return;
 }

 const all=[];

 usable.forEach((item,i)=>{
   const checkboxId='layer_'+i;
   const label=document.createElement('label');
   label.className='layer';
   label.innerHTML='<input type="checkbox" id="'+checkboxId+'" checked><span>'+
     esc(item.name)+'</span>';
   layersEl.appendChild(label);

   const geo=L.geoJSON(item.geo,{
     onEachFeature:popup
   }).addTo(map);

   loaded[checkboxId]=geo;
   all.push(geo);

   label.querySelector('input').addEventListener('change',e=>{
     if(e.target.checked)geo.addTo(map);
     else map.removeLayer(geo);
   });
 });

 const group=L.featureGroup(all);
 if(group.getLayers().length){
   try{map.fitBounds(group.getBounds().pad(.08))}catch{}
 }
}

async function load(){
 reload.disabled=true;
 status('Загрузка слоёв…');

 if(SUPABASE_URL.includes('PASTE_')||SUPABASE_ANON_KEY.includes('PASTE_')){
   status('Нужно вставить данные Supabase.','err');
   layersEl.innerHTML='<div class="empty">Вставь SUPABASE_URL и SUPABASE_ANON_KEY из admin.html.</div>';
   reload.disabled=false;
   return;
 }

 try{
   const rows=await getLayers();
   render(rows);
   const count=records.length;
   status(count?'Загружено слоёв: '+count:'Подключение работает, слоёв пока нет.',count?'ok':'');
 }catch(error){
   console.error(error);
   status('Ошибка: '+error.message,'err');
   layersEl.innerHTML='<div class="empty">Не удалось загрузить map_layers.</div>';
 }
 reload.disabled=false;
}

reload.onclick=load;

search.addEventListener('keydown',e=>{
 if(e.key==='Enter'){
   const q=search.value.trim().toLowerCase();
   if(!q)return;
   let found=null;
   for(const item of records){
     const layer=item.geo;
     const features=layer.features||[];
     const hit=features.find(f=>{
       const p=f.properties||{};
       return Object.values(p).some(v=>String(v??'').toLowerCase().includes(q));
     });
     if(hit){found={layer,item,feature:hit};break}
   }
   if(found){
     const temp=L.geoJSON(found.feature);
     try{map.fitBounds(temp.getBounds().pad(.4))}catch{}
     const props=found.feature.properties||{};
     const html=Object.entries(props).filter(([,v])=>v!==null&&v!==undefined&&v!=='')
       .map(([k,v])=>'<b>'+esc(k)+':</b> '+esc(v)).join('<br>');
     temp.bindPopup(html||esc(found.item.name)).openPopup();
   }else{
     alert('Ничего не найдено');
   }
 }
});

load();
</script>
</body>
</html>
