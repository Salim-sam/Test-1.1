<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>Naqsha</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

#map {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;
}


/* =====================================================
   LOGO
===================================================== */

.logo {

    position: absolute;

    z-index: 100;

    top: 18px;
    left: 18px;

    background: rgba(255,255,255,.97);

    padding: 14px 20px;

    border-radius: 16px;

    font-size: 23px;

    font-weight: 700;

    box-shadow:
        0 3px 18px rgba(0,0,0,.18);

    user-select: none;
}


/* =====================================================
   SEARCH
===================================================== */

.search-box {

    position: absolute;

    z-index: 100;

    top: 76px;

    left: 18px;
    right: 18px;

    max-width: 680px;

    margin: 0 auto;

    display: flex;

    align-items: center;

    background: white;

    border-radius: 16px;

    box-shadow:
        0 3px 18px rgba(0,0,0,.18);
}

.search-icon {

    padding-left: 16px;

    font-size: 22px;
}

#searchInput {

    flex: 1;

    width: 100%;

    border: none;

    outline: none;

    background: transparent;

    font-size: 17px;

    padding: 16px 9px;
}

#searchButton {

    border: none;

    background: transparent;

    font-size: 22px;

    padding: 13px 16px;

    cursor: pointer;
}


/* =====================================================
   SEARCH RESULTS
===================================================== */

#searchResults {

    position: absolute;

    z-index: 300;

    top: calc(100% + 7px);

    left: 0;
    right: 0;

    background: white;

    border-radius: 14px;

    overflow: hidden;

    box-shadow:
        0 5px 22px rgba(0,0,0,.2);

    display: none;

    max-height: 320px;

    overflow-y: auto;
}

.search-result {

    padding: 14px 16px;

    border-bottom:
        1px solid #eeeeee;

    cursor: pointer;

    font-size: 16px;
}

.search-result:last-child {

    border-bottom: none;
}

.search-result:active {

    background: #eeeeee;
}


/* =====================================================
   INFO PANEL
===================================================== */

#infoPanel {

    position: absolute;

    z-index: 200;

    left: 15px;
    right: 15px;

    bottom: 18px;

    max-width: 440px;

    margin: auto;

    background: rgba(255,255,255,.98);

    border-radius: 18px;

    box-shadow:
        0 5px 28px rgba(0,0,0,.25);

    padding: 20px;

    display: none;
}

.info-close {

    position: absolute;

    right: 10px;
    top: 7px;

    width: 35px;
    height: 35px;

    border: none;

    background: transparent;

    color: #1677ff;

    font-size: 27px;

    cursor: pointer;
}

.info-title {

    padding-right: 30px;

    font-size: 21px;

    font-weight: 700;

    line-height: 1.3;

    margin-bottom: 12px;
}

.info-body {

    font-size: 16px;

    line-height: 1.5;
}


/* =====================================================
   LOADING
===================================================== */

#loading {

    position: absolute;

    z-index: 500;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    background: white;

    padding: 15px 20px;

    border-radius: 14px;

    box-shadow:
        0 4px 20px rgba(0,0,0,.2);

    font-size: 16px;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .logo {

        top: 12px;
        left: 12px;

        padding: 12px 16px;

        font-size: 21px;

        border-radius: 15px;
    }

    .search-box {

        top: 66px;

        left: 12px;
        right: 12px;
    }

    #searchInput {

        font-size: 17px;
    }

}

</style>

</head>


<body>


<div id="map"></div>


<div class="logo">
    🇺🇿 Naqsha
</div>


<div class="search-box">

    <div class="search-icon">
        🔎
    </div>

    <input
        id="searchInput"
        type="text"
        placeholder="Найти улицу, район..."
        autocomplete="off"
    >

    <button
        id="searchButton"
        type="button"
    >
        🔍
    </button>

    <div id="searchResults"></div>

</div>


<div id="loading">
    Загрузка Naqsha...
</div>


<div id="infoPanel">

    <button
        class="info-close"
        onclick="closeInfo()"
    >
        ×
    </button>

    <div
        id="infoTitle"
        class="info-title"
    ></div>

    <div
        id="infoBody"
        class="info-body"
    ></div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://vhrhtykcrjqqiwwggomi.supabase.co";


/*
 * ВСТАВЬ СЮДА СВОЙ sb_publishable_... КЛЮЧ
 */

const SUPABASE_KEY =
    "sb_publishable_N9MAdF7_GW-IUFOXxY2MHQ_MG1ep1vg";


/* =====================================================
   SUPABASE RPC
===================================================== */

async function callSupabaseRPC(functionName) {

    const response = await fetch(

        SUPABASE_URL +
        "/rest/v1/rpc/" +
        functionName,

        {

            method: "POST",

            headers: {

                "apikey":
                    SUPABASE_KEY,

                "Authorization":
                    "Bearer " +
                    SUPABASE_KEY,

                "Content-Type":
                    "application/json"

            },

            body:
                JSON.stringify({})

        }

    );


    if (!response.ok) {

        const errorText =
            await response.text();

        throw new Error(

            "Supabase API error: " +
            response.status +
            " " +
            errorText

        );

    }


    return await response.json();

}


/* =====================================================
   MAP SETTINGS
===================================================== */

const MAP_CENTER = [
    64.5853,
    41.3775
];

const START_ZOOM = 5;


/* =====================================================
   MAP
===================================================== */

const map = new maplibregl.Map({

    container: "map",

    style:
        "https://tiles.openfreemap.org/styles/liberty",

    center:
        MAP_CENTER,

    zoom:
        START_ZOOM,

    minZoom:
        4,

    maxZoom:
        19,

    attributionControl:
        true

});


map.addControl(

    new maplibregl.NavigationControl(),

    "top-right"

);


/* =====================================================
   DATA
===================================================== */

let regionsData = null;

let districtsData = null;

let selectedDistrict = null;


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* =====================================================
   LOAD DATA FROM SUPABASE
===================================================== */

async function loadNaqshaData() {

    console.log(
        "🇺🇿 Naqsha: загрузка из Supabase..."
    );


    const [

        regions,

        districts

    ] = await Promise.all([

        callSupabaseRPC(
            "get_regions_geojson"
        ),

        callSupabaseRPC(
            "get_districts_geojson"
        )

    ]);


    regionsData =
        regions;

    districtsData =
        districts;


    console.log(
        "Областей:",
        regions.features.length
    );

    console.log(
        "Районов:",
        districts.features.length
    );

}


/* =====================================================
   MAP LOAD
===================================================== */

map.on(
    "load",
    async function() {

        try {

            await loadNaqshaData();


            /* ==========================================
               REGIONS
            ========================================== */

            map.addSource(

                "naqsha-regions",

                {

                    type:
                        "geojson",

                    data:
                        regionsData

                }

            );


            map.addLayer({

                id:
                    "naqsha-region-borders",

                type:
                    "line",

                source:
                    "naqsha-regions",

                paint: {

                    "line-color":
                        "#555555",

                    "line-width": [

                        "interpolate",

                        ["linear"],

                        ["zoom"],

                        4,
                        1,

                        8,
                        1.5,

                        12,
                        2

                    ],

                    "line-opacity":
                        0.75

                }

            });


            /* ==========================================
               DISTRICTS
            ========================================== */

            map.addSource(

                "naqsha-districts",

                {

                    type:
                        "geojson",

                    data:
                        districtsData

                }

            );


            /* ==========================================
               SELECTED DISTRICT
            ========================================== */

            map.addLayer({

                id:
                    "naqsha-district-selected",

                type:
                    "fill",

                source:
                    "naqsha-districts",

                minzoom:
                    6,

                maxzoom:
                    14,

                paint: {

                    "fill-color":
                        "#18a84a",

                    "fill-opacity":
                        0.45

                },

                filter: [

                    "==",

                    [
                        "get",
                        "id"
                    ],

                    ""

                ]

            });


            /* ==========================================
               CLICK LAYER
            ========================================== */

            map.addLayer({

                id:
                    "naqsha-district-click",

                type:
                    "fill",

                source:
                    "naqsha-districts",

                minzoom:
                    5,

                maxzoom:
                    14,

                paint: {

                    "fill-color":
                        "#ffffff",

                    "fill-opacity":
                        0.001

                }

            });


            /* ==========================================
               DISTRICT BORDERS
            ========================================== */

            map.addLayer({

                id:
                    "naqsha-district-borders",

                type:
                    "line",

                source:
                    "naqsha-districts",

                minzoom:
                    6,

                paint: {

                    "line-color":
                        "#555555",

                    "line-width": [

                        "interpolate",

                        ["linear"],

                        ["zoom"],

                        6,
                        0.7,

                        9,
                        1.2,

                        13,
                        2

                    ],

                    "line-opacity":
                        0.8

                }

            });


            /* ==========================================
               DISTRICT CLICK
            ========================================== */

            map.on(

                "click",

                "naqsha-district-click",

                function(event) {

                    if (
                        !event.features ||
                        !event.features.length
                    ) {

                        return;

                    }


                    const feature =
                        event.features[0];


                    selectDistrict(
                        feature,
                        event.lngLat
                    );

                }

            );


            map.on(

                "mouseenter",

                "naqsha-district-click",

                function() {

                    map.getCanvas()
                        .style
                        .cursor =
                        "pointer";

                }

            );


            map.on(

                "mouseleave",

                "naqsha-district-click",

                function() {

                    map.getCanvas()
                        .style
                        .cursor =
                        "";

                }

            );


            /* ==========================================
               STREETS
            ========================================== */

            setupStreetInteraction();


            /* ==========================================
               BUILDINGS
            ========================================== */

            setupBuildingInteraction();


            document
                .getElementById("loading")
                .style.display =
                "none";


            console.log(
                "✅ Naqsha подключён к Supabase!"
            );

        }

        catch(error) {

            console.error(
                "NAQSHA ERROR:",
                error
            );


            document
                .getElementById("loading")
                .textContent =
                "Ошибка подключения к Naqsha";

        }

    }
);


/* =====================================================
   SELECT DISTRICT
===================================================== */

function selectDistrict(
    feature,
    lngLat
) {

    selectedDistrict =
        feature;


    const properties =
        feature.properties || {};


    const districtId =
        properties.id;


    map.setFilter(

        "naqsha-district-selected",

        [

            "==",

            [
                "get",
                "id"
            ],

            districtId

        ]

    );


    const districtName =
        properties.name ||
        "Район";


    const regionName =
        properties.region_name ||
        "Узбекистан";


    showInfo(

        "📍 " +
        districtName,

        regionName

    );


    map.flyTo({

        center: [

            lngLat.lng,
            lngLat.lat

        ],

        zoom:
            Math.max(
                map.getZoom(),
                8
            ),

        speed:
            0.8

    );

}


/* =====================================================
   INFO
===================================================== */

function showInfo(
    title,
    body
) {

    document
        .getElementById(
            "infoTitle"
        )
        .textContent =
        title;


    document
        .getElementById(
            "infoBody"
        )
        .innerHTML =
        escapeHTML(body);


    document
        .getElementById(
            "infoPanel"
        )
        .style.display =
        "block";

}


function closeInfo() {

    document
        .getElementById(
            "infoPanel"
        )
        .style.display =
        "none";

}


/* =====================================================
   STREET LAYERS
===================================================== */

function getStreetLayerIds() {

    return (

        map.getStyle().layers || []

    )

    .filter(

        layer =>

            layer.source ===
                "openmaptiles"

            &&

            (

                layer[
                    "source-layer"
                ] ===
                    "transportation"

                ||

                layer[
                    "source-layer"
                ] ===
                    "transportation_name"

            )

    )

    .map(
        layer => layer.id
    );

}


function setupStreetInteraction() {

    const layers =
        getStreetLayerIds();


    console.log(
        "🛣️ Улицы:",
        layers
    );


    layers.forEach(

        layerId => {

            map.on(

                "mouseenter",

                layerId,

                function() {

                    if (
                        map.getZoom() >= 10
                    ) {

                        map.getCanvas()
                            .style
                            .cursor =
                            "pointer";

                    }

                }

            );


            map.on(

                "mouseleave",

                layerId,

                function() {

                    map.getCanvas()
                        .style
                        .cursor =
                        "";

                }

            );


            map.on(

                "click",

                layerId,

                function(event) {

                    if (
                        map.getZoom() < 10
                    ) {

                        return;

                    }


                    if (
                        !event.features ||
                        !event.features.length
                    ) {

                        return;

                    }


                    showStreetInfo(
                        event.features[0]
                    );

                }

            );

        }

    );

}


/* =====================================================
   STREET INFO
===================================================== */

function showStreetInfo(
    feature
) {

    const properties =
        feature.properties || {};


    const name =

        properties.name ||

        properties["name:ru"] ||

        properties["name:latin"] ||

        properties.name_en ||

        properties.ref ||

        "Улица без названия";


    let type =

        properties.class ||

        properties.subclass ||

        "улица";


    const typeNames = {

        motorway:
            "Автомагистраль",

        trunk:
            "Главная дорога",

        primary:
            "Главная улица",

        secondary:
            "Улица",

        tertiary:
            "Улица",

        residential:
            "Жилая улица",

        service:
            "Проезд",

        pedestrian:
            "Пешеходная улица",

        track:
            "Дорога",

        path:
            "Тропа"

    };


    type =
        typeNames[type] ||
        type;


    showInfo(

        "🛣️ " +
        name,

        "Тип: " +
        type

    );

}


/* =====================================================
   BUILDINGS
===================================================== */

function getBuildingLayerIds() {

    return (

        map.getStyle().layers || []

    )

    .filter(

        layer =>

            layer.source ===
                "openmaptiles"

            &&

            layer[
                "source-layer"
            ] ===
                "building"

    )

    .map(
        layer => layer.id
    );

}


function setupBuildingInteraction() {

    const layers =
        getBuildingLayerIds();


    console.log(
        "🏠 Здания:",
        layers
    );


    layers.forEach(

        layerId => {

            map.on(

                "mouseenter",

                layerId,

                function() {

                    if (
                        map.getZoom() >= 13
                    ) {

                        map.getCanvas()
                            .style
                            .cursor =
                            "pointer";

                    }

                }

            );


            map.on(

                "mouseleave",

                layerId,

                function() {

                    map.getCanvas()
                        .style
                        .cursor =
                        "";

                }

            );


            map.on(

                "click",

                layerId,

                function(event) {

                    if (
                        map.getZoom() < 13
                    ) {

                        return;

                    }


                    if (
                        !event.features ||
                        !event.features.length
                    ) {

                        return;

                    }


                    showBuildingInfo(
                        event.features[0]
                    );

                }

            );

        }

    );

}


/* =====================================================
   BUILDING INFO
===================================================== */

function showBuildingInfo(
    feature
) {

    const properties =
        feature.properties || {};


    const street =

        properties["addr:street"] ||

        properties.street ||

        properties["name:ru"] ||

        properties.name ||

        null;


    const houseNumber =

        properties["addr:housenumber"] ||

        properties.housenumber ||

        properties.house_number ||

        null;


    let html = "";


    if (street) {

        html +=
            "Улица: " +
            escapeHTML(street);

    }


    if (houseNumber) {

        if (html) {

            html += "<br>";

        }


        html +=
            "Дом: " +
            escapeHTML(
                houseNumber
            );

    }


    if (!html) {

        html =
            "Информация об адресе пока отсутствует.";

    }


    document
        .getElementById(
            "infoTitle"
        )
        .textContent =
        "🏠 Здание";


    document
        .getElementById(
            "infoBody"
        )
        .innerHTML =
        html;


    document
        .getElementById(
            "infoPanel"
        )
        .style.display =
        "block";

}


/* =====================================================
   SEARCH
===================================================== */

const searchInput =
    document.getElementById(
        "searchInput"
    );


const searchButton =
    document.getElementById(
        "searchButton"
    );


const searchResults =
    document.getElementById(
        "searchResults"
    );


searchInput.addEventListener(

    "input",

    function() {

        showSearchResults(
            searchInput.value
        );

    }

);


searchInput.addEventListener(

    "keydown",

    function(event) {

        if (
            event.key === "Enter"
        ) {

            searchLocation();

        }

    }

);


searchButton.addEventListener(

    "click",

    searchLocation

);


/* =====================================================
   SEARCH RESULTS
===================================================== */

function showSearchResults(
    text
) {

    searchResults.innerHTML = "";


    if (!text.trim()) {

        searchResults.style.display =
            "none";

        return;

    }


    if (
        !districtsData ||
        !districtsData.features
    ) {

        return;

    }


    const query =
        text.toLowerCase();


    const results =

        districtsData.features

        .filter(

            feature => {

                const name =
                    feature.properties?.name ||
                    "";

                const region =
                    feature.properties?.region_name ||
                    "";

                return (

                    name
                        .toLowerCase()
                        .includes(query)

                    ||

                    region
                        .toLowerCase()
                        .includes(query)

                );

            }

        )

        .slice(0, 10);


    if (!results.length) {

        searchResults.style.display =
            "none";

        return;

    }


    results.forEach(

        feature => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "search-result";


            const name =
                feature.properties.name;


            const region =
                feature.properties.region_name ||
                "";


            item.textContent =

                "📍 " +
                name +
                (
                    region
                        ? " — " + region
                        : ""
                );


            item.addEventListener(

                "click",

                function() {

                    searchInput.value =
                        name;


                    searchResults.style.display =
                        "none";


                    selectDistrictFromSearch(
                        feature
                    );

                }

            );


            searchResults.appendChild(
                item
            );

        }

    );


    searchResults.style.display =
        "block";

}


/* =====================================================
   SELECT FROM SEARCH
===================================================== */

function selectDistrictFromSearch(
    feature
) {

    const center =
        getFeatureCenter(
            feature
        );


    if (!center) {

        return;

    }


    selectDistrict(

        feature,

        {
            lng:
                center[0],

            lat:
                center[1]

        }

    );

}


/* =====================================================
   SEARCH LOCATION
===================================================== */

async function searchLocation() {

    const query =
        searchInput.value.trim();


    if (!query) {

        return;

    }


    /* ==========================================
       СНАЧАЛА РАЙОНЫ ИЗ SUPABASE
    ========================================== */

    if (
        districtsData &&
        districtsData.features
    ) {

        const district =

            districtsData.features.find(

                feature => {

                    const name =
                        feature.properties?.name ||
                        "";

                    return (

                        name.toLowerCase() ===
                        query.toLowerCase()

                    );

                }

            );


        if (district) {

            selectDistrictFromSearch(
                district
            );

            return;

        }

    }


    /* ==========================================
       NOMINATIM
    ========================================== */

    try {

        const url =

            "https://nominatim.openstreetmap.org/search" +

            "?format=jsonv2" +

            "&limit=5" +

            "&countrycodes=uz" +

            "&accept-language=ru" +

            "&q=" +

            encodeURIComponent(query);


        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                "Nominatim error"
            );

        }


        const results =
            await response.json();


        if (!results.length) {

            showInfo(

                "🔎 Ничего не найдено",

                "Попробуйте изменить запрос."

            );

            return;

        }


        const result =
            results[0];


        const lat =
            Number(result.lat);


        const lon =
            Number(result.lon);


        map.flyTo({

            center: [

                lon,
                lat

            ],

            zoom:
                16,

            speed:
                1

        });


        setTimeout(

            function() {

                showInfo(

                    "📍 " +
                    (
                        result.name ||
                        query
                    ),

                    result.display_name ||
                    "Адрес найден"

                );

            },

            700

        );

    }

    catch(error) {

        console.error(
            error
        );


        showInfo(

            "Ошибка поиска",

            "Не удалось выполнить поиск."

        );

    }

}


/* =====================================================
   FEATURE CENTER
===================================================== */

function getFeatureCenter(
    feature
) {

    if (
        !feature ||
        !feature.geometry
    ) {

        return null;

    }


    const coordinates = [];


    function collect(value) {

        if (
            !Array.isArray(value)
        ) {

            return;

        }


        if (
            typeof value[0] ===
            "number"
        ) {

            coordinates.push(
                value
            );

            return;

        }


        value.forEach(
            collect
        );

    }


    collect(
        feature.geometry.coordinates
    );


    if (!coordinates.length) {

        return null;

    }


    let lng = 0;

    let lat = 0;


    coordinates.forEach(

        point => {

            lng +=
                Number(point[0]);

            lat +=
                Number(point[1]);

        }

    );


    return [

        lng /
            coordinates.length,

        lat /
            coordinates.length

    ];

}


/* =====================================================
   CLOSE SEARCH
===================================================== */

document.addEventListener(

    "click",

    function(event) {

        if (
            !event.target.closest(
                ".search-box"
            )
        ) {

            searchResults.style.display =
                "none";

        }

    }

);


/* =====================================================
   ESC
===================================================== */

document.addEventListener(

    "keydown",

    function(event) {

        if (
            event.key === "Escape"
        ) {

            closeInfo();

        }

    }

);
