<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>UZMAP — Карта Узбекистана</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

<script src="./district-names-ru.js"></script>


<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#map {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}


/* =========================
   ЛОГО
========================= */

.logo {

    position: absolute;

    z-index: 20;

    top: 20px;
    left: 20px;

    background: white;

    padding: 17px 25px;

    border-radius: 20px;

    font-size: 27px;

    font-weight: 700;

    box-shadow:
        0 4px 18px rgba(0,0,0,0.18);

    user-select: none;
}


/* =========================
   ПОИСК
========================= */

.search-box {

    position: absolute;

    z-index: 20;

    top: 100px;

    left: 18px;
    right: 18px;

    max-width: 680px;

    margin: auto;

    background: white;

    border-radius: 20px;

    display: flex;

    align-items: center;

    box-shadow:
        0 4px 20px rgba(0,0,0,0.18);
}

.search-icon {

    font-size: 27px;

    padding-left: 18px;
}

#searchInput {

    flex: 1;

    border: none;

    outline: none;

    background: transparent;

    font-size: 21px;

    padding: 20px 10px;
}

#searchInput::placeholder {

    color: #999;
}

#searchButton {

    border: none;

    background: transparent;

    font-size: 28px;

    padding: 12px 18px;

    cursor: pointer;
}


/* =========================
   ПОДСКАЗКИ
========================= */

#suggestions {

    position: absolute;

    z-index: 50;

    left: 0;
    right: 0;

    top: calc(100% + 8px);

    background: white;

    border-radius: 16px;

    box-shadow:
        0 5px 25px rgba(0,0,0,0.2);

    display: none;

    overflow: hidden;

    max-height: 330px;

    overflow-y: auto;
}

.suggestion {

    padding: 15px 20px;

    border-bottom: 1px solid #eee;

    font-size: 18px;

    cursor: pointer;
}

.suggestion:hover {

    background: #f2f2f2;
}


/* =========================
   POPUP
========================= */

.maplibregl-popup-content {

    padding: 0 !important;

    border-radius: 15px;

    overflow: hidden;

    box-shadow:
        0 5px 25px rgba(0,0,0,0.25);
}

.district-popup {

    min-width: 250px;

    max-width: 350px;

    position: relative;
}

.popup-header {

    padding: 19px 22px 12px;

    font-size: 21px;

    font-weight: 700;

    padding-right: 45px;
}

.popup-body {

    padding: 8px 22px 20px;

    font-size: 17px;

    line-height: 1.5;
}

.popup-close {

    position: absolute;

    right: 10px;

    top: 7px;

    border: none;

    background: transparent;

    color: #1683ff;

    font-size: 27px;

    cursor: pointer;
}


/* =========================
   ЗАГРУЗКА
========================= */

#loading {

    position: absolute;

    z-index: 100;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    background: white;

    padding: 18px 25px;

    border-radius: 16px;

    box-shadow:
        0 5px 25px rgba(0,0,0,0.2);

    font-size: 17px;
}


/* =========================
   ОШИБКА
========================= */

#errorBox {

    position: absolute;

    z-index: 100;

    left: 20px;
    right: 20px;

    bottom: 20px;

    background: white;

    color: #b00020;

    padding: 17px 20px;

    border-radius: 15px;

    box-shadow:
        0 5px 25px rgba(0,0,0,0.25);

    display: none;

    font-size: 15px;
}


@media (max-width: 600px) {

    .logo {

        top: 18px;
        left: 18px;

        font-size: 25px;

        padding: 16px 22px;
    }

    .search-box {

        top: 100px;

        left: 15px;
        right: 15px;
    }

    #searchInput {

        font-size: 20px;

        padding: 18px 8px;
    }

    .search-icon {

        font-size: 25px;

        padding-left: 14px;
    }

}

</style>

</head>


<body>


<div id="map"></div>


<div class="logo">
🇺🇿 UZMAP
</div>


<div class="search-box">

    <div class="search-icon">
        🔎
    </div>

    <input
        id="searchInput"
        type="text"
        placeholder="Найти место..."
        autocomplete="off"
    >

    <button
        id="searchButton"
        type="button"
    >
        🔍
    </button>

    <div id="suggestions"></div>

</div>


<div id="loading">
    Загрузка карты...
</div>


<div id="errorBox"></div>


<script>


/* =====================================================
   ОСНОВНЫЕ НАСТРОЙКИ
===================================================== */

const CENTER = [64.5853, 41.3775];

const START_ZOOM = 5;


/* =====================================================
   СОЗДАЁМ КАРТУ
===================================================== */

const map = new maplibregl.Map({

    container: "map",

    style: {

        version: 8,

        sources: {

            osm: {

                type: "raster",

                tiles: [
                    "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
                ],

                tileSize: 256,

                attribution:
                    "© OpenStreetMap contributors"
            }

        },

        layers: [

            {

                id: "osm",

                type: "raster",

                source: "osm"

            }

        ]

    },

    center: CENTER,

    zoom: START_ZOOM,

    minZoom: 4,

    maxZoom: 17

});


/* =====================================================
   НАВИГАЦИЯ
===================================================== */

map.addControl(

    new maplibregl.NavigationControl(),

    "top-right"

);


/* =====================================================
   ГЛОБАЛЬНЫЕ ДАННЫЕ
===================================================== */

let districtData = null;

let regionData = null;

let cityData = null;

let selectedDistrictId = null;


/* =====================================================
   ПОКАЗ ОШИБКИ
===================================================== */

function showError(text) {

    console.error(text);

    const box =
        document.getElementById("errorBox");

    box.textContent = text;

    box.style.display = "block";

}


/* =====================================================
   ЗАГРУЗКА JSON
===================================================== */

async function loadJSON(file) {

    const response =
        await fetch("./" + file);

    if (!response.ok) {

        throw new Error(
            file + " не найден."
        );

    }

    return await response.json();

}


/* =====================================================
   ПОЛУЧЕНИЕ НАЗВАНИЯ
===================================================== */

function getOriginalName(properties) {

    if (!properties) {
        return "";
    }

    return String(

        properties.shapeName ||

        properties.NAME_2 ||

        properties.name ||

        properties.NAME ||

        properties.Name ||

        properties.NAME_EN ||

        ""

    ).trim();

}


/* =====================================================
   РУССКОЕ НАЗВАНИЕ РАЙОНА
===================================================== */

function getRussianName(properties) {

    const original =
        getOriginalName(properties);

    if (!original) {

        return "Район";

    }


    const withoutDistrict =

        original

            .replace(
                /\s+District$/i,
                ""
            )

            .trim();


    if (
        typeof DISTRICT_NAMES_RU !==
        "undefined"
    ) {

        if (
            DISTRICT_NAMES_RU[original]
        ) {

            return DISTRICT_NAMES_RU[original];

        }


        if (
            DISTRICT_NAMES_RU[
                withoutDistrict
            ]
        ) {

            return DISTRICT_NAMES_RU[
                withoutDistrict
            ];

        }


        const found =

            Object.keys(
                DISTRICT_NAMES_RU
            ).find(

                key =>

                    key.toLowerCase() ===
                    withoutDistrict.toLowerCase()

            );


        if (found) {

            return DISTRICT_NAMES_RU[
                found
            ];

        }

    }


    return original;

}


/* =====================================================
   ОБЛАСТЬ
===================================================== */

function getRegionName(properties) {

    if (!properties) {

        return "Узбекистан";

    }


    return (

        properties.region ||

        properties.REGION ||

        properties.NAME_1 ||

        properties.name_1 ||

        properties.parent ||

        "Узбекистан"

    );

}


/* =====================================================
   СОЗДАЁМ УНИКАЛЬНЫЕ ID ДЛЯ РАЙОНОВ
===================================================== */

function prepareDistricts(data) {

    const copy = {

        type: "FeatureCollection",

        features: []

    };


    data.features.forEach(

        (feature, index) => {

            const newFeature = {

                type: "Feature",

                id: "district-" + index,

                properties: {
                    ...(feature.properties || {})
                },

                geometry:
                    feature.geometry

            };


            newFeature.properties._uzmap_id =
                "district-" + index;


            copy.features.push(
                newFeature
            );

        }

    );


    return copy;

}


/* =====================================================
   СОЗДАЁМ УНИКАЛЬНЫЕ ID ДЛЯ ОБЛАСТЕЙ
===================================================== */

function prepareRegions(data) {

    const copy = {

        type: "FeatureCollection",

        features: []

    };


    data.features.forEach(

        (feature, index) => {

            const newFeature = {

                type: "Feature",

                id: "region-" + index,

                properties: {
                    ...(feature.properties || {})
                },

                geometry:
                    feature.geometry

            };


            copy.features.push(
                newFeature
            );

        }

    );


    return copy;

}


/* =====================================================
   ЗАГРУЖАЕМ ДАННЫЕ
===================================================== */

map.on(
    "load",
    async function() {

        try {

            console.log(
                "Начинаем загрузку данных..."
            );


            const [

                districts,

                regions,

                cities

            ] = await Promise.all([

                loadJSON(
                    "uzbekistan-districts.geojson"
                ),

                loadJSON(
                    "uzbekistan-regions.geojson"
                ),

                loadJSON(
                    "uzbekistan-cities.geojson"
                )

            ]);


            districtData =
                prepareDistricts(
                    districts
                );


            regionData =
                prepareRegions(
                    regions
                );


            cityData =
                cities;


            console.log(
                "Районов:",
                districtData.features.length
            );


            console.log(
                "Областей:",
                regionData.features.length
            );


            console.log(
                "Городов:",
                cityData.features.length
            );


            /* =========================================
               SOURCE ОБЛАСТЕЙ
            ========================================= */

            map.addSource(
                "regions",
                {

                    type: "geojson",

                    data: regionData

                }
            );


            /* =========================================
               ГРАНИЦЫ ОБЛАСТЕЙ
            ========================================= */

            map.addLayer({

                id: "region-boundaries",

                type: "line",

                source: "regions",

                paint: {

                    "line-color": "#555555",

                    "line-width": [

                        "interpolate",

                        ["linear"],

                        ["zoom"],

                        4, 1.2,

                        7, 1.5,

                        12, 2

                    ],

                    "line-opacity": 0.75

                }

            });


            /* =========================================
               SOURCE РАЙОНОВ
            ========================================= */

            map.addSource(

                "districts",

                {

                    type: "geojson",

                    data: districtData

                }

            );


            /* =========================================
               ПРОЗРАЧНАЯ ЗОНА РАЙОНОВ
               
               ОНА НЕ ЗЕЛЁНАЯ.
               
               Она нужна ТОЛЬКО для клика.
            ========================================= */

            map.addLayer({

                id: "district-click-area",

                type: "fill",

                source: "districts",

                paint: {

                    "fill-color": "#ffffff",

                    "fill-opacity": 0

                }

            });


            /* =========================================
               ГРАНИЦЫ РАЙОНОВ
            ========================================= */

            map.addLayer({

                id: "district-boundaries",

                type: "line",

                source: "districts",

                paint: {

                    "line-color": "#555555",

                    "line-width": [

                        "interpolate",

                        ["linear"],

                        ["zoom"],

                        4, 0.7,

                        7, 1,

                        10, 1.3,

                        14, 1.8

                    ],

                    "line-opacity": 0.8

                }

            });


            /* =========================================
               ВЫБРАННЫЙ РАЙОН
               
               ВАЖНО:
               ИЗНАЧАЛЬНО ПОЛНОСТЬЮ ПРОЗРАЧНЫЙ.
            ========================================= */

            map.addLayer({

                id: "district-selected",

                type: "fill",

                source: "districts",

                paint: {

                    "fill-color": "#16a34a",

                    "fill-opacity": 0.55

                },

                filter: [

                    "==",

                    ["get", "_uzmap_id"],

                    ""

                ]

            });


            /* =========================================
               КОНТУР ВЫБРАННОГО РАЙОНА
            ========================================= */

            map.addLayer({

                id: "district-selected-outline",

                type: "line",

                source: "districts",

                paint: {

                    "line-color": "#087f23",

                    "line-width": 3

                },

                filter: [

                    "==",

                    ["get", "_uzmap_id"],

                    ""

                ]

            });


            /* =========================================
               ГОРОДА
            ========================================= */

            if (
                cityData &&
                cityData.features
            ) {

                map.addSource(

                    "cities",

                    {

                        type: "geojson",

                        data: cityData

                    }

                );


                map.addLayer({

                    id: "cities-points",

                    type: "circle",

                    source: "cities",

                    paint: {

                        "circle-radius": [

                            "interpolate",

                            ["linear"],

                            ["zoom"],

                            4, 2,

                            7, 4,

                            10, 6

                        ],

                        "circle-color": "#ffffff",

                        "circle-stroke-color": "#111111",

                        "circle-stroke-width": 2

                    }

                });

            }


            /* =========================================
               КЛИК ПО РАЙОНУ
            ========================================= */

            map.on(

                "click",

                "district-click-area",

                handleDistrictClick

            );


            map.on(

                "mouseenter",

                "district-click-area",

                function() {

                    map.getCanvas().style.cursor =
                        "pointer";

                }

            );


            map.on(

                "mouseleave",

                "district-click-area",

                function() {

                    map.getCanvas().style.cursor =
                        "";

                }

            );


            /* =========================================
               КЛИК ПО ГОРОДУ
            ========================================= */

            map.on(

                "click",

                "cities-points",

                function(event) {

                    if (
                        !event.features ||
                        !event.features.length
                    ) {

                        return;

                    }


                    const feature =
                        event.features[0];


                    const properties =
                        feature.properties || {};


                    const name =

                        properties.name ||

                        properties.NAME ||

                        properties.Name ||

                        "Город";


                    new maplibregl.Popup({

                        offset: 12,

                        maxWidth: "320px"

                    })

                        .setLngLat(
                            event.lngLat
                        )

                        .setHTML(

                            `
                            <div class="district-popup">

                                <div class="popup-header">
                                    🏙️ ${escapeHTML(name)}
                                </div>

                                <div class="popup-body">
                                    Город Узбекистана
                                </div>

                            </div>
                            `

                        )

                        .addTo(map);

                }

            );


            /* =========================================
               ГОТОВО
            ========================================= */

            document
                .getElementById("loading")
                .style.display = "none";


            console.log(
                "🇺🇿 UZMAP готов."
            );

        }

        catch(error) {

            console.error(error);

            document
                .getElementById("loading")
                .style.display = "none";


            showError(
                "Ошибка загрузки карты: " +
                error.message
            );

        }

    }
);


/* =====================================================
   КЛИК ПО РАЙОНУ
===================================================== */

function handleDistrictClick(event) {

    if (
        !event.features ||
        !event.features.length
    ) {

        return;

    }


    const feature =
        event.features[0];


    const properties =
        feature.properties || {};


    const id =
        properties._uzmap_id;


    if (!id) {

        console.error(
            "У района отсутствует ID",
            feature
        );

        return;

    }


    selectedDistrictId =
        id;


    console.log(
        "Выбран район:",
        id
    );


    /* =========================================
       СНИМАЕМ ПРЕДЫДУЩУЮ ПОДСВЕТКУ
    ========================================= */

    map.setFilter(

        "district-selected",

        [

            "==",

            ["get", "_uzmap_id"],

            id

        ]

    );


    map.setFilter(

        "district-selected-outline",

        [

            "==",

            ["get", "_uzmap_id"],

            id

        ]

    );


    /* =========================================
       НАЗВАНИЯ
    ========================================= */

    const russianName =
        getRussianName(
            properties
        );


    const regionName =
        getRegionName(
            properties
        );


    /* =========================================
       POPUP
    ========================================= */

    const html = `

        <div class="district-popup">

            <button
                class="popup-close"
                onclick="closeAllPopups()"
            >
                ×
            </button>

            <div class="popup-header">

                📍 ${escapeHTML(russianName)}

            </div>

            <div class="popup-body">

                Область:
                ${escapeHTML(regionName)}

            </div>

        </div>

    `;


    closeAllPopups();


    new maplibregl.Popup({

        closeButton: false,

        closeOnClick: false,

        offset: 15,

        maxWidth: "380px"

    })

        .setLngLat(
            event.lngLat
        )

        .setHTML(html)

        .addTo(map);

}


/* =====================================================
   ЗАКРЫТЬ POPUP
===================================================== */

function closeAllPopups() {

    document
        .querySelectorAll(
            ".maplibregl-popup"
        )
        .forEach(
            popup =>
                popup.remove()
        );

}


/* =====================================================
   HTML SECURITY
===================================================== */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   ПОИСК
===================================================== */

const searchInput =
    document.getElementById(
        "searchInput"
    );


const searchButton =
    document.getElementById(
        "searchButton"
    );


const suggestions =
    document.getElementById(
        "suggestions"
    );


/* =====================================================
   ПОКАЗ ПОДСКАЗОК
===================================================== */

function updateSuggestions() {

    const text =
        searchInput.value
            .trim()
            .toLowerCase();


    suggestions.innerHTML = "";


    if (!text) {

        suggestions.style.display =
            "none";

        return;

    }


    if (
        !districtData ||
        !districtData.features
    ) {

        return;

    }


    const results =

        districtData.features

            .filter(feature => {

                const properties =
                    feature.properties || {};


                const original =
                    getOriginalName(
                        properties
                    ).toLowerCase();


                const russian =
                    getRussianName(
                        properties
                    ).toLowerCase();


                return (

                    original.includes(text) ||

                    russian.includes(text)

                );

            })

            .slice(0, 10);


    if (!results.length) {

        suggestions.style.display =
            "none";

        return;

    }


    results.forEach(feature => {

        const item =
            document.createElement(
                "div"
            );


        item.className =
            "suggestion";


        item.textContent =
            getRussianName(
                feature.properties
            );


        item.addEventListener(

            "click",

            function() {

                searchInput.value =
                    item.textContent;

                suggestions.style.display =
                    "none";


                focusDistrict(
                    feature
                );

            }

        );


        suggestions.appendChild(
            item
        );

    });


    suggestions.style.display =
        "block";

}


searchInput.addEventListener(

    "input",

    updateSuggestions

);


/* =====================================================
   ENTER
===================================================== */

searchInput.addEventListener(

    "keydown",

    function(event) {

        if (
            event.key === "Enter"
        ) {

            searchDistrict();

        }

    }

);


/* =====================================================
   КНОПКА ПОИСКА
===================================================== */

searchButton.addEventListener(

    "click",

    searchDistrict

);


/* =====================================================
   ПОИСК РАЙОНА
===================================================== */

function searchDistrict() {

    const text =
        searchInput.value
            .trim()
            .toLowerCase();


    if (!text) {

        return;

    }


    if (
        !districtData ||
        !districtData.features
    ) {

        return;

    }


    const feature =

        districtData.features.find(

            feature => {

                const properties =
                    feature.properties || {};


                const original =
                    getOriginalName(
                        properties
                    ).toLowerCase();


                const russian =
                    getRussianName(
                        properties
                    ).toLowerCase();


                return (

                    original === text ||

                    russian === text

                );

            }

        );


    if (feature) {

        suggestions.style.display =
            "none";

        focusDistrict(feature);

    }
    else {

        updateSuggestions();

    }

}


/* =====================================================
   ПЕРЕЙТИ К РАЙОНУ
===================================================== */

function focusDistrict(feature) {

    if (
        !feature ||
        !feature.geometry
    ) {

        return;

    }


    const bounds =
        new maplibregl.LngLatBounds();


    addGeometryToBounds(

        feature.geometry.coordinates,

        bounds

    );


    if (
        bounds.isEmpty()
    ) {

        return;

    }


    map.fitBounds(

        bounds,

        {

            padding: 80,

            duration: 1000,

            maxZoom: 10

        }

    );


    setTimeout(

        function() {

            const center =
                bounds.getCenter();


            handleDistrictClick({

                lngLat: center,

                features: [
                    feature
                ]

            });

        },

        1100

    );

}


/* =====================================================
   ПОЛУЧИТЬ BOUNDS
===================================================== */

function addGeometryToBounds(
    coordinates,
    bounds
) {

    if (
        !Array.isArray(coordinates)
    ) {

        return;

    }


    if (
        coordinates.length >= 2 &&

        typeof coordinates[0] ===
        "number" &&

        typeof coordinates[1] ===
        "number"

    ) {

        bounds.extend(
            coordinates
        );

        return;

    }


    coordinates.forEach(

        item =>

            addGeometryToBounds(
                item,
                bounds
            )

    );

}

   ЗАКРЫТИЕ ПОДСКАЗОК
===================================================== */

document.addEventListener(

    "click",

    function(event) {

        if (
            !event.target.closest(
                ".search-box"
            )
        ) {

            suggestions.style.display =
                "none";

        }

    }

);


</script>
