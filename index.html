<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://vhrhtykcrjqqiwwggomi.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_N9MAdF7_GW-IUFOXxY2MHQ_MG1ep1vg";


/* =====================================================
   MAP
===================================================== */

const MAP_CENTER = [
    64.5853,
    41.3775
];

const START_ZOOM = 5;


/* =====================================================
   DATA
===================================================== */

let regionsData = null;

let districtsData = null;

let citiesData = null;

let selectedDistrict = null;

let selectedCity = null;

let dynamicLayers = [];


/* =====================================================
   SUPABASE RPC
===================================================== */

async function supabaseRPC(
    functionName
) {

    console.log(
        "Supabase RPC:",
        functionName
    );

    const response = await fetch(

        SUPABASE_URL +
        "/rest/v1/rpc/" +
        functionName,

        {

            method: "POST",

            headers: {

                "apikey":
                    SUPABASE_KEY,

                "Authorization":
                    "Bearer " +
                    SUPABASE_KEY,

                "Content-Type":
                    "application/json",

                "Accept":
                    "application/json"
            },

            body: "{}"
        }
    );


    if (!response.ok) {

        const errorText =
            await response.text();

        console.error(
            "Supabase RPC error:",
            functionName,
            response.status,
            errorText
        );

        throw new Error(
            "Supabase RPC " +
            functionName +
            " → HTTP " +
            response.status
        );
    }


    return await response.json();
}


/* =====================================================
   NORMALIZE
===================================================== */

function normalizeSearchText(
    text
) {

    return String(text || "")

        .toLowerCase()

        .trim()

        .replace(
            /district/g,
            ""
        )

        .replace(
            /район/g,
            ""
        )

        .replace(
            /область/g,
            ""
        )

        .replace(
            /город/g,
            ""
        )

        .replace(
            /['’`]/g,
            ""
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();
}


/* =====================================================
   SEARCH ALIASES
===================================================== */

const SEARCH_ALIASES = {

    mingbuloq:
        "mingbulak",

    mingbulak:
        "mingbulak",

    tashkent:
        "tashkent",

    toshkent:
        "tashkent",

    andijan:
        "andijan",

    andijon:

    bukhara:
        "bukhara",

    buxoro:

    samarkand:
        "samarkand",

    samarqand:
        "samarkand",

    jizzakh:
        "jizzakh",

    jizzax:
        "jizzakh",

    kashkadarya:
        "kashkadarya",

    qashqadaryo:
        "kashkadarya",

    surkhandarya:
        "surkhandarya",

    surxondaryo:
        "surkhandarya"
};


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    value
) {

    return String(value ?? "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


/* =====================================================
   FEATURE CENTER
===================================================== */

function getFeatureCenter(
    feature
) {

    if (
        !feature ||
        !feature.geometry
    ) {

        return null;
    }


    const geometry =
        feature.geometry;


    let coordinates = [];


    function collect(
        value
    ) {

        if (
            typeof value[0] ===
            "number"
        ) {

            coordinates.push(value);

            return;
        }


        value.forEach(
            collect
        );
    }


    try {

        collect(
            geometry.coordinates
        );

    } catch {

        return null;
    }


    if (!coordinates.length) {

        return null;
    }


    let lng = 0;
    let lat = 0;


    coordinates.forEach(
        point => {

            lng +=
                Number(point[0]);

            lat +=
                Number(point[1]);
        }
    );


    return [

        lng / coordinates.length,

        lat / coordinates.length
    ];
}


/* =====================================================
   LOAD NAQSHA DATA
===================================================== */

async function loadNaqshaData() {

    regionsData =
        await supabaseRPC(
            "get_regions_geojson"
        );

    districtsData =
        await supabaseRPC(
            "get_districts_geojson"
        );

    citiesData =
        await supabaseRPC(
            "get_cities_geojson"
        );


    if (
        !regionsData ||
        regionsData.type !==
            "FeatureCollection"
    ) {

        throw new Error(
            "get_regions_geojson вернул неправильный формат."
        );
    }


    if (
        !districtsData ||
        districtsData.type !==
            "FeatureCollection"
    ) {

        throw new Error(
            "get_districts_geojson вернул неправильный формат."
        );
    }


    if (
        !citiesData ||
        citiesData.type !==
            "FeatureCollection"
    ) {

        throw new Error(
            "get_cities_geojson вернул неправильный формат."
        );
    }


    console.log(
        "Областей:",
        regionsData.features.length
    );

    console.log(
        "Районов:",
        districtsData.features.length
    );

    console.log(
        "Городов:",
        citiesData.features.length
    );


    regionsData.features =
        regionsData.features.filter(
            function(feature) {

                return (
                    feature &&
                    feature.geometry &&
                    feature.geometry.coordinates
                );
            }
        );


    districtsData.features =
        districtsData.features.filter(
            function(feature) {

                return (
                    feature &&
                    feature.geometry &&
                    feature.geometry.coordinates
                );
            }
        );


    citiesData.features =
        citiesData.features.filter(
            function(feature) {

                return (
                    feature &&
                    feature.geometry &&
                    feature.geometry.coordinates
                );
            }
        );
}


/* =====================================================
   LOAD DYNAMIC LAYERS
===================================================== */

async function loadDynamicLayers() {

    console.log(
        "Загрузка активных слоёв..."
    );


    const response =
        await fetch(

            SUPABASE_URL +
            "/rest/v1/rpc/get_active_map_layers",

            {

                method: "POST",

                headers: {

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " +
                        SUPABASE_KEY,

                    "Content-Type":
                        "application/json",

                    "Accept":
                        "application/json"
                },

                body: "{}"
            }
        );


    if (!response.ok) {

        const text =
            await response.text();

        throw new Error(
            "Не удалось получить активные слои: " +
            text
        );
    }


    const layers =
        await response.json();


    console.log(
        "Активные слои:",
        layers
    );


    if (
        !Array.isArray(layers)
    ) {

        return;
    }


    for (
        const layer of layers
    ) {

        try {

            await addDynamicLayer(
                layer
            );

        } catch (error) {

            console.error(
                "Ошибка слоя:",
                layer,
                error
            );
        }
    }
}


/* =====================================================
   ADD DYNAMIC LAYER
===================================================== */

async function addDynamicLayer(
    layer
) {

    if (
        !layer ||
        !layer.file_path
    ) {

        return;
    }


    const url =

        SUPABASE_URL +

        "/storage/v1/object/public/map-layers/" +

        layer.file_path;


    console.log(
        "Загрузка GeoJSON:",
        layer.name,
        url
    );


    const response =
        await fetch(url);


    if (!response.ok) {

        throw new Error(
            "GeoJSON HTTP " +
            response.status
        );
    }


    const geojson =
        await response.json();


    if (
        !geojson ||
        geojson.type !==
            "FeatureCollection"
    ) {

        throw new Error(
            "Файл не является FeatureCollection"
        );
    }


    const sourceId =
        "naqsha-dynamic-" +
        layer.id;


    if (
        map.getSource(sourceId)
    ) {

        return;
    }


    map.addSource(

        sourceId,

        {

            type:
                "geojson",

            data:
                geojson
        }
    );


    const geometryTypes =
        new Set();


    geojson.features
        .forEach(
            feature => {

                if (
                    feature &&
                    feature.geometry
                ) {

                    geometryTypes.add(
                        feature.geometry.type
                    );
                }
            }
        );


    /*
       POLYGON / MULTIPOLYGON
    */

    if (
        geometryTypes.has(
            "Polygon"
        ) ||
        geometryTypes.has(
            "MultiPolygon"
        )
    ) {

        map.addLayer({

            id:
                sourceId +
                "-fill",

            type:
                "fill",

            source:
                sourceId,

            paint: {

                "fill-color":
                    "#1677ff",

                "fill-opacity":
                    0.18
            }
        });


        map.addLayer({

            id:
                sourceId +
                "-line",

            type:
                "line",

            source:
                sourceId,

            paint: {

                "line-color":
                    "#1677ff",

                "line-width":
                    1.5,

                "line-opacity":
                    0.8
            }
        });
    }


    /*
       LINE
    */

    if (
        geometryTypes.has(
            "LineString"
        ) ||
        geometryTypes.has(
            "MultiLineString"
        )
    ) {

        map.addLayer({

            id:
                sourceId +
                "-line",

            type:
                "line",

            source:
                sourceId,

            paint: {

                "line-color":
                    "#1677ff",

                "line-width":
                    3,

                "line-opacity":
                    0.85
            }
        });
    }


    /*
       POINT
    */

    if (
        geometryTypes.has(
            "Point"
        ) ||
        geometryTypes.has(
            "MultiPoint"
        )
    ) {

        map.addLayer({

            id:
                sourceId +
                "-points",

            type:
                "circle",

            source:
                sourceId,

            paint: {

                "circle-radius":
                    6,

                "circle-color":
                    "#1677ff",

                "circle-stroke-color":
                    "#ffffff",

                "circle-stroke-width":
                    2
            }
        });
    }


    /*
       CLICKABLE LAYER
    */

    const clickableIds = [];


    if (
        map.getLayer(
            sourceId + "-fill"
        )
    ) {

        clickableIds.push(
            sourceId + "-fill"
        );
    }


    if (
        map.getLayer(
            sourceId + "-line"
        )
    ) {

        clickableIds.push(
            sourceId + "-line"
        );
    }


    if (
        map.getLayer(
            sourceId + "-points"
        )
    ) {

        clickableIds.push(
            sourceId + "-points"
        );
    }


    clickableIds.forEach(
        layerId => {

            map.on(
                "click",
                layerId,
                function(event) {

                    const feature =
                        event.features &&
                        event.features[0];


                    if (!feature) {

                        return;
                    }


                    const properties =
                        feature.properties ||
                        {};


                    let html = "";


                    Object.keys(
                        properties
                    )
                    .forEach(
                        key => {

                            const value =
                                properties[key];


                            if (
                                value ===
                                null ||
                                value ===
                                undefined ||
                                value ===
                                ""
                            ) {

                                return;
                            }


                            html +=

                                "<div>" +

                                "<b>" +

                                escapeHTML(
                                    key
                                ) +

                                ":</b> " +

                                escapeHTML(
                                    value
                                ) +

                                "</div>";
                        }
                    );


                    showInfo(

                        escapeHTML(
                            layer.name ||
                            "Объект"
                        ),

                        html ||
                        "Нет дополнительной информации."
                    );
                }
            );


            map.on(
                "mouseenter",
                layerId,
                function() {

                    map.getCanvas().style.cursor =
                        "pointer";
                }
            );


            map.on(
                "mouseleave",
                layerId,
                function() {

                    map.getCanvas().style.cursor =
                        "";
                }
            );
        }
    );


    dynamicLayers.push({
        layer,
        geojson,
        sourceId
    });


    console.log(
        "Слой подключён:",
        layer.name
    );
}


/* =====================================================
   SELECT DISTRICT
===================================================== */

function selectDistrict(
    feature,
    lngLat
) {

    selectedDistrict =
        feature;


    const properties =
        feature.properties || {};


    const districtName =
        properties.name_ru ||
        properties.name ||
        properties.shapeName ||
        properties.NAME_2 ||
        "Район";


    const regionName =
        properties.region_name ||
        properties.region ||
        properties.NAME_1 ||
        "";


    const districtId =
        properties.id ??
        properties.shapeID ??
        null;


    console.log(
        "📍 Выбран район:",
        districtName
    );


    console.log(
        "ID:",
        districtId
    );


    if (
        districtId !== null &&
        map.getLayer(
            "naqsha-district-selected"
        )
    ) {

        map.setFilter(

            "naqsha-district-selected",

            [

                "==",

                [
                    "to-string",

                    [
                        "get",
                        "id"
                    ]
                ],

                String(
                    districtId
                )
            ]
        );
    }


    showInfo(

        "📍 " +
        escapeHTML(
            districtName
        ),

        "Область: " +
        escapeHTML(
            regionName
        )
    );


    if (lngLat) {

        map.flyTo({

            center: [

                Number(
                    lngLat.lng
                ),

                Number(
                    lngLat.lat
                )
            ],

            zoom:
                Math.max(
                    map.getZoom(),
                    8
                ),

            speed:
                0.8
        });

        return;
    }


    const center =
        getFeatureCenter(
            feature
        );


    if (center) {

        map.flyTo({

            center:
                center,

            zoom:
                9,

            speed:
                0.8
        });
    }
}


/* =====================================================
   SELECT DISTRICT FROM SEARCH
===================================================== */

function selectDistrictFromSearch(
    feature
) {

    const center =
        getFeatureCenter(
            feature
        );


    if (!center) {

        console.warn(
            "Не удалось определить центр района."
        );

        return;
    }


    selectDistrict(

        feature,

        {

            lng:
                center[0],

            lat:
                center[1]
        }
    );
}

        .getElementById(
            "infoPanel"
        )

/* =====================================================
   STREET LAYERS
===================================================== */

function getStreetLayerIds() {

    const layers =
        map.getStyle().layers || [];


    return layers

        .filter(
            function(layer) {

                return (

                    layer.source ===
                        "openmaptiles"

                    &&

                    (

                        layer[
                            "source-layer"
                        ] ===
                            "transportation"

                        ||

                        layer[
                            "source-layer"
                        ] ===
                            "transportation_name"
                    )
                );
            }
        )

        .map(
            function(layer) {

                return layer.id;
            }
        );
}


/* =====================================================
   STREET INTERACTION
===================================================== */

function setupStreetInteraction() {

    const layers =
        getStreetLayerIds();


    console.log(
        "🛣️ Слои улиц:",
        layers
    );


    if (!layers.length) {

        console.warn(
            "Слои улиц не найдены."
        );

        return;
    }


    layers.forEach(
        function(layerId) {

            map.on(
                "click",
                layerId,
                function(event) {

                    if (
                        !event.features ||
                        !event.features.length
                    ) {

                        return;
                    }


                    const feature =
                        event.features[0];


                    const properties =
                        feature.properties ||
                        {};


                    const name =
                        properties.name ||
                        properties.name_en ||
                        properties.name_ru ||
                        properties.name:ru ||
                        "Улица";


                    showInfo(

                        "🛣️ " +
                        escapeHTML(
                            name
                        ),

                        "Объект карты"
                    );
                }
            );
        }
    );
}


/* =====================================================
   MAP
===================================================== */

const map =

    new maplibregl.Map({

        container:
            "map",

        style:
            "https://tiles.openfreemap.org/styles/liberty",

        center:
            MAP_CENTER,

        zoom:
            START_ZOOM,

        minZoom:
            4,

        maxZoom:
            19,

        attributionControl:
            true
    });


map.addControl(

    new maplibregl.NavigationControl(),

    "top-right"
);


/* =====================================================
   MAP LOAD
===================================================== */

map.on(

    "load",

    async function() {

        try {

            await loadNaqshaData();


            /*
               REGIONS SOURCE
            */

            map.addSource(

                "naqsha-regions",

                {

                    type:
                        "geojson",

                    data:
                        regionsData
                }
            );


            /*
               REGIONS BORDER
            */

            map.addLayer({

                id:
                    "naqsha-region-borders",

                type:
                    "line",

                source:
                    "naqsha-regions",

                paint: {

                    "line-color":
                        "#555555",

                    "line-width": [

                        "interpolate",

                        ["linear"],

                        ["zoom"],

                        4,
                        1,

                        7,
                        1.3,

                        12,
                        2
                    ],

                    "line-opacity":
                        0.75
                }
            });


            /*
               DISTRICTS SOURCE
            */

            map.addSource(

                "naqsha-districts",

                {

                    type:
                        "geojson",

                    data:
                        districtsData
                }
            );


            /*
               SELECTED DISTRICT
            */

            map.addLayer({

                id:
                    "naqsha-district-selected",

                type:
                    "fill",

                source:
                    "naqsha-districts",

                minzoom:
                    5,

                maxzoom:
                    14,

                paint: {

                    "fill-color":
                        "#18a84a",

                    "fill-opacity":
                        0.45
                },

                filter: [

                    "==",

                    [

                        "to-string",

                        [
                            "get",
                            "id"
                        ]
                    ],

                    "__NO_DISTRICT__"
                ]
            });


            /*
               DISTRICT CLICK
            */

            map.addLayer({

                id:
                    "naqsha-district-click",

                type:
                    "fill",

                source:
                    "naqsha-districts",

                minzoom:
                    5,

                maxzoom:
                    14,

                paint: {

                    "fill-color":
                        "#ffffff",

                    "fill-opacity":
                        0.001
                }
            });


            /*
               DISTRICT BORDER
            */

            map.addLayer({

                id:
                    "naqsha-district-borders",

                type:
                    "line",

                source:
                    "naqsha-districts",

                minzoom:
                    6,

                paint: {

                    "line-color":
                        "#555555",

                    "line-width": [

                        "interpolate",

                        ["linear"],

                        ["zoom"],

                        6,
                        0.7,

                        9,
                        1.2,

                        13,
                        2
                    ],

                    "line-opacity":
                        0.8
                }
            });


            /*
               CITY SOURCE
            */

            map.addSource(

                "naqsha-cities",

                {

                    type:
                        "geojson",

                    data:
                        citiesData
                }
            );


            /*
               CITY POINTS
            */

            map.addLayer({

                id:
                    "naqsha-city-points",

                type:
                    "circle",

                source:
                    "naqsha-cities",

                minzoom:
                    6,

                paint: {

                    "circle-radius": [

                        "interpolate",

                        ["linear"],

                        ["zoom"],

                        6,
                        3,

                        10,
                        5,

                        14,
                        7
                    ],

                    "circle-color":
                        "#1677ff",

                    "circle-stroke-color":
                        "#ffffff",

                    "circle-stroke-width":
                        1.5,

                    "circle-opacity":
                        0.9
                }
            });


            /*
               CITY CLICK
            */

            map.on(

                "click",

                "naqsha-city-points",

                function(event) {

                    if (
                        !event.features ||
                        !event.features.length
                    ) {

                        return;
                    }


                    const feature =
                        event.features[0];


                    selectedCity =
                        feature;


                    const p =
                        feature.properties ||
                        {};


                    const name =
                        p.name_ru ||
                        p.name ||
                        "Город";


                    const region =
                        p.region_name ||
                        p.region ||
                        "";


                    let html = "";


                    if (region) {

                        html +=

                            "<div>" +

                            "<b>Область:</b> " +

                            escapeHTML(
                                region
                            ) +

                            "</div>";
                    }


                    if (p.population) {

                        html +=

                            "<div>" +

                            "<b>Население:</b> " +

                            escapeHTML(
                                p.population
                            ) +

                            "</div>";
                    }


                    if (p.description) {

                        html +=

                            "<div style='margin-top:8px'>" +

                            escapeHTML(
                                p.description
                            ) +

                            "</div>";
                    }


                    showInfo(

                        "🏙️ " +
                        escapeHTML(
                            name
                        ),

                        html
                    );


                    map.flyTo({

                        center:
                            event.lngLat,

                        zoom:
                            Math.max(
                                map.getZoom(),
                                9
                            ),

                        speed:
                            0.8
                    });
                }
            );


            /*
               DISTRICT CLICK
            */

            map.on(

                "click",

                "naqsha-district-click",

                function(event) {

                    if (
                        !event.features ||
                        !event.features.length
                    ) {

                        return;
                    }


                    selectDistrict(

                        event.features[0],

                        event.lngLat
                    );
                }
            );


            /*
               POINTER
            */

            map.on(

                "mouseenter",

                "naqsha-district-click",

                function() {

                    map.getCanvas().style.cursor =
                        "pointer";
                }
            );


            map.on(

                "mouseleave",

                "naqsha-district-click",

                function() {

                    map.getCanvas().style.cursor =
                        "";
                }
            );


            map.on(

                "mouseenter",

                "naqsha-city-points",

                function() {

                    map.getCanvas().style.cursor =
                        "pointer";
                }
            );


            map.on(

                "mouseleave",

                "naqsha-city-points",

                function() {

                    map.getCanvas().style.cursor =
                        "";
                }
            );


            /*
               DYNAMIC SUPABASE LAYERS

               ВАЖНО:
               загружаются ПОСЛЕ основных
               областей / районов / городов.
            */

            await loadDynamicLayers();


            /*
               STREET INTERACTION
            */

            setupStreetInteraction();


            /*
               LOADING OFF
            */

            document
                .getElementById(
                    "loading"
                )
                .style.display =
                "none";


            console.log(
                "🇺🇿 Naqsha загружена."
            );


        } catch (error) {

            console.error(
                "Ошибка загрузки карты:",
                error
            );


            document
                .getElementById(
                    "loading"
                )
                .textContent =
                "❌ Ошибка загрузки карты: " +
                error.message;
        }
    }
);


/* =====================================================
   SEARCH
===================================================== */

const searchInput =
    document.getElementById(
        "searchInput"
    );

const searchResults =
    document.getElementById(
        "searchResults"
    );

const searchButton =
    document.getElementById(
        "searchButton"
    );


function getFeatureNames(
    feature
) {

    const p =
        feature.properties ||
        {};


    return [

        p.name,

        p.name_ru,

        p.name_uz,

        p.name_uz_cy,

        p.name_en,

        p.shapeName,

        p.NAME_2,

        p.NAME_1,

        p.region,

        p.region_name,

        p.district,

        p.district_name

    ].filter(Boolean);
}


function searchAll(
    query
) {

    const normalized =
        normalizeSearchText(
            query
        );


    if (!normalized) {

        return [];
    }


    const alias =
        SEARCH_ALIASES[
            normalized
        ] ||
        normalized;


    const results = [];


    /*
       DISTRICTS
    */

    if (
        districtsData &&
        districtsData.features
    ) {

        districtsData.features
            .forEach(
                feature => {

                    const names =
                        getFeatureNames(
                            feature
                        );


                    const matched =
                        names.some(
                            name => {

                                const value =
                                    normalizeSearchText(
                                        name
                                    );


                                const valueAlias =
                                    SEARCH_ALIASES[
                                        value
                                    ] ||
                                    value;


                                return (

                                    value.includes(
                                        normalized
                                    )

                                    ||

                                    valueAlias.includes(
                                        alias
                                    )
                                );
                            }
                        );


                    if (matched) {

                        results.push({

                            type:
                                "district",

                            feature
                        });
                    }
                }
            );
    }


    /*
       CITIES
    */

    if (
        citiesData &&
        citiesData.features
    ) {

        citiesData.features
            .forEach(
                feature => {

                    const names =
                        getFeatureNames(
                            feature
                        );


                    const matched =
                        names.some(
                            name => {

                                const value =
                                    normalizeSearchText(
                                        name
                                    );


                                return value.includes(
                                    normalized
                                );
                            }
                        );


                    if (matched) {

                        results.push({

                            type:
                                "city",

                            feature
                        });
                    }
                }
            );
    }


    /*
       REGIONS
    */

    if (
        regionsData &&
        regionsData.features
    ) {

        regionsData.features
            .forEach(
                feature => {

                    const names =
                        getFeatureNames(
                            feature
                        );


                    const matched =
                        names.some(
                            name => {

                                const value =
                                    normalizeSearchText(
                                        name
                                    );


                                return value.includes(
                                    normalized
                                );
                            }
                        );


                    if (matched) {

                        results.push({

                            type:
                                "region",

                            feature
                        });
                    }
                }
            );
    }


    return results.slice(
        0,
        30
    );
}


/* =====================================================
   RENDER SEARCH
===================================================== */

function renderSearch(
    query
) {

    const results =
        searchAll(
            query
        );


    searchResults.innerHTML =
        "";


    if (
        !query.trim()
    ) {

        searchResults.style.display =
            "none";

        return;
    }


    if (!results.length) {

        searchResults.innerHTML =

            "<div class='search-result'>" +

            "Ничего не найдено" +

            "</div>";

        searchResults.style.display =
            "block";

        return;
    }


    results.forEach(
        result => {

            const feature =
                result.feature;


            const p =
                feature.properties ||
                {};


            let name =
                p.name_ru ||
                p.name ||
                p.shapeName ||
                "Объект";


            let type =
                "Область";


            if (
                result.type ===
                "district"
            ) {

                type =
                    "Район";
            }


            if (
                result.type ===
                "city"
            ) {

                type =
                    "Город";
            }


            const el =
                document.createElement(
                    "div"
                );


            el.className =
                "search-result";


            el.innerHTML =

                escapeHTML(
                    name
                ) +

                "<span class='search-result-type'>" +

                type +

                "</span>";


            el.onclick =
                function() {

                    searchResults.style.display =
                        "none";

                    searchInput.value =
                        name;


                    if (
                        result.type ===
                        "district"
                    ) {

                        selectDistrictFromSearch(
                            feature
                        );

                        return;
                    }


                    const center =
                        getFeatureCenter(
                            feature
                        );


                    if (center) {

                        map.flyTo({

                            center:
                                center,

                            zoom:
                                result.type ===
                                "city"
                                    ? 10
                                    : 7,

                            speed:
                                0.8
                        });
                    }


                    showInfo(

                        result.type ===
                        "city"
                            ? "🏙️ " + name
                            : "🗺️ " + name,

                        ""
                    );
                };


            searchResults.appendChild(
                el
            );
        }
    );


    searchResults.style.display =
        "block";
}


/* =====================================================
   SEARCH EVENTS
===================================================== */

searchInput.addEventListener(

    "input",

    function() {

        renderSearch(
            this.value
        );
    }
);


searchButton.addEventListener(

    "click",

    function() {

        renderSearch(
            searchInput.value
        );
    }
);


searchInput.addEventListener(

    "keydown",

    function(event) {

        if (
            event.key ===
            "Enter"
        ) {

            renderSearch(
                searchInput.value
            );
        }
    }
);


/* =====================================================
   CLOSE SEARCH
===================================================== */

document.addEventListener(

    "click",

    function(event) {

        const box =
            document.querySelector(
                ".search-box"
            );


        if (
            box &&
            !box.contains(
                event.target
            )
        ) {

            searchResults.style.display =
                "none";
        }
    }
);

</script>
