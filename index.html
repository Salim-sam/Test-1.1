<!DOCTYPE html>
<html lang="ru">

<head>

        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Naqsha</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"

    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

    <style>

        /* ==============================

            margin: 0 auto;

            background: white;

        ============================== */

        #searchResults {
            position: absolute;

            z-index: 300;

            top: calc(100% + 7px);

            right: 0;

            background: white;

            border-radius: 14px;

            overflow: hidden;

            box-shadow:
                0 5px 22px rgba(0, 0, 0, 0.2);

            display: none;

            max-height: 320px;

            overflow-y: auto;
        }

        .search-result {
            padding: 14px 16px;

            border-bottom:

            cursor: pointer;

            font-size: 16px;
        }

        .search-result:last-child {
            border-bottom: none;
        }

        .search-result:hover {
            background: #f3f3f3;
        }

        .search-result:active {
            background: #eeeeee;
        }

        /* ==============================
           INFO PANEL
        ============================== */

        #infoPanel {
            position: absolute;

            z-index: 200;

            left: 15px;
            right: 15px;

            margin: auto;

            background: rgba(255, 255, 255, 0.98);

                0 5px 28px rgba(0, 0, 0, 0.25);

            display: none;

            right: 10px;

            width: 35px;
            height: 35px;

            border: none;

            background: transparent;

            color: #1677ff;

            font-size: 27px;

            cursor: pointer;

        .info-title {
            padding-right: 30px;

            font-size: 21px;

            font-weight: 700;

            line-height: 1.3;

            margin-bottom: 12px;
        }

        .info-body {
            font-size: 16px;

            line-height: 1.5;
        }

        /* ==============================
           LOADING
        ============================== */

        #loading {
            position: absolute;

            z-index: 500;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            background: white;

            padding: 15px 20px;

            border-radius: 14px;

            box-shadow:

    </style>
</head>


<body>

<div id="map"></div>


<div class="logo">
    🇺🇿 Naqsha
</div>


<div class="search-box">

    <div class="search-icon">
        🔎
    </div>

    <input
        id="searchInput"

    <button
        id="searchButton"
        type="button"

        🔍
    </button>

</div>

    Загрузка Naqsha...
</div>


<div id="infoPanel">

    <button
        class="info-close"
        onclick="closeInfo()"
    >
        ×
    </button>

    <div
        id="infoTitle"
        class="info-title"
    ></div>

    <div
        id="infoBody"
        class="info-body"
    ></div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://vhrhtykcrjqqiwwggomi.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_N9MAdF7_GW-IUFOXxY2MHQ_MG1ep1vg";


/* =====================================================
   SUPABASE RPC
===================================================== */

async function supabaseRPC(functionName) {

    console.log(
        "Supabase RPC:",
        functionName
    );

    const response = await fetch(

        SUPABASE_URL +
        "/rest/v1/rpc/" +
        functionName,

        {
            method: "POST",

            headers: {

                "apikey":
                    SUPABASE_KEY,

                "Authorization":
                    "Bearer " +
                    SUPABASE_KEY,

                "Content-Type":
                    "application/json",

                "Accept":
                    "application/json"
            },

            body: "{}"
        }

    );


    if (!response.ok) {

        const errorText =
            await response.text();

        console.error(
            "Supabase error:",
            response.status,
            errorText
        );

        throw new Error(
            "Supabase RPC " +
            functionName +
            " → HTTP " +
            response.status
        );
    }


    return await response.json();
}


/* =====================================================
   MAP SETTINGS
===================================================== */

const MAP_CENTER = [
    64.5853,
    41.3775
];

const START_ZOOM = 5;


/* =====================================================
   MAP
===================================================== */

const map = new maplibregl.Map({

    container:
        "map",

    style:
        "https://tiles.openfreemap.org/styles/liberty",

    center:
        MAP_CENTER,

    zoom:
        START_ZOOM,

    minZoom:
        4,

    maxZoom:
        19,

    attributionControl:
        true
});


map.on(
    "error",
    function(event) {

        console.warn(
            "MapLibre:",
            event
        );

    }
);


map.addControl(
    new maplibregl.NavigationControl(),
    "top-right"
);


/* =====================================================
   DATA
===================================================== */

let regionsData = null;

let districtsData = null;

let selectedDistrict = null;


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHTML(value) {

    return String(value || "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


/* =====================================================
   NORMALIZE SEARCH
===================================================== */

function normalizeSearchText(text) {

    return String(text || "")

        .toLowerCase()

        .trim()

        .replace(
            /district/g,
            ""
        )

        .replace(
            /район/g,
            ""
        )

        .replace(
            /область/g,
            ""
        )

        .replace(
            /['’`]/g,
            ""
        )

        .replace(
            /q/g,
            "k"
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();
}


/* =====================================================
   SEARCH ALIASES
===================================================== */

const SEARCH_ALIASES = {

    mingbuloq:
        "mingbulak",

    mingbulak:
        "mingbuloq",

    toshkent:
        "tashkent",

    tashkent:
        "toshkent",

    andijon:
        "andijan",

    andijan:
        "andijon",

    buxoro:
        "bukhara",

    bukhara:
        "buxoro",

    jizzax:
        "jizzakh",

    jizzakh:
        "jizzax",

    qashqadaryo:
        "kashkadarya",

    kashkadarya:
        "qashqadaryo",

    surxondaryo:
        "surkhandarya",

    surkhandarya:
        "surxondaryo"
};


/* =====================================================
   LOAD NAQSHA DATA
===================================================== */

async function loadNaqshaData() {

    console.log(
        "🇺🇿 Naqsha: подключение к Supabase..."
    );


    const [

        regions,

        districts

    ] = await Promise.all([

        supabaseRPC(
            "get_regions_geojson"
        ),

        supabaseRPC(
            "get_districts_geojson"
        )

    ]);


    regionsData =
        regions;

    districtsData =
        districts;


    if (
        !regionsData ||
        regionsData.type !==
            "FeatureCollection"
    ) {

        throw new Error(
            "get_regions_geojson вернул неправильный формат"
        );
    }


    if (
        !districtsData ||
        districtsData.type !==
            "FeatureCollection"
    ) {

        throw new Error(
            "get_districts_geojson вернул неправильный формат"
        );
    }


    console.log(
        "Областей:",
        regionsData.features.length
    );


    console.log(
        "Районов:",
        districtsData.features.length
    );


    regionsData.features =
        regionsData.features.filter(
            function(feature) {

                return (
                    feature &&
                    feature.geometry &&
                    feature.geometry.coordinates
                );

            }
        );


    districtsData.features =
        districtsData.features.filter(
            function(feature) {

                return (
                    feature &&
                    feature.geometry &&
                    feature.geometry.coordinates
                );

            }
        );


    console.log(
        "Областей после проверки:",
        regionsData.features.length
    );


    console.log(
        "Районов после проверки:",
        districtsData.features.length
    );
}


/* =====================================================
   MAP LOAD
===================================================== */

map.on(
    "load",
    async function() {

        try {

            await loadNaqshaData();


            /* ==============================
               REGIONS
            ============================== */

            map.addSource(
                "naqsha-regions",
                {
                    type:
                        "geojson",

                    data:
                        regionsData
                }
            );


            map.addLayer({

                id:
                    "naqsha-region-borders",

                type:
                    "line",

                source:
                    "naqsha-regions",

                paint: {

                    "line-color":
                        "#555555",

                    "line-width": [
                        "interpolate",
                        ["linear"],
                        ["zoom"],
                        4,
                        1,
                        7,
                        1.3,
                        12,
                        2
                    ],

                    "line-opacity":
                        0.75
                }
            });


            /* ==============================
               DISTRICTS
            ============================== */

            map.addSource(
                "naqsha-districts",
                {
                    type:
                        "geojson",

                    data:
                        districtsData
                }
            );


            /* ==============================
               SELECTED DISTRICT
            ============================== */

            map.addLayer({

                id:
                    "naqsha-district-selected",

                type:
                    "fill",

                source:
                    "naqsha-districts",

                minzoom:
                    5,

                maxzoom:
                    14,

                paint: {

                    "fill-color":
                        "#18a84a",

                    "fill-opacity":
                        0.45
                },

                filter: [

                    "==",

                    [
                        "to-string",
                        [
                            "get",
                            "id"
                        ]
                    ],

                    "__NO_DISTRICT__"
                ]
            });


            /* ==============================
               CLICK LAYER
            ============================== */

            map.addLayer({

                id:
                    "naqsha-district-click",

                type:
                    "fill",

                source:
                    "naqsha-districts",

                minzoom:
                    5,

                maxzoom:
                    14,

                paint: {

                    "fill-color":
                        "#ffffff",

                    "fill-opacity":
                        0.001
                }
            });


            /* ==============================
               DISTRICT BORDERS
            ============================== */

            map.addLayer({

                id:
                    "naqsha-district-borders",

                type:
                    "line",

                source:
                    "naqsha-districts",

                minzoom:
                    6,

                paint: {

                    "line-color":
                        "#555555",

                    "line-width": [
                        "interpolate",
                        ["linear"],
                        ["zoom"],
                        6,
                        0.7,
                        9,
                        1.2,
                        13,
                        2
                    ],

                    "line-opacity":
                        0.8
                }
            });


            /* ==============================
               CLICK DISTRICT
            ============================== */

            map.on(
                "click",
                "naqsha-district-click",
                function(event) {

                    try {

                        if (
                            !event.features ||
                            !event.features.length
                        ) {
                            return;
                        }


                        selectDistrict(
                            event.features[0],
                            event.lngLat
                        );

                    }
                    catch(error) {

                        console.error(
                            "District click error:",
                            error
                        );

                    }
                }
            );


            /* ==============================
               CURSOR
            ============================== */

            map.on(
                "mouseenter",
                "naqsha-district-click",
                function() {

                    map.getCanvas()
                        .style
                        .cursor =
                        "pointer";

                }
            );


            map.on(
                "mouseleave",
                "naqsha-district-click",
                function() {

                    map.getCanvas()
                        .style
                        .cursor =
                        "";

                }
            );


            /* ==============================
               STREETS
            ============================== */

            setupStreetInteraction();


            /* ==============================
               BUILDINGS
            ============================== */

            setupBuildingInteraction();


            /* ==============================
               READY
            ============================== */

            document
                .getElementById(
                    "loading"
                )
                .style.display =
                "none";


            console.log(
                "=============================="
            );

            console.log(
                "✅ NAQSHA ГОТОВ"
            );

            console.log(
                "Regions:",
                regionsData.features.length
            );

            console.log(
                "Districts:",
                districtsData.features.length
            );

            console.log(
                "=============================="
            );

        }

        catch(error) {

            console.error(
                "❌ NAQSHA ERROR:",
                error
            );


            document
                .getElementById(
                    "loading"
                )
                .textContent =
                "Ошибка подключения к Naqsha";


            showInfo(
                "❌ Ошибка",
                error.message
            );

        }
    }
);


/* =====================================================
   SELECT DISTRICT
===================================================== */

function selectDistrict(
    feature,
    lngLat
) {

    if (!feature) {
        return;
    }


    selectedDistrict =
        feature;


    const properties =
        feature.properties || {};


    const districtId =
        properties.id != null
            ? String(properties.id)
            : null;


    const districtName =
        properties.name ||
        "Район";


    const regionName =
        properties.region_name ||
        "Узбекистан";


    console.log(
        "📍 Выбран район:",
        districtName
    );


    console.log(
        "ID:",
        districtId
    );


    console.log(
        "Region:",
        regionName
    );


    /* ==============================
       HIGHLIGHT
    ============================== */

    if (
        districtId !== null &&
        map.getLayer(
            "naqsha-district-selected"
        )
    ) {

        map.setFilter(

            "naqsha-district-selected",

            [

                "==",

                [
                    "to-string",
                    [
                        "get",
                        "id"
                    ]
                ],

                districtId
            ]
        );
    }


    /* ==============================
       INFO
    ============================== */

    showInfo(

        "📍 " +
        districtName,

        "Область: " +
        regionName

    );


    /* ==============================
       FLY
    ============================== */

    if (
        lngLat &&
        Number.isFinite(
            Number(lngLat.lng)
        ) &&
        Number.isFinite(
            Number(lngLat.lat)
        )
    ) {

        map.flyTo({

            center: [

                Number(lngLat.lng),
                Number(lngLat.lat)

            ],

            zoom:
                Math.max(
                    map.getZoom(),
                    8
                ),

            speed:
                0.8
        });
    }
}


/* =====================================================
   SELECT DISTRICT FROM SEARCH
===================================================== */

function selectDistrictFromSearch(
    feature
) {

    const center =
        getFeatureCenter(
            feature
        );


    if (!center) {

        console.warn(
            "Не удалось определить центр района."
        );

        return;
    }


    selectDistrict(

        feature,

        {
            lng:
                center[0],

            lat:
                center[1]
        }
    );
}


/* =====================================================
   INFO
===================================================== */

function showInfo(
    title,
    body
) {

    document
        .getElementById(
            "infoTitle"
        )
        .textContent =
        title;


    document
        .getElementById(
            "infoBody"
        )
        .innerHTML =
        escapeHTML(body);


    document
        .getElementById(
            "infoPanel"
        )
        .style.display =
        "block";
}


function closeInfo() {

    document
        .getElementById(
            "infoPanel"
        )
        .style.display =
        "none";
}


/* =====================================================
   STREET LAYERS
===================================================== */

function getStreetLayerIds() {

    const layers =
        map.getStyle().layers || [];


    return layers

        .filter(
            function(layer) {

                return (

                    layer.source ===
                        "openmaptiles"

                    &&

                    (
                        layer[
                            "source-layer"
                        ] ===
                            "transportation"

                        ||

                        layer[
                            "source-layer"
                        ] ===
                            "transportation_name"
                    )
                );

            }
        )

        .map(
            function(layer) {

                return layer.id;

            }
        );
}


/* =====================================================
   STREET INTERACTION
===================================================== */

function setupStreetInteraction() {

    const layers =
        getStreetLayerIds();


    console.log(
        "🛣️ Слои улиц:",
        layers
    );


    if (!layers.length) {

        console.warn(
            "Слои улиц не найдены."
        );

        return;
    }


    layers.forEach(
        function(layerId) {

            map.on(
                "mouseenter",
                layerId,
                function() {

                    if (
                        map.getZoom() >=
                        10
                    ) {

                        map.getCanvas()
                            .style
                            .cursor =
                            "pointer";
                    }

                }
            );


            map.on(
                "mouseleave",
                layerId,
                function() {

                    map.getCanvas()
                        .style
                        .cursor =
                        "";

                }
            );


            map.on(
                "click",
                layerId,
                function(event) {

                    try {

                        if (
                            map.getZoom() < 10
                        ) {
                            return;
                        }


                        if (
                            !event.features ||
                            !event.features.length
                        ) {
                            return;
                        }


                        showStreetInfo(
                            event.features[0]
                        );

                    }
                    catch(error) {

                        console.error(
                            "Street error:",
                            error
                        );

                    }
                }
            );

        }
    );
}


/* =====================================================
   STREET INFO
===================================================== */

function showStreetInfo(
    feature
) {

    const properties =
        feature.properties || {};


    const name =

        properties.name ||

        properties["name:ru"] ||

        properties["name:latin"] ||

        properties.name_en ||

        properties.ref ||

        "Улица без названия";


    let type =

        properties.class ||

        properties.subclass ||

        "улица";


    const typeNames = {

        motorway:
            "Автомагистраль",

        trunk:
            "Главная дорога",

        primary:
            "Главная улица",

        secondary:
            "Улица",

        tertiary:
            "Улица",

        residential:
            "Жилая улица",

        service:
            "Проезд",

        pedestrian:
            "Пешеходная улица",

        track:
            "Дорога",

        path:
            "Тропа"
    };


    type =
        typeNames[type] ||
        type;


    showInfo(

        "🛣️ " +
        name,

        "Тип: " +
        type
    );
}


/* =====================================================
   BUILDING LAYERS
===================================================== */

function getBuildingLayerIds() {

    const layers =
        map.getStyle().layers || [];


    return layers

        .filter(
            function(layer) {

                return (

                    layer.source ===
                        "openmaptiles"

                    &&

                    layer[
                        "source-layer"
                    ] ===
                        "building"
                );

            }
        )

        .map(
            function(layer) {

                return layer.id;

            }
        );
}


/* =====================================================
   BUILDING INTERACTION
===================================================== */

function setupBuildingInteraction() {

    const layers =
        getBuildingLayerIds();


    console.log(
        "🏠 Слои зданий:",
        layers
    );


    if (!layers.length) {

        console.warn(
            "Слои зданий не найдены."
        );

        return;
    }


    layers.forEach(
        function(layerId) {

            map.on(
                "mouseenter",
                layerId,
                function() {

                    if (
                        map.getZoom() >=
                        13
                    ) {

                        map.getCanvas()
                            .style
                            .cursor =
                            "pointer";
                    }

                }
            );


            map.on(
                "mouseleave",
                layerId,
                function() {

                    map.getCanvas()
                        .style
                        .cursor =
                        "";

                }
            );


            map.on(
                "click",
                layerId,
                function(event) {

                    try {

                        if (
                            map.getZoom() < 13
                        ) {
                            return;
                        }


                        if (
                            !event.features ||
                            !event.features.length
                        ) {
                            return;
                        }


                        showBuildingInfo(
                            event.features[0]
                        );

                    }
                    catch(error) {

                        console.error(
                            "Building error:",
                            error
                        );

                    }
                }
            );

        }
    );
}


/* =====================================================
   BUILDING INFO
===================================================== */

function showBuildingInfo(
    feature
) {

    const properties =
        feature.properties || {};


    const street =

        properties["addr:street"] ||

        properties.street ||

        properties["name:ru"] ||

        properties.name ||

        null;


    const houseNumber =

        properties["addr:housenumber"] ||

        properties.housenumber ||

        properties.house_number ||

        null;


    let html = "";


    if (street) {

        html +=
            "Улица: " +
            escapeHTML(street);
    }


    if (houseNumber) {

        if (html) {
            html += "<br>";
        }


        html +=
            "Дом: " +
            escapeHTML(
                houseNumber
            );
    }


    if (!html) {

        html =
            "Информация об адресе пока отсутствует.";
    }


    document
        .getElementById(
            "infoTitle"
        )
        .textContent =
        "🏠 Здание";


    document
        .getElementById(
            "infoBody"
        )
        .innerHTML =
        html;


    document
        .getElementById(
            "infoPanel"
        )
        .style.display =
        "block";
}

/* =====================================================
   SEARCH LOCATION
===================================================== */

async function searchLocation() {

    const query =
        searchInput.value.trim();


    if (!query) {
        return;
    }


    searchResults.style.display =
        "none";


    console.log(
        "🔎 Поиск:",
        query
    );


    /* =================================================
       NAQSHA / SUPABASE
    ================================================= */

    if (
        districtsData &&
        districtsData.features
    ) {

        const normalizedQuery =
            normalizeSearchText(
                query
            );


        console.log(
            "🔎 Нормализованный запрос:",
            normalizedQuery
        );


        let district = null;


        /* =================================================
           1. ТОЧНОЕ СОВПАДЕНИЕ
        ================================================= */

        district =
            districtsData.features.find(
                function(feature) {

                    const properties =
                        feature.properties || {};


                    const name =
                        normalizeSearchText(
                            properties.name
                        );


                    return (
                        name ===
                        normalizedQuery
                    );

                }
            );


        /* =================================================
           2. ЧАСТИЧНОЕ СОВПАДЕНИЕ
        ================================================= */

        if (!district) {

            district =
                districtsData.features.find(
                    function(feature) {

                        const properties =
                            feature.properties || {};


                        const name =
                            normalizeSearchText(
                                properties.name
                            );


                        return (

                            name.includes(
                                normalizedQuery
                            )

                            ||

                            normalizedQuery.includes(
                                name
                            )

                        );

                    }
                );

        }


        /* =================================================
           3. ALIAS
        ================================================= */

        if (!district) {

            const alternative =
                SEARCH_ALIASES[
                    normalizedQuery
                ];


            if (alternative) {

                district =
                    districtsData.features.find(
                        function(feature) {

                            const properties =
                                feature.properties || {};


                            const name =
                                normalizeSearchText(
                                    properties.name
                                );


                            return (
                                name.includes(
                                    alternative
                                )
                            );

                        }
                    );

            }

        }


        /* =================================================
           НАШЛИ В NAQSHA
        ================================================= */

        if (district) {

            console.log(
                "✅ NAQSHA: район найден в Supabase"
            );


            console.log(
                "ID:",
                district.properties?.id
            );


            console.log(
                "Название:",
                district.properties?.name
            );


            console.log(
                "Данные:",
                district.properties
            );


            selectDistrictFromSearch(
                district
            );


            return;
        }


        console.log(
            "⚠️ В базе Naqsha район не найден."
        );
    }


    /* =================================================
       NOMINATIM FALLBACK
    ================================================= */

    console.log(
        "🌍 Используем Nominatim как запасной поиск..."
    );


    try {

        const url =

            "https://nominatim.openstreetmap.org/search" +

            "?format=jsonv2" +

            "&limit=5" +

            "&countrycodes=uz" +

            "&accept-language=ru" +

            "&q=" +

            encodeURIComponent(
                query
            );


        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                "Nominatim HTTP " +
                response.status
            );
        }


        const results =
            await response.json();


        if (
            !results ||
            !results.length
        ) {

            showInfo(
                "🔎 Ничего не найдено",
                "Naqsha и OpenStreetMap ничего не нашли."
            );

            return;
        }


        const result =
            results[0];


        const lat =
            Number(
                result.lat
            );


        const lon =
            Number(
                result.lon
            );


        if (
            !Number.isFinite(lat) ||
            !Number.isFinite(lon)
        ) {

            throw new Error(
                "Nominatim вернул неправильные координаты."
            );
        }


        map.flyTo({

            center: [
                lon,
                lat
            ],

            zoom:
                14,

            speed:
                1
        });


        setTimeout(
            function() {

                showInfo(

                    "📍 " +
                    (
                        result.name ||
                        query
                    ),

                    result.display_name ||
                    "Адрес найден"

                );

            },
            700
        );

    }

    catch(error) {

        console.error(
            "❌ SEARCH ERROR:",
            error
        );


        showInfo(
            "❌ Ошибка поиска",
            "Не удалось выполнить поиск."
        );
    }
}


/* =====================================================
   SEARCH SUGGESTIONS
===================================================== */

function showSearchResults(text) {

    searchResults.innerHTML = "";


    if (!text.trim()) {

        searchResults.style.display =
            "none";

        return;
    }


    if (
        !districtsData ||
        !districtsData.features
    ) {

        return;
    }


    const query =
        normalizeSearchText(
            text
        );


    const results =

        districtsData.features

            .filter(
                function(feature) {

                    const properties =
                        feature.properties || {};


                    const name =
                        normalizeSearchText(
                            properties.name
                        );


                    const region =
                        normalizeSearchText(
                            properties.region_name
                        );


                    const alias =
                        SEARCH_ALIASES[
                            query
                        ];


                    return (

                        name.includes(
                            query
                        )

                        ||

                        region.includes(
                            query
                        )

                        ||

                        (
                            alias &&
                            name.includes(
                                alias
                            )
                        )

                    );

                }
            )

            .slice(
                0,
                10
            );


    if (!results.length) {

        searchResults.style.display =
            "none";

        return;
    }


    results.forEach(
        function(feature) {

            const properties =
                feature.properties || {};


            const name =
                properties.name ||
                "Район";


            const region =
                properties.region_name ||
                "";


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "search-result";


            item.textContent =

                "📍 " +
                name +
                (
                    region
                        ? " — " +
                          region
                        : ""
                );


            item.addEventListener(
                "click",
                function() {

                    searchInput.value =
                        name;


                    searchResults.style.display =
                        "none";


                    console.log(
                        "Выбран район из Naqsha:",
                        properties
                    );


                    selectDistrictFromSearch(
                        feature
                    );

                }
            );


            searchResults.appendChild(
                item
            );

        }
    );


    searchResults.style.display =
        "block";
}


/* =====================================================
   GEOJSON CENTER
===================================================== */

function getFeatureCenter(
    feature
) {

    if (
        !feature ||
        !feature.geometry ||
        !feature.geometry.coordinates
    ) {

        return null;
    }


    const coordinates = [];


    function collect(value) {

        if (
            !Array.isArray(value)
        ) {
            return;
        }


        if (

            value.length >= 2 &&

            typeof value[0] ===
                "number" &&

            typeof value[1] ===
                "number"

        ) {

            coordinates.push(
                value
            );

            return;
        }


        value.forEach(
            collect
        );
    }


    collect(
        feature.geometry.coordinates
    );


    if (
        !coordinates.length
    ) {

        return null;
    }


    let lng = 0;

    let lat = 0;

    let count = 0;


    coordinates.forEach(
        function(point) {

            const pointLng =
                Number(
                    point[0]
                );


            const pointLat =
                Number(
                    point[1]
                );


            if (

                Number.isFinite(
                    pointLng
                )

                &&

                Number.isFinite(
                    pointLat
                )

            ) {

                lng +=
                    pointLng;

                lat +=
                    pointLat;

                count++;
            }

        }
    );


    if (
        count === 0
    ) {

        return null;
    }


    return [

        lng / count,

        lat / count

    ];
}
