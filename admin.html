<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Naqsha Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;font:15px Arial;color:#111}header{background:#fff;padding:18px;position:sticky;top:0;z-index:2;box-shadow:0 2px 10px #0002}.wrap{max-width:1200px;margin:auto;padding:15px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:15px;box-shadow:0 2px 12px #0001}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{border:0;border-radius:10px;padding:11px 15px;font-weight:bold}.active,.primary{background:#1677ff!important;color:white}.success{background:#18a84a;color:white}.danger{background:#e53935;color:white}.gray{background:#e9edf1}button{border:0;border-radius:10px;padding:10px 14px;font-weight:bold;cursor:pointer}input,select,textarea{width:100%;padding:11px;border:1px solid #d5d9de;border-radius:10px;font-size:15px}textarea{min-height:90px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.layout{display:grid;grid-template-columns:1fr 1.2fr;gap:15px}.list{max-height:600px;overflow:auto;border:1px solid #eee;border-radius:12px}.item{padding:12px;border-bottom:1px solid #eee;cursor:pointer}.item:hover,.item.sel{background:#eef5ff}.item b{display:block}.small{font-size:13px;color:#777}.notice{display:none;padding:10px;border-radius:10px;margin-top:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#f7f9fb;padding:14px;border-radius:12px}.stat b{font-size:24px;display:block}@media(max-width:800px){.layout,.grid,.grid3{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
</style></head><body>
<header><b>🇺🇿 Naqsha — Admin</b><div class="small">Области · районы · города · 4 языка</div></header><div class="wrap">
<section id="login" class="card"><h2>🔐 Вход</h2><input id="email" type="email" placeholder="Email"><br><br><input id="pass" type="password" placeholder="Пароль"><div class="actions"><button id="loginBtn" class="primary">Войти</button></div><div id="loginMsg" class="notice"></div></section>
<main id="app" class="hidden">
<section class="card"><div class="stats"><div class="stat"><b id="rc">—</b>Областей</div><div class="stat"><b id="dc">—</b>Районов</div><div class="stat"><b id="cc">—</b>Городов</div><div class="stat"><b id="ue">—</b>Админ</div></div><div class="actions"><button id="refresh" class="gray">🔄 Обновить</button><button id="logout" class="gray">Выйти</button></div><div id="global" class="notice"></div></section>
<div class="tabs"><button class="active" data-tab="regions">🗺️ Области</button><button data-tab="districts">📍 Районы</button><button data-tab="cities">🏙️ Города</button></div>
<section id="regions" class="card"><h2>🗺️ Области</h2><div class="actions"><input id="rs" placeholder="Поиск области"><button id="newR" class="primary">＋ Добавить</button></div><div class="layout"><div class="list" id="rl"></div><div><h3 id="rt">Новая область</h3><label>ID *</label><input id="rid"><label>EN *</label><input id="rn"><div class="grid3"><div><label>RU *</label><input id="rr"></div><div><label>UZ Latin *</label><input id="ru"></div><div><label>UZ Кирилл *</label><input id="rcy"></div></div><div class="actions"><button id="saveR" class="success">💾 Сохранить</button><button id="delR" class="danger hidden">🗑️ Удалить</button></div><div id="rm" class="notice"></div></div></div></section>
<section id="districts" class="card hidden"><h2>📍 Районы</h2><div class="actions"><input id="ds" placeholder="Поиск района"><select id="df"></select><button id="newD" class="primary">＋ Добавить</button></div><div class="layout"><div class="list" id="dl"></div><div><h3 id="dt">Новый район</h3><label>ID *</label><input id="did"><label>Область *</label><select id="dr"></select><label>EN *</label><input id="dn"><div class="grid3"><div><label>RU *</label><input id="dru"></div><div><label>UZ Latin *</label><input id="du"></div><div><label>UZ Кирилл *</label><input id="dcy"></div></div><label>Центр</label><input id="dcenter"><div class="grid"><div><label>Население</label><input id="dp" type="number" min="0"></div><div><label>Площадь км²</label><input id="da" type="number" min="0" step=".01"></div></div><label>Описание</label><textarea id="ddesc"></textarea><div class="actions"><button id="saveD" class="success">💾 Сохранить</button><button id="delD" class="danger hidden">🗑️ Удалить</button></div><div id="dm" class="notice"></div></div></div></section>
<section id="cities" class="card hidden"><h2>🏙️ Города</h2><div class="actions"><input id="cs" placeholder="Поиск города"><select id="cf"></select><button id="newC" class="primary">＋ Добавить</button></div><div class="layout"><div class="list" id="cl"></div><div><h3 id="ct">Новый город</h3><label>ID (пусто = автоматически)</label><input id="cid" type="number" min="1"><label>EN *</label><input id="cn"><div class="grid3"><div><label>RU *</label><input id="cru"></div><div><label>UZ Latin *</label><input id="cu"></div><div><label>UZ Кирилл *</label><input id="ccy"></div></div><label>Область *</label><select id="cr"></select><label>Район</label><select id="cd"></select><label>Население</label><input id="cp" type="number" min="0"><label>Описание</label><textarea id="cdesc"></textarea><div class="actions"><button id="saveC" class="success">💾 Сохранить</button><button id="delC" class="danger hidden">🗑️ Удалить</button></div><div id="cm" class="notice"></div></div></div></section>
</main></div>
<script>
const URL='https://vhrhtykcrjqqiwwggomi.supabase.co',KEY='sb_publishable_N9MAdF7_GW-IUFOXxY2MHQ_MG1ep1vg';let S=null,R=[],D=[],C=[],sel={r:null,d:null,c:null},mode={r:0,d:0,c:0};const $=x=>document.getElementById(x);
const msg=(id,t,ok=true)=>{let e=$(id);e.style.display='block';e.style.background=ok?'#eef9f0':'#fff0f0';e.style.color=ok?'#17752e':'#a00000';e.textContent=t};
async function rpc(n,b={}){let r=await fetch(URL+'/rest/v1/rpc/'+n,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+S.access_token,'Content-Type':'application/json'},body:JSON.stringify(b)}),t=await r.text();if(!r.ok)throw Error(n+' HTTP '+r.status+': '+t);return t?JSON.parse(t):null}
async function login(){try{let r=await fetch(URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('pass').value})}),d=await r.json();if(!r.ok)throw Error(d.error_description||d.msg||'Ошибка входа');S=d;localStorage.setItem('naqsha_admin_session',JSON.stringify(d));$('login').classList.add('hidden');$('app').classList.remove('hidden');$('ue').textContent=d.user?.email||'admin';await load()}catch(e){msg('loginMsg','❌ '+e.message,false)}}
function p(f){let x=f.properties||{};return{id:x.id??f.id,name:x.name||'',ru:x.name_ru||'',uz:x.name_uz||'',cy:x.name_uz_cy||'',en:x.name_en||'',ri:x.region_id||'',rn:x.region_name||'',di:x.district_id||'',dn:x.district_name||'',center:x.center||'',pop:x.population??'',area:x.area??'',desc:x.description||''}}
async function load(){try{let [r,d,c]=await Promise.all([rpc('get_regions_geojson'),rpc('get_districts_geojson'),rpc('get_cities_geojson')]);R=(r.features||[]).map(p);D=(d.features||[]).map(p);C=(c.features||[]).map(p);$('rc').textContent=R.length;$('dc').textContent=D.length;$('cc').textContent=C.length;fill();renderR();renderD();renderC()}catch(e){msg('global','❌ '+e.message,false);throw e}}
function fill(){let a=R;[['df',1],['dr',0],['cf',1],['cr',0]].forEach(([id,all])=>{let s=$(id),old=s.value;s.innerHTML='<option value="">'+(all?'Все области':'Выберите область')+'</option>';a.forEach(r=>{let o=document.createElement('option');o.value=r.id;o.textContent=r.ru||r.name;s.appendChild(o)});if([...s.options].some(o=>o.value==old))s.value=old})}
const filt=(a,q,keys)=>a.filter(x=>!q||keys.map(k=>String(x[k]||'').toLowerCase()).some(v=>v.includes(q)));
function renderR(){let a=filt(R,$('rs').value.toLowerCase(),['id','name','ru','uz','cy']),l=$('rl');l.innerHTML='';a.forEach(x=>{let e=document.createElement('div');e.className='item'+(sel.r?.id==x.id?' sel':'');e.innerHTML='<b>'+x.ru+'</b><small>'+x.name+' · '+x.id+'</small>';e.onclick=()=>editR(x);l.appendChild(e)})}
function editR(x){sel.r=x;mode.r=1;$('rt').textContent='Редактирование';$('rid').value=x.id;$('rid').readOnly=true;$('rn').value=x.name;$('rr').value=x.ru;$('ru').value=x.uz;$('rcy').value=x.cy;$('delR').classList.remove('hidden');renderR()}
function newR(){sel.r=null;mode.r=0;$('rt').textContent='Новая область';['rid','rn','rr','ru','rcy'].forEach(i=>$(i).value='');$('rid').readOnly=false;$('delR').classList.add('hidden')}
function valid(ids){let ok=true;ids.forEach(i=>{let e=$(i);e.style.borderColor='';if(!e.value.trim()){e.style.borderColor='#e53935';ok=false}});return ok}
$('saveR').onclick=async()=>{if(!valid(['rid','rn','rr','ru','rcy']))return msg('rm','❌ Заполни все обязательные поля.',false);try{let b={p_id:$('rid').value.trim(),p_name:$('rn').value.trim(),p_name_ru:$('rr').value.trim(),p_name_uz:$('ru').value.trim(),p_name_uz_cy:$('rcy').value.trim()};await rpc(mode.r?'admin_update_region':'admin_create_region',b);msg('rm','✅ Сохранено');await load();newR()}catch(e){msg('rm','❌ '+e.message,false)}}
$('delR').onclick=async()=>{if(sel.r&&!confirm('Удалить область?'))return;try{await rpc('admin_delete_region',{p_id:sel.r.id});await load();newR()}catch(e){msg('rm','❌ '+e.message,false)}};$('newR').onclick=newR;$('rs').oninput=renderR;
function renderD(){let q=$('ds').value.toLowerCase(),rf=$('df').value,a=D.filter(x=>(!rf||x.ri==rf)&&(!q||[x.id,x.name,x.ru,x.uz,x.cy,x.rn].some(v=>String(v).toLowerCase().includes(q)))),l=$('dl');l.innerHTML='';a.forEach(x=>{let e=document.createElement('div');e.className='item'+(sel.d?.id==x.id?' sel':'');e.innerHTML='<b>'+x.ru+'</b><small>'+x.rn+' · '+x.id+'</small>';e.onclick=()=>editD(x);l.appendChild(e)})}
function editD(x){sel.d=x;mode.d=1;$('dt').textContent='Редактирование';$('did').value=x.id;$('did').readOnly=true;$('dr').value=x.ri;$('dn').value=x.name;$('dru').value=x.ru;$('du').value=x.uz;$('dcy').value=x.cy;$('dcenter').value=x.center;$('dp').value=x.pop;$('da').value=x.area;$('ddesc').value=x.desc;$('delD').classList.remove('hidden');renderD()}
function newD(){sel.d=null;mode.d=0;$('dt').textContent='Новый район';['did','dn','dru','du','dcy','dcenter','dp','da','ddesc'].forEach(i=>$(i).value='');$('dr').value='';$('did').readOnly=false;$('delD').classList.add('hidden')}
$('saveD').onclick=async()=>{if(!valid(['did','dr','dn','dru','du','dcy']))return msg('dm','❌ Заполни обязательные поля.',false);try{let b={p_id:$('did').value.trim(),p_region_id:$('dr').value,p_name:$('dn').value.trim(),p_name_ru:$('dru').value.trim(),p_name_uz:$('du').value.trim(),p_name_en:$('dn').value.trim(),p_name_uz_cy:$('dcy').value.trim(),p_center:$('dcenter').value.trim(),p_population:$('dp').value===''?null:+$('dp').value,p_area:$('da').value===''?null:+$('da').value,p_description:$('ddesc').value.trim()};await rpc(mode.d?'admin_update_district':'admin_create_district',b);msg('dm','✅ Сохранено');await load();newD()}catch(e){msg('dm','❌ '+e.message,false)}};$('delD').onclick=async()=>{if(sel.d&&!confirm('Удалить район?'))return;try{await rpc('admin_delete_district',{p_id:sel.d.id});await load();newD()}catch(e){msg('dm','❌ '+e.message,false)}};$('newD').onclick=newD;$('ds').oninput=renderD;$('df').onchange=renderD;
function districts(r){return D.filter(x=>x.ri==r).sort((a,b)=>a.ru.localeCompare(b.ru))}
function fillCD(r,chosen=''){let s=$('cd');s.innerHTML='<option value="">Без района</option>';if(!r){s.disabled=true;return}s.disabled=false;districts(r).forEach(x=>{let o=document.createElement('option');o.value=x.id;o.textContent=x.ru;s.appendChild(o)});s.value=chosen||''}
function renderC(){let q=$('cs').value.toLowerCase(),rf=$('cf').value,a=C.filter(x=>(!rf||x.ri==rf)&&(!q||[x.id,x.name,x.ru,x.uz,x.cy,x.rn,x.dn].some(v=>String(v).toLowerCase().includes(q)))),l=$('cl');l.innerHTML='';a.forEach(x=>{let e=document.createElement('div');e.className='item'+(sel.c?.id==x.id?' sel':'');e.innerHTML='<b>'+x.ru+'</b><small>'+x.rn+(x.dn?' · '+x.dn:'')+' · ID '+x.id+'</small>';e.onclick=()=>editC(x);l.appendChild(e)})}
function editC(x){sel.c=x;mode.c=1;$('ct').textContent='Редактирование';$('cid').value=x.id;$('cid').readOnly=true;$('cn').value=x.name;$('cru').value=x.ru;$('cu').value=x.uz;$('ccy').value=x.cy;$('cr').value=x.ri;fillCD(x.ri,x.di);$('cp').value=x.pop;$('cdesc').value=x.desc;$('delC').classList.remove('hidden');renderC()}
function newC(){sel.c=null;mode.c=0;$('ct').textContent='Новый город';['cid','cn','cru','cu','ccy','cp','cdesc'].forEach(i=>$(i).value='');$('cid').readOnly=false;$('cr').value='';fillCD('');$('delC').classList.add('hidden')}
$('cr').onchange=()=>fillCD($('cr').value);$('saveC').onclick=async()=>{if(!valid(['cn','cru','cu','ccy','cr']))return msg('cm','❌ Заполни обязательные поля.',false);try{let b={p_id:$('cid').value===''?null:+$('cid').value,p_region_id:$('cr').value,p_district_id:$('cd').value||null,p_name:$('cn').value.trim(),p_name_ru:$('cru').value.trim(),p_name_uz:$('cu').value.trim(),p_name_uz_cy:$('ccy').value.trim(),p_population:$('cp').value===''?null:+$('cp').value,p_description:$('cdesc').value.trim()};await rpc(mode.c?'admin_update_city':'admin_create_city',b);msg('cm','✅ Сохранено');await load();newC()}catch(e){msg('cm','❌ '+e.message,false)}};$('delC').onclick=async()=>{if(sel.c&&!confirm('Удалить город?'))return;try{await rpc('admin_delete_city',{p_id:+sel.c.id});await load();newC()}catch(e){msg('cm','❌ '+e.message,false)}};$('newC').onclick=newC;$('cs').oninput=renderC;$('cf').onchange=renderC;
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('main section[id]').forEach(x=>x.classList.add('hidden'));b.classList.add('active');$(b.dataset.tab).classList.remove('hidden')});
$('refresh').onclick=async()=>{let b=$('refresh');b.disabled=true;b.textContent='⏳';try{await load();b.textContent='✅'}catch{b.textContent='❌'}setTimeout(()=>{b.textContent='🔄 Обновить';b.disabled=false},1200)};
$('logout').onclick=()=>{localStorage.removeItem('naqsha_admin_session');location.reload()};$('loginBtn').onclick=login;$('pass').onkeydown=e=>e.key==='Enter'&&login();
(async()=>{try{S=JSON.parse(localStorage.getItem('naqsha_admin_session')||'null')}catch{}if(S?.access_token){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('ue').textContent=S.user?.email||'admin';await load()}})();
</script></body></html>
